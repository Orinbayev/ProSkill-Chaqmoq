{% extends "base.html" %}
{% block content %}

<style>
/* === TITLE === */
.dashboard-title {
  color: #22c55e;
  font-weight: 700;
  font-size: 30px;
  margin-bottom: 30px;
}

/* === GRID === */
.panel-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 22px;
}

/* === CARD === */
.panel-card {
  background: rgba(17, 24, 39, 0.75);
  border: 1px solid rgba(55, 65, 81, 0.4);
  border-radius: 16px;
  padding: 24px 26px;
  transition: 0.28s ease;
  backdrop-filter: blur(12px);
  box-shadow: 0 4px 18px rgba(0,0,0,0.25);
}

.panel-card:hover {
  transform: translateY(-6px);
  background: rgba(30, 41, 59, 0.85);
  border-color: #22c55e;
  box-shadow: 0 10px 28px rgba(34,197,94,0.25);
}

.panel-title {
  color: #e2e8f0;
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 18px;
}

/* === BUTTONS === */
.panel-btn {
  width: 100%;
  padding: 14px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 12px;
  text-align: center;
  display: block;
  transition: 0.25s ease;
}

/* Blue button */
.btn-main {
  background: linear-gradient(90deg, #3b82f6, #2563eb);
  color: white;
  border: none;
}
.btn-main:hover {
  background: linear-gradient(90deg, #2563eb, #1e40af);
}

/* Green button */
.btn-green {
  background: linear-gradient(90deg, #22c55e, #16a34a);
  color: white;
}
.btn-green:hover {
  background: linear-gradient(90deg, #16a34a, #15803d);
}

/* Disabled (if needed) */
.btn-disabled {
  background: #6b7280;
  color: #e5e7eb;
  cursor: not-allowed;
  opacity: 0.6;
}

/* Notes */
.panel-note {
  font-size: 13px;
  color: #94a3b8;
  margin-top: 14px;
}

/* === RESPONSIVE === */
@media(max-width: 768px) {
  .dashboard-title {
    font-size: 26px;
  }
  .panel-card {
    padding: 20px;
  }
}
</style>

<h3 class="dashboard-title">👨‍🏫 O‘qituvchi paneli</h3>

<div class="panel-grid">

  <!-- 📘 Guruhlarim -->
  <div class="panel-card">
    <div class="panel-title">📘 Mening guruhlarim</div>
    <a href="{% url 'education:men_guruhlarim' %}" class="panel-btn btn-main">
      Guruhlarimni ko‘rish
    </a>
  </div>

  <!-- ⚡ Chaqmoq -->
  <div class="panel-card">
    <div class="panel-title">⚡ Chaqmoq</div>
    <a href="{% url 'chaqmoq:reyting' %}" class="panel-btn btn-green">
      Umumiy reyting
    </a>
  </div>

  <!-- 🛒 Do‘kon -->
  <div class="panel-card">
    <div class="panel-title">🛒 Do‘kon</div>
    <a href="{% url 'store:products' %}" class="panel-btn btn-main">
      Mahsulotlar (faqat ko‘rish)
    </a>
  </div>

</div>

{% endblock %}
