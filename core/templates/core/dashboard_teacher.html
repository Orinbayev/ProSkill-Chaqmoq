{% extends "base.html" %}
{% block content %}

<style>
.dashboard-title {
  color: #22c55e;
  font-weight: 700;
  font-size: 26px;
  margin-bottom: 25px;
}

/* GRID */
.panel-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 20px;
}

/* CARD */
.panel-card {
  background: #111827;
  border: 1px solid #1f2937;
  border-radius: 14px;
  padding: 20px 22px;
  transition: 0.25s;
}

.panel-card:hover {
  border-color: #22c55e;
  background: #1e293b;
  box-shadow: 0 4px 14px rgba(34,197,94,0.25);
}

.panel-title {
  color: #e5e7eb;
  font-weight: 600;
  margin-bottom: 15px;
  font-size: 18px;
}

/* buttons */
.panel-btn {
  width: 100%;
  padding: 10px 12px;
  font-size: 15px;
  font-weight: 600;
  border-radius: 10px;
  transition: 0.2s;
  text-align: center;
  display: block;
  text-decoration: none;
}

.btn-main {
  background: #3b82f6;
  color: white;
  border: none;
}
.btn-main:hover { background: #2563eb; }

.btn-green {
  background: #22c55e;
  color: white;
}
.btn-green:hover { background: #16a34a; }

.btn-disabled {
  background: #6b7280;
  color: #e5e7eb;
  cursor: not-allowed;
  opacity: 0.6;
}

.panel-note {
  font-size: 13px;
  color: #9ca3af;
  margin-top: 12px;
}
</style>


<h3 class="dashboard-title">👨‍🏫 O‘qituvchi paneli</h3>

<div class="panel-grid">

  <!-- Guruhlarim -->
  <div class="panel-card">
    <div class="panel-title">📘 Mening guruhlarim</div>
    <a href="{% url 'education:men_guruhlarim' %}" class="panel-btn btn-main">
      Guruhlarimni ko‘rish
    </a>
  </div>

  <!-- Chaqmoq -->
  <div class="panel-card">
    <div class="panel-title">⚡ Chaqmoq</div>
    <a href="{% url 'chaqmoq:reyting' %}" class="panel-btn btn-green mt-2">
      Umumiy reyting
    </a>
 
  </div>

  <!-- Do‘kon -->
  <div class="panel-card">
    <div class="panel-title">🛒 Do‘kon</div>
    <a href="{% url 'store:products' %}" class="panel-btn btn-main">
      Mahsulotlar (faqat ko‘rish)
    </a>
 
  </div>

</div>

{% endblock %}
