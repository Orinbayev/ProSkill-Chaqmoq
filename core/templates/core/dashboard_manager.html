{% extends 'base.html' %}
{% block content %}

<style>
.dashboard-title {
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 25px;
}

/* GRID */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 18px;
}

/* PREMIUM CARD */
.stat-card {
    background: #ffffff0d;
    padding: 18px;
    border-radius: 14px;
    text-decoration: none;
    display: block;
    color: white;
    transition: 0.25s ease;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.07);
    min-height: 130px;
}

.stat-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.25);
    border-color: rgba(0,150,255,0.4);
}

.stat-title {
    font-size: 14px;
    opacity: 0.7;
}

.stat-value {
    font-size: 28px;
    font-weight: 600;
    margin-top: 8px;
}

.stat-link {
    font-size: 12px;
    margin-top: 10px;
    color: #4db8ff !important;
}

/* CATEGORY BOX */
.section-card {
    background: #ffffff0d;
    border-radius: 14px;
    padding: 18px;
    color: white;
    border: 1px solid rgba(255,255,255,0.07);
    backdrop-filter: blur(6px);
    margin-top: 22px;
}

.section-card h5 {
    margin-bottom: 14px;
    font-weight: 600;
}

.section-card .btn {
    font-weight: 500;
}
</style>

<h3 class="dashboard-title">Manager paneli</h3>

<!-- TOP GRID -->
<div class="stats-grid">

    <a class="stat-card" href="{% url 'core:stat_teachers' %}">
        <div class="stat-title">O‘qituvchilar</div>
        <div class="stat-value">{{ stats.teachers|default:0 }}</div>
    </a>

    <a class="stat-card" href="{% url 'core:stat_students' %}">
        <div class="stat-title">O‘quvchilar</div>
        <div class="stat-value">{{ stats.students|default:0 }}</div>
    </a>

    <a class="stat-card" href="{% url 'core:stat_products' %}">
        <div class="stat-title">Mahsulotlar</div>
        <div class="stat-value">{{ stats.products|default:0 }}</div>
    </a>

    <a class="stat-card" href="{% url 'core:stat_requests' %}">
        <div class="stat-title">Kutilayotgan so‘rov</div>
        <div class="stat-value">{{ stats.pending_requests|default:0 }}</div>
    </a>



</div>

<!-- SECTIONS -->
<div class="row">






    

</div>

{% endblock %}
