{% extends "base.html" %}
{% block content %}

<style>
.edit-box {
    max-width: 900px;
    margin: 0 auto;
    background: rgba(255,255,255,0.05);
    padding: 28px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    backdrop-filter: blur(8px);
}
.edit-title {
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 20px;
}
.form-label { color: #cbd5e1; font-weight: 500; }
.form-control {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 10px;
}
.form-control:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 0 3px rgba(56,189,248,0.4);
}
.btn-save {
    background: #22c55e;
    padding: 10px 20px;
    font-weight: 600;
    color: #fff;
    border-radius: 10px;
}
.btn-cancel {
    background: rgba(255,255,255,0.12);
    padding: 10px 20px;
    font-weight: 600;
    color: #fff;
    border-radius: 10px;
}
</style>

<div class="edit-box mt-4">
    <div class="edit-title">O‘quvchini tahrirlash</div>

    <form method="POST">
        {% csrf_token %}

        <div class="row">

            <!-- === LEFT COLUMN === -->
            <div class="col-md-6">

                <div class="mb-3">
                    <label class="form-label">Ism</label>
                    <input type="text" name="ism" value="{{ user_obj.ism }}" class="form-control">
                </div>


                <div class="mb-3">
                    <label class="form-label">Email (Login)</label>
                    <input type="email" name="email" value="{{ user_obj.email }}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Telefon 1</label>
                    <input type="text" name="telefon1" id="telefon1" value="{{ user_obj.telefon1 }}" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Role</label>
                    <select name="role" class="form-control">
                        <option value="student" {% if user_obj.role == "student" %}selected{% endif %}>O‘quvchi</option>
                        <option value="teacher" {% if user_obj.role == "teacher" %}selected{% endif %}>O‘qituvchi</option>
                        <option value="manager" {% if user_obj.role == "manager" %}selected{% endif %}>Manager</option>
                        <option value="director" {% if user_obj.role == "director" %}selected{% endif %}>Direktor</option>
                    </select>
                </div>


            </div>

            <!-- === RIGHT COLUMN === -->
<!-- === RIGHT COLUMN === -->
<div class="col-md-6">
    <div class="mb-3">
        <label class="form-label">Familya</label>
        <input type="text" name="familya" value="{{ user_obj.familya }}" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Parol (ixtiyoriy)</label>
        <input type="password" name="password" placeholder="Yangi parol yozing..." class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Telefon 2</label>
        <input type="text" name="telefon2" id="telefon2" value="{{ user_obj.telefon2 }}" class="form-control">
    </div>




</div>

<!-- === KURS NARXI UZUN QATOR (FULL WIDTH) === -->
<!-- <div class="col-md-12">
    <div class="mb-3">
        <label class="form-label">Kurs narxi (so'm)</label>
        <input type="number" name="kurs_narhi" id="kursNarxiInput"
       value="{% if enrollments %}{{ enrollments.0.kurs_narhi }}{% else %}0{% endif %}"
       class="form-control">

    </div>
</div> -->

<hr class="mt-4 mb-3" style="border-color:#ffffff30">

<h4 class="text-light mb-3">📘 O‘quvchining guruhlari va kurs narxlari</h4>

{% if enrollments %}
    {% for e in enrollments %}
        <div class="mb-3">
            <label class="form-label text-info">
                {{ e.group.nom }} — {{ e.group.center }}
            </label>

            <input type="number"
                   name="kurs_narhi_{{ e.id }}"
                   class="form-control"
                   value="{{ e.kurs_narhi }}"
                   min="0">
        </div>
    {% endfor %}
{% else %}
    <p class="text-warning">O‘quvchi hali hech qaysi guruhga yozilmagan.</p>
{% endif %}

        </div>

        <div class="d-flex gap-3 mt-4">
            <button class="btn-save">💾 Saqlash</button>
            <a href="/stat/students/" class="btn-cancel">Bekor qilish</a>
        </div>

    </form>
</div>

<script>
function formatPhone(el){
    if(!el.value.startsWith("+998")){
        el.value = "+998" + el.value.replace(/\D/g, "").slice(0, 9);
    }
    el.value = el.value.replace(/[^\d+]/g, "");
}
["telefon1", "telefon2"].forEach(id=>{
    const input = document.getElementById(id);
    if(input){
        formatPhone(input);
        input.addEventListener("input",()=>formatPhone(input));
    }
});

document.getElementById("group_id").addEventListener("change", function(){
    const gid = this.value;
    if(!gid) return;

    fetch(`/education/group-price/${gid}/`)
        .then(res => res.json())
        .then(data => {
            document.getElementById("kursNarxiInput").value = data.price;
        });
});

</script>

{% endblock %}
