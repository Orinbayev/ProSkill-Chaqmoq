{% extends "base.html" %}
{% block content %}

<h3 class="text-light mb-4 fw-bold">
    ✏️ O‘qituvchini tahrirlash — 
    <span class="text-info">{{ teacher.ism }} {{ teacher.familya }}</span>
</h3>

<div class="card bg-dark text-light p-4 shadow-lg" style="border-radius: 15px;">
    
    <form method="post" class="row g-4">
        {% csrf_token %}

        <!-- Forma maydonlarini chiroyli style bilan chiqarish -->
        {% for field in form %}
        <div class="col-md-6">
            <label class="form-label fw-semibold">{{ field.label }}</label>
            <div class="input-group">
                {{ field }}
            </div>
            <small class="text-danger">{{ field.errors }}</small>
        </div>
        {% endfor %}

        <div class="col-12 mt-3 d-flex justify-content-between">
            <a href="{% url 'core:teacher_detail' teacher.id %}" 
               class="btn btn-secondary px-4 py-2" 
               style="border-radius: 10px;">
                ⬅️ Ortga
            </a>

            <button class="btn btn-success px-4 py-2" 
                    style="border-radius: 10px;">
                💾 Saqlash
            </button>
        </div>
    </form>

</div>

<style>
    /* Inputlarni qorong‘i temaga moslab chiqarish */
    input, select {
        background: #1a1f2e !important;
        border: 1px solid #2e3a4d !important;
        color: #fff !important;
        padding: 10px !important;
        border-radius: 10px !important;
    }
    input:focus, select:focus {
        border: 1px solid #0dcaf0 !important;
        box-shadow: 0 0 8px rgba(13, 202, 240, 0.5) !important;
    }

    label {
        color: #9ab5d3 !important;
    }
</style>

{% endblock %}
