{% extends "base.html" %}
{% block content %}

<h3 class="text-light mb-4 fw-bold">
    ✏️ O‘qituvchini tahrirlash — 
    <span class="text-info">{{ teacher.ism }} {{ teacher.familya }}</span>
</h3>

<div class="card bg-dark text-light p-4 shadow-lg edit-card">

    <form method="post" class="row g-4">
        {% csrf_token %}

        {% for field in form %}
        <div class="col-md-6 col-sm-12">
            <label class="form-label fw-semibold">{{ field.label }}</label>
            <div class="input-group">
                {{ field }}
            </div>
            <small class="text-danger">{{ field.errors }}</small>
        </div>
        {% endfor %}

        <div class="col-12 mt-3 d-flex action-row">
            <a href="{% url 'core:teacher_detail' teacher.id %}" 
               class="btn btn-secondary btn-lg action-btn">
                ⬅️ Ortga
            </a>

            <button class="btn btn-success btn-lg action-btn">
                💾 Saqlash
            </button>
        </div>
    </form>

</div>

<style>
/* ======= Responsive Card ======= */
.edit-card {
    border-radius: 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
}

/* ======= Inputs Dark Theme ======= */
input, select {
    background: #1e2433 !important;
    border: 1px solid #2f3b4f !important;
    color: #fff !important;
    padding: 10px !important;
    border-radius: 10px !important;
    width: 100%;
}
input:focus, select:focus {
    border: 1px solid #0dcaf0 !important;
    box-shadow: 0 0 8px rgba(13, 202, 240, 0.5) !important;
}

label {
    color: #a5bfd9 !important;
}

/* ======= BUTTONS ======= */
.action-row {
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
}
.action-btn {
    border-radius: 10px !important;
    width: 200px;
}

/* ======= SMALL SCREEN FIXES ======= */
@media (max-width: 768px) {
    h3 {
        font-size: 20px;
        text-align: center;
    }

    .edit-card {
        padding: 18px;
    }

    .action-row {
        flex-direction: column;
        align-items: stretch;
    }

    .action-btn {
        width: 100%;
        font-size: 16px;
        padding: 10px;
    }

    input, select {
        font-size: 14px !important;
        padding: 9px !important;
    }

    label {
        font-size: 14px !important;
    }
}
</style>

{% endblock %}
