{% extends 'base.html' %}
{% block content %}

<style>
/* === TITLE === */
.dashboard-title {
    font-size: 30px;
    font-weight: 700;
    color: #f1f5f9;
    margin-bottom: 28px;
}

/* === CARD STYLE === */
.card-modern {
    background: rgba(30, 41, 59, 0.75);
    border-radius: 16px;
    padding: 24px 28px;
    border: 1px solid rgba(148, 163, 184, 0.15);
    transition: 0.28s ease;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    backdrop-filter: blur(12px);
}

.card-modern:hover {
    transform: translateY(-5px);
    border-color: #22c55e;
    box-shadow: 0 10px 26px rgba(34,197,94,0.25);
}

.card-title-modern {
    font-size: 20px;
    font-weight: 600;
    color: #e2e8f0;
    margin-bottom: 14px;
}

.small-muted {
    color: #94a3b8;
    font-size: 14px;
}

/* === BALANCE === */
.balance-box {
    font-size: 44px;
    font-weight: 700;
    color: #22c55e;
    margin-top: 5px;
}

/* === BUTTONS === */
.action-btn {
    padding: 14px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 16px;
    transition: 0.25s ease;
}

.btn-store {
    background: linear-gradient(90deg, #3b82f6, #2563eb);
    color: white;
    border: none;
}
.btn-store:hover {
    background: linear-gradient(90deg, #2563eb, #1e40af);
}

.btn-rating {
    background: linear-gradient(90deg, #22c55e, #16a34a);
    color: white;
    border: none;
}
.btn-rating:hover {
    background: linear-gradient(90deg, #16a34a, #15803d);
}

/* === RESPONSIVE === */

@media (max-width: 768px) {
    .dashboard-title {
        font-size: 26px;
    }
    .balance-box {
        font-size: 38px;
    }
    .card-modern {
        padding: 20px;
    }
}
</style>

<h3 class="dashboard-title">🎓 O‘quvchi paneli</h3>

<!-- === BALANCE === -->
<div class="row g-4">
  <div class="col-md-4 col-sm-12">
    <div class="card-modern text-center">
      <div class="small-muted">Mening Chaqmog‘im</div>
      <div class="balance-box">{{ balance|default:"0" }}</div>
    </div>
  </div>
</div>

<!-- === 2 CARDS: STORE & RATING === -->
<div class="row g-4 mt-2">

  <!-- DO‘KON -->
  <div class="col-md-6 col-sm-12">
    <div class="card-modern h-100">
      <div class="card-title-modern">🛒 Do‘kon</div>
      <a class="btn action-btn btn-store w-100"
         href="{% url 'store:products' %}">
        Mahsulotlarni ko‘rish
      </a>
      <p class="small-muted mt-3">
        Savatchaga qo‘sh → Manager tasdiqlaydi → Chaqmoq yechiladi.
      </p>
    </div>
  </div>

  <!-- REYTING -->
  <div class="col-md-6 col-sm-12">
    <div class="card-modern h-100">
      <div class="card-title-modern">🏆 Reyting</div>
      <a class="btn action-btn btn-rating w-100"
         href="{% url 'chaqmoq:reyting' %}">
        Umumiy reytingni ko‘rish
      </a>
    </div>
  </div>

</div>

{% endblock %}
