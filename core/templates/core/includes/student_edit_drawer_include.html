        <div class="seu-grid2">
          <div class="seu-row"><label class="seu-label">Ism</label><input class="seu-input" id="seuIsm" type="text" placeholder="Ism..."></div>
          <div class="seu-row"><label class="seu-label">Familya</label><input class="seu-input" id="seuFamilya" type="text" placeholder="Familya..."></div>
        </div>
        <div class="seu-row"><label class="seu-label">Otasining ismi</label><input class="seu-input" id="seuOtchestvo" type="text" placeholder="Otasining ismi..."></div>
        <div class="seu-grid2">
          <div class="seu-row"><label class="seu-label">Tug'ilgan sana</label><input class="seu-input" id="seuBirth" type="date"></div>
          <div class="seu-row">
            <label class="seu-label">Jinsi</label>
            <select class="seu-select" id="seuGender">
              <option value="">— Tanlang —</option>
              <option value="male">Erkak</option>
              <option value="female">Ayol</option>
            </select>
          </div>
        </div>
      </div>

      <div class="seu-sec-label"><i class="fa-solid fa-phone me-1"></i>Aloqa</div>
      <div class="seu-sec-box">
        <div class="seu-grid2">
          <div class="seu-row">
            <label class="seu-label">Telefon 1</label>
            <div class="bq-sdrawer-pro__phone-wrap">
              <span class="bq-sdrawer-pro__phone-prefix">
                <span class="bq-sdrawer-pro__phone-flag">🇺🇿</span>
                <span class="bq-sdrawer-pro__phone-code">+998</span>
              </span>
              <input class="seu-input" id="seuTel1" type="tel" placeholder="90 123-45-67" style="border: 0 !important; background: transparent !important; padding-left: 14px !important; width: 100% !important; box-sizing: border-box !important;">
            </div>
          </div>
          <div class="seu-row">
            <label class="seu-label">Telefon 2</label>
            <div class="bq-sdrawer-pro__phone-wrap">
              <span class="bq-sdrawer-pro__phone-prefix">
                <span class="bq-sdrawer-pro__phone-flag">🇺🇿</span>
                <span class="bq-sdrawer-pro__phone-code">+998</span>
              </span>
              <input class="seu-input" id="seuTel2" type="tel" placeholder="90 123-45-67" style="border: 0 !important; background: transparent !important; padding-left: 14px !important; width: 100% !important; box-sizing: border-box !important;">
            </div>
          </div>
        </div>
        <div class="seu-grid2">
          <div class="seu-row"><label class="seu-label"><i class="fa-brands fa-telegram" style="color:#2aabee"></i> Telegram</label><input class="seu-input" id="seuTelegram" type="text" placeholder="@username"></div>
          <div class="seu-row"><label class="seu-label"><i class="fa-brands fa-instagram" style="color:#e1306c"></i> Instagram</label><input class="seu-input" id="seuInsta" type="text" placeholder="@username"></div>
        </div>
        <div class="seu-row"><label class="seu-label">Manzil</label><textarea class="seu-input" id="seuAddress" rows="2" placeholder="Yashash manzili..." style="resize:vertical"></textarea></div>
      </div>

      <div class="seu-sec-label"><i class="fa-solid fa-id-card me-1"></i>Hujjat</div>
      <div class="seu-sec-box">
        <div class="seu-grid2">
          <div class="seu-row"><label class="seu-label">Pasport seriya/raqam</label><input class="seu-input" id="seuPassport" type="text" placeholder="AA 1234567"></div>
          <div class="seu-row"><label class="seu-label">JSHR / PINFL</label><input class="seu-input" id="seuJshr" type="text" placeholder="12345678901234" maxlength="14"></div>
        </div>
      </div>

      <div class="seu-sec-label"><i class="fa-solid fa-envelope me-1"></i>Login (Email)</div>
      <div class="seu-sec-box">
        <div class="seu-email-blk">
          <i class="fa-solid fa-lock" style="color:#475569"></i>
          <span id="seuEmailRO">—</span>
        </div>
        <div class="seu-note"><i class="fa-solid fa-circle-info me-1"></i>Email login sifatida ishlatiladi va o'zgartirilmaydi.</div>
      </div>

      <button class="seu-btn seu-btn--indigo" id="seuSaveProfile" onclick="seuSaveProfile()">
        <i class="fa-solid fa-floppy-disk"></i> Profilni saqlash
      </button>
    </div>

    <!-- TAB: GROUPS -->
    <div class="seu-pane" id="seuPaneGroups">
      <div class="seu-sec-label"><i class="fa-solid fa-users me-1"></i>Hozirgi guruhlar</div>
      <div class="seu-enr-list" id="seuEnrList">
        <div class="seu-enr-empty"><i class="fa-solid fa-spinner fa-spin"></i></div>
      </div>
      <div class="seu-sec-label" style="margin-top:4px"><i class="fa-solid fa-plus me-1"></i>Guruhga qo'shish</div>
      <div class="seu-add-group">
        <div class="seu-add-group-title"><i class="fa-solid fa-magnifying-glass"></i> Guruhni qidiring</div>
        <div class="seu-group-search-wrap">
          <i class="fa-solid fa-magnifying-glass seu-group-search-icon"></i>
          <input class="seu-group-search" id="seuGroupSearch" type="text" placeholder="Guruh nomi bo'yicha..." autocomplete="off">
          <div class="seu-group-dropdown" id="seuGroupDropdown"></div>
        </div>
        <input type="hidden" id="seuSelectedGroupId">
        <input type="hidden" id="seuSelectedGroupPrice">
        <div class="seu-add-grid">
          <div class="seu-row"><label class="seu-label">Narxi (so'm)</label><input class="seu-input" id="seuAddPrice" type="number" min="0" placeholder="500000"></div>
          <div class="seu-row"><label class="seu-label">Boshlanish sanasi</label><input class="seu-input" id="seuAddDate" type="date"></div>
        </div>
        <button class="seu-add-btn" id="seuAddBtn" onclick="seuAddToGroup()" disabled>
          <i class="fa-solid fa-user-plus"></i> Guruhga qo'shish
        </button>
      </div>
    </div>

    <!-- TAB: PASSWORD -->
    <div class="seu-pane" id="seuPanePass">
      <div class="seu-sec-label"><i class="fa-solid fa-shield-halved me-1"></i>Parol xavfsizligi</div>
      <div class="seu-sec-box">
        <div class="seu-row"><label class="seu-label">Yangi parol</label><input class="seu-input" id="seuNewPass" type="password" placeholder="Kamida 8 ta belgi..." autocomplete="new-password"></div>
        <div class="seu-row"><label class="seu-label">Yangi parol (takror)</label><input class="seu-input" id="seuConfPass" type="password" placeholder="Takrorlang..." autocomplete="new-password"></div>
        <div class="seu-pass-err" id="seuPassErr"></div>
        <button class="seu-btn seu-btn--purple" id="seuSavePassBtn" onclick="seuSavePass()">
          <i class="fa-solid fa-key"></i> Parolni yangilash
        </button>
      </div>
    </div>

  </div><!-- /seu-body -->
</div><!-- /seu-panel -->
<div class="seu-toast" id="seuToast"></div>

<script>
(function () {
  const _TPL = "{% url 'accounts:student_edit_ajax' 9999999 %}";
  const url  = id => _TPL.replace("9999999", id);
  const CSRF = "{{ csrf_token }}";
  let _sid = null;
  let _searchTimer = null;

  const $ = id => document.getElementById(id);
  const PATTERN_LABELS = { group: "Avtomatik", even: "Juft kunlar", odd: "Toq kunlar", daily: "Har kuni" };

  function fmtPrice(n) {
    return Number(n).toLocaleString("uz-UZ") + " so'm";
  }

  window.seuSwitchTab = function (tab) {
    ["profile","groups","pass"].forEach(t => {
      const capT = t.charAt(0).toUpperCase() + t.slice(1);
      $("seuPane" + capT)?.classList.remove("seu-pane--active");
      $("seuTab"  + capT)?.classList.remove("seu-tab--active");
    });
    const capTab = tab.charAt(0).toUpperCase() + tab.slice(1);
    $("seuPane" + capTab)?.classList.add("seu-pane--active");
    $("seuTab"  + capTab)?.classList.add("seu-tab--active");
  };

  window.openStudentEditDrawer = function (studentId) {
    _sid = studentId;
    $("seuOverlay").classList.add("seu-open");
    $("seuPanel").classList.add("seu-open");
    document.body.style.overflow = "hidden";
    $("seuFullName").textContent = "Yuklanmoqda...";
    $("seuEmailTop").textContent = "";
    seuSwitchTab("profile");

    fetch(url(studentId), { headers: { "X-Requested-With": "XMLHttpRequest" } })
      .then(r => r.json())
      .then(res => {
        if (!res.ok) { seuToast(res.error || "Xatolik", "err"); closeStudentEditDrawer(); return; }
        
        // Dynamic group tab visibility based on role
        const isStudent = res.data.role === "student";
        $("seuTabGroups").style.display = isStudent ? "" : "none";
        
        // Update Title and Badge dynamically
        const titleEl = $("seuDrawerTitle");
        const badgeEl = $("seuDrawerBadge");
        if (titleEl && badgeEl) {
          if (res.data.role === "manager") {
            titleEl.innerHTML = '<i class="fa-solid fa-user-pen"></i> Managerni tahrirlash';
            badgeEl.innerHTML = '<i class="fa-solid fa-user-shield" style="font-size:.6rem"></i> Manager';
          } else if (res.data.role === "parent") {
            titleEl.innerHTML = '<i class="fa-solid fa-user-pen"></i> Ota-onani tahrirlash';
            badgeEl.innerHTML = '<i class="fa-solid fa-users" style="font-size:.6rem"></i> Ota-ona';
          } else {
            titleEl.innerHTML = '<i class="fa-solid fa-user-pen"></i> O\'quvchini tahrirlash';
            badgeEl.innerHTML = '<i class="fa-solid fa-graduation-cap" style="font-size:.6rem"></i> O\'quvchi';
          }
        }

        seuPopulate(res.data);
        seuRenderEnrollments(res.data.enrollments || []);
      })
      .catch(() => { seuToast("Ma'lumot yuklanmadi", "err"); closeStudentEditDrawer(); });
  };

  window.closeStudentEditDrawer = function () {
    $("seuOverlay").classList.remove("seu-open");
    $("seuPanel").classList.remove("seu-open");
    document.body.style.overflow = "";
    _sid = null;
    $("seuNewPass").value  = "";
    $("seuConfPass").value = "";
    $("seuPassErr").style.display = "none";
    $("seuAvatarFile").value = "";
    $("seuGroupSearch").value = "";
    $("seuGroupDropdown").classList.remove("seu-open");
    $("seuSelectedGroupId").value = "";
    $("seuAddBtn").disabled = true;
  };

  function seuPopulate(d) {
    $("seuIsm").value       = d.ism                  || "";
    $("seuFamilya").value   = d.familya              || "";
    $("seuOtchestvo").value = d.otchestvo            || "";
    $("seuTel1").value      = formatPhoneValue(d.telefon1);
    $("seuTel2").value      = formatPhoneValue(d.telefon2);
    $("seuBirth").value     = d.birth_date           || "";
    $("seuGender").value    = d.gender               || "";
    $("seuPassport").value  = d.passport_id          || "";
    $("seuJshr").value      = d.jshr                 || "";
    $("seuAddress").value   = d.address              || "";
    $("seuTelegram").value  = d.telegram_username    || "";
    $("seuInsta").value     = d.instagram_username   || "";
    $("seuEmailRO").textContent  = d.email    || "—";
    $("seuEmailTop").textContent = d.email    || "—";
    $("seuFullName").textContent = d.full_name|| "—";

    const av  = $("seuAvatar");
    const ini = $("seuInitial");
    const oldImg = av.querySelector("img");
    if (oldImg) oldImg.remove();
    if (d.avatar_url) {
      ini.style.display = "none";
      const img = document.createElement("img"); img.src = d.avatar_url; av.appendChild(img);
    } else {
      ini.style.display = "";
      ini.textContent = (d.ism || "?")[0].toUpperCase();
    }
  }

  function seuRenderEnrollments(list) {
    const el = $("seuEnrList");
    if (!list.length) {
      el.innerHTML = '<div class="seu-enr-empty"><i class="fa-solid fa-circle-info me-1"></i>Hech qanday guruhga biriktirilmagan</div>';
      return;
    }
    el.innerHTML = list.map(enr => `
      <div class="seu-enr-card" id="seuEnr-${enr.id}">
        <div class="seu-enr-top">
          <div class="seu-enr-icon"><i class="fa-solid fa-users"></i></div>
          <div class="seu-enr-main">
            <div class="seu-enr-name">${enr.group_name}</div>
            <div class="seu-enr-price">${fmtPrice(enr.kurs_narhi)}</div>
            <div class="seu-enr-meta">📅 ${enr.joined_at || "—"} &nbsp;·&nbsp; ${PATTERN_LABELS[enr.lesson_pattern] || enr.lesson_pattern}</div>
          </div>
          <div class="seu-enr-actions">
            <button class="seu-enr-btn seu-enr-btn--edit" onclick="seuToggleEnrEdit(${enr.id})" title="Tahrirlash"><i class="fa-solid fa-pen"></i></button>
            <button class="seu-enr-btn seu-enr-btn--del"  onclick="seuRemoveEnr(${enr.id}, '${enr.group_name.replace(/'/g,"\\'")}');" title="Chiqarish"><i class="fa-solid fa-user-minus"></i></button>
          </div>
        </div>
        <div class="seu-enr-edit" id="seuEnrEdit-${enr.id}">
          <div class="seu-enr-edit-grid">
            <div class="seu-row"><label class="seu-label">Narxi (so'm)</label><input class="seu-input" id="seuEnrPrice-${enr.id}" type="number" min="0" value="${enr.kurs_narhi}"></div>
            <div class="seu-row"><label class="seu-label">Boshlanish</label><input class="seu-input" id="seuEnrDate-${enr.id}" type="date" value="${enr.joined_at}"></div>
          </div>
          <div class="seu-row">
            <label class="seu-label">Dars tartibi</label>
            <select class="seu-select" id="seuEnrPat-${enr.id}">
              <option value="group" ${enr.lesson_pattern==="group"?"selected":""}>Avtomatik (guruh jadvali)</option>
              <option value="even"  ${enr.lesson_pattern==="even" ?"selected":""}>Juft kunlari (2,4,6)</option>
              <option value="odd"   ${enr.lesson_pattern==="odd"  ?"selected":""}>Toq kunlari (1,3,5)</option>
              <option value="daily" ${enr.lesson_pattern==="daily"?"selected":""}>Har kuni</option>
            </select>
          </div>
          <div class="seu-enr-edit-actions">
            <button class="seu-enr-save-btn" id="seuEnrSave-${enr.id}" onclick="seuSaveEnr(${enr.id})">
              <i class="fa-solid fa-floppy-disk"></i> Saqlash
            </button>
            <button class="seu-enr-cancel-btn" onclick="seuToggleEnrEdit(${enr.id})">Bekor</button>
          </div>
        </div>
      </div>
    `).join("");
  }

  window.seuToggleEnrEdit = function (enrId) {
    const el = $("seuEnrEdit-" + enrId);
    if (el) el.classList.toggle("seu-open");
  };

  window.seuSaveEnr = function (enrId) {
    if (!_sid) return;
    const btn = $("seuEnrSave-" + enrId);
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    const fd = new FormData();
    fd.append("action",          "enrollment_update");
    fd.append("enrollment_id",   enrId);
    fd.append("kurs_narhi",      $("seuEnrPrice-" + enrId).value);
    fd.append("joined_at",       $("seuEnrDate-"  + enrId).value);
    fd.append("lesson_pattern",  $("seuEnrPat-"   + enrId).value);
    fetch(url(_sid), { method: "POST", headers: { "X-CSRFToken": CSRF, "X-Requested-With": "XMLHttpRequest" }, body: fd })
      .then(r => r.json())
      .then(res => {
        if (res.ok) {
          const enr = res.enrollment;
          const card = $("seuEnr-" + enrId);
          if (card) {
            card.querySelector(".seu-enr-price").textContent = fmtPrice(enr.kurs_narhi);
            card.querySelector(".seu-enr-meta").innerHTML = `📅 ${enr.joined_at || "—"} &nbsp;·&nbsp; ${PATTERN_LABELS[enr.lesson_pattern] || enr.lesson_pattern}`;
          }
          $("seuEnrEdit-" + enrId)?.classList.remove("seu-open");
          seuToast(res.message, "ok");
        } else { seuToast(res.error || "Xatolik", "err"); }
      })
      .catch(() => seuToast("Tarmoq xatoligi", "err"))
      .finally(() => { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Saqlash'; });
  };

  window.seuRemoveEnr = function (enrId, groupName) {
    if (!_sid) return;
    if (!confirm(`"${groupName}" guruhidan chiqarilsinmi?`)) return;
    const fd = new FormData();
    fd.append("action",        "enrollment_remove");
    fd.append("enrollment_id", enrId);
    fetch(url(_sid), { method: "POST", headers: { "X-CSRFToken": CSRF, "X-Requested-With": "XMLHttpRequest" }, body: fd })
      .then(r => r.json())
      .then(res => {
        if (res.ok) {
          $("seuEnr-" + enrId)?.remove();
          const list = $("seuEnrList");
          if (!list.querySelector(".seu-enr-card")) {
            list.innerHTML = '<div class="seu-enr-empty"><i class="fa-solid fa-circle-info me-1"></i>Hech qanday guruhga biriktirilmagan</div>';
          }
          seuToast(res.message, "ok");
        } else { seuToast(res.error || "Xatolik", "err"); }
      })
      .catch(() => seuToast("Tarmoq xatoligi", "err"));
  };

  $("seuGroupSearch").addEventListener("input", function () {
    clearTimeout(_searchTimer);
    const q = this.value.trim();
    if (!q) { $("seuGroupDropdown").classList.remove("seu-open"); return; }
    _searchTimer = setTimeout(() => {
      const searchUrl = url(_sid) + "?action=search_groups&q=" + encodeURIComponent(q);
      fetch(searchUrl, { headers: { "X-Requested-With": "XMLHttpRequest" } })
        .then(r => r.json())
        .then(res => {
          const dd = $("seuGroupDropdown");
          if (!res.ok || !res.results.length) {
            dd.innerHTML = '<div class="seu-group-none">Guruh topilmadi</div>';
          } else {
            dd.innerHTML = res.results.map(g =>
              `<div class="seu-group-option" onclick="seuSelectGroup(${g.id}, '${g.nom.replace(/'/g,"\\'")}', ${g.kurs_narxi})">
                <span>${g.nom}</span><span>${fmtPrice(g.kurs_narxi)}</span>
              </div>`
            ).join("");
          }
          dd.classList.add("seu-open");
        });
    }, 280);
  });

  $("seuGroupSearch").addEventListener("blur", () => {
    setTimeout(() => $("seuGroupDropdown").classList.remove("seu-open"), 200);
  });

  window.seuSelectGroup = function (id, nom, price) {
    $("seuSelectedGroupId").value    = id;
    $("seuSelectedGroupPrice").value = price;
    $("seuGroupSearch").value        = nom;
    $("seuAddPrice").value           = price;
    $("seuGroupDropdown").classList.remove("seu-open");
    $("seuAddBtn").disabled = false;
  };

  window.seuAddToGroup = function () {
    if (!_sid) return;
    const groupId = $("seuSelectedGroupId").value;
    if (!groupId) { seuToast("Avval guruh tanlang", "err"); return; }
    const btn = $("seuAddBtn");
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Qo\'shilmoqda...';
    const fd = new FormData();
    fd.append("action",     "enrollment_add");
    fd.append("group_id",   groupId);
    fd.append("kurs_narhi", $("seuAddPrice").value || $("seuSelectedGroupPrice").value || "0");
    fd.append("joined_at",  $("seuAddDate").value  || "");
    fetch(url(_sid), { method: "POST", headers: { "X-CSRFToken": CSRF, "X-Requested-With": "XMLHttpRequest" }, body: fd })
      .then(r => r.json())
      .then(res => {
        if (res.ok) {
          const enr  = res.enrollment;
          const list = $("seuEnrList");
          const empty = list.querySelector(".seu-enr-empty");
          if (empty) empty.remove();
          const card = document.createElement("div");
          card.className = "seu-enr-card"; card.id = "seuEnr-" + enr.id;
          card.innerHTML = `
            <div class="seu-enr-top">
              <div class="seu-enr-icon"><i class="fa-solid fa-users"></i></div>
              <div class="seu-enr-main">
                <div class="seu-enr-name">${enr.group_name}</div>
                <div class="seu-enr-price">${fmtPrice(enr.kurs_narhi)}</div>
                <div class="seu-enr-meta">📅 ${enr.joined_at || "—"} &nbsp;·&nbsp; ${PATTERN_LABELS[enr.lesson_pattern] || enr.lesson_pattern}</div>
              </div>
              <div class="seu-enr-actions">
                <button class="seu-enr-btn seu-enr-btn--edit" onclick="seuToggleEnrEdit(${enr.id})" title="Tahrirlash"><i class="fa-solid fa-pen"></i></button>
                <button class="seu-enr-btn seu-enr-btn--del"  onclick="seuRemoveEnr(${enr.id}, '${enr.group_name.replace(/'/g,"\\'")}');" title="Chiqarish"><i class="fa-solid fa-user-minus"></i></button>
              </div>
            </div>
            <div class="seu-enr-edit" id="seuEnrEdit-${enr.id}">
              <div class="seu-enr-edit-grid">
                <div class="seu-row"><label class="seu-label">Narxi (so'm)</label><input class="seu-input" id="seuEnrPrice-${enr.id}" type="number" min="0" value="${enr.kurs_narhi}"></div>
                <div class="seu-row"><label class="seu-label">Boshlanish</label><input class="seu-input" id="seuEnrDate-${enr.id}" type="date" value="${enr.joined_at}"></div>
              </div>
              <div class="seu-row"><label class="seu-label">Dars tartibi</label>
                <select class="seu-select" id="seuEnrPat-${enr.id}">
                  <option value="group" selected>Avtomatik</option>
                  <option value="even">Juft kunlar</option>
                  <option value="odd">Toq kunlar</option>
                  <option value="daily">Har kuni</option>
                </select>
              </div>
              <div class="seu-enr-edit-actions">
                <button class="seu-enr-save-btn" id="seuEnrSave-${enr.id}" onclick="seuSaveEnr(${enr.id})"><i class="fa-solid fa-floppy-disk"></i> Saqlash</button>
                <button class="seu-enr-cancel-btn" onclick="seuToggleEnrEdit(${enr.id})">Bekor</button>
              </div>
            </div>`;
          list.appendChild(card);
          $("seuGroupSearch").value = ""; $("seuAddPrice").value = ""; $("seuAddDate").value = ""; $("seuSelectedGroupId").value = "";
          btn.disabled = true;
          seuToast(res.message, "ok");
        } else { seuToast(res.error || "Xatolik", "err"); }
      })
      .catch(() => seuToast("Tarmoq xatoligi", "err"))
      .finally(() => { btn.disabled = !$("seuSelectedGroupId").value; btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Guruhga qo\'shish'; });
  };

  $("seuAvatarFile").addEventListener("change", function () {
    const file = this.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const av = $("seuAvatar"); const ini = $("seuInitial");
      let img = av.querySelector("img");
      if (!img) { img = document.createElement("img"); av.appendChild(img); }
      img.src = e.target.result; ini.style.display = "none";
    };
    reader.readAsDataURL(file);
  });

  window.seuSaveProfile = function () {
    if (!_sid) return;
    const btn = $("seuSaveProfile");
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saqlanmoqda...';
    const fd = new FormData();
    fd.append("action",             "update_profile");
    fd.append("ism",                $("seuIsm").value.trim());
    fd.append("familya",            $("seuFamilya").value.trim());
    fd.append("otchestvo",          $("seuOtchestvo").value.trim());
    fd.append("telefon1",           $("seuTel1").value.trim());
    fd.append("telefon2",           $("seuTel2").value.trim());
    fd.append("birth_date",         $("seuBirth").value);
    fd.append("gender",             $("seuGender").value);
    fd.append("passport_id",        $("seuPassport").value.trim());
    fd.append("jshr",               $("seuJshr").value.trim());
    fd.append("address",            $("seuAddress").value.trim());
    fd.append("telegram_username",  $("seuTelegram").value.trim());
    fd.append("instagram_username", $("seuInsta").value.trim());
    const f = $("seuAvatarFile").files[0];
    if (f) fd.append("avatar", f);
    fetch(url(_sid), { method: "POST", headers: { "X-CSRFToken": CSRF, "X-Requested-With": "XMLHttpRequest" }, body: fd })
      .then(r => r.json())
      .then(res => {
        if (res.ok) {
          $("seuFullName").textContent = res.full_name || "—";
          if (res.avatar_url) {
            const av = $("seuAvatar"); const ini = $("seuInitial");
            let img = av.querySelector("img");
            if (!img) { img = document.createElement("img"); av.appendChild(img); }
            img.src = res.avatar_url; ini.style.display = "none";
          }
          seuToast(res.message || "Saqlandi ✅", "ok");
        } else { seuToast(res.error || "Xatolik", "err"); }
      })
      .catch(() => seuToast("Tarmoq xatoligi", "err"))
      .finally(() => { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Profilni saqlash'; });
  };

  window.seuSavePass = function () {
    if (!_sid) return;
    const np = $("seuNewPass").value;
    const cp = $("seuConfPass").value;
    const errEl = $("seuPassErr");
    errEl.style.display = "none";
    if (np.length < 8) { errEl.textContent = "Kamida 8 ta belgi bo'lishi kerak."; errEl.style.display = "block"; return; }
    if (np !== cp)     { errEl.textContent = "Parollar mos kelmadi.";              errEl.style.display = "block"; return; }
    const btn = $("seuSavePassBtn");
    btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Yangilanmoqda...';
    const fd = new FormData();
    fd.append("action",           "update_password");
    fd.append("new_password",     np);
    fd.append("confirm_password", cp);
    fetch(url(_sid), { method: "POST", headers: { "X-CSRFToken": CSRF, "X-Requested-With": "XMLHttpRequest" }, body: fd })
      .then(r => r.json())
      .then(res => {
        if (res.ok) {
          $("seuNewPass").value = ""; $("seuConfPass").value = "";
          seuToast(res.message || "Parol yangilandi 🔒", "ok");
        } else {
          const msg = res.errors ? Object.values(res.errors).flat().join(" ") : (res.error || "Xatolik");
          errEl.textContent = msg; errEl.style.display = "block";
          seuToast("Parol yangilanmadi", "err");
        }
      })
      .catch(() => seuToast("Tarmoq xatoligi", "err"))
      .finally(() => { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-key"></i> Parolni yangilash'; });
  };

  let _tt = null;
  function seuToast(msg, type) {
    const el = $("seuToast");
    el.className = "seu-toast seu-toast--" + (type === "ok" ? "ok" : "err");
    el.innerHTML = '<i class="fa-solid ' + (type === "ok" ? "fa-circle-check" : "fa-circle-exclamation") + '"></i> ' + msg;
    el.classList.add("seu-show");
    clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove("seu-show"), 3400);
  }

  /* ── Input formatting and masks ── */
  function formatPhoneValue(value) {
    const digits = String(value || "").replace(/\D/g, "").replace(/^998/, "").slice(0, 9);
    const parts = [];
    if (digits.slice(0, 2)) parts.push(digits.slice(0, 2));
    if (digits.slice(2, 5)) parts.push(digits.slice(2, 5));
    if (digits.slice(5, 7)) parts.push(digits.slice(5, 7));
    if (digits.slice(7, 9)) parts.push(digits.slice(7, 9));
    return parts.join(" ");
  }

  // Initialize masks for Telefon 1 & 2
  ["seuTel1", "seuTel2"].forEach(id => {
    const input = $(id);
    if (!input) return;
    
    input.setAttribute('placeholder', '90 123-45-67');
    input.setAttribute('maxlength', '12');
    input.setAttribute('inputmode', 'numeric');
    input.setAttribute('autocomplete', 'off');

    function applyPhoneMask() {
      input.value = formatPhoneValue(input.value);
    }
    input.addEventListener("input", applyPhoneMask);
    input.addEventListener("blur", function () {
      const digits = input.value.replace(/\D/g, "").replace(/^998/, "");
      input.value = digits ? formatPhoneValue(input.value) : "";
    });
  });

  // Telegram & Instagram usernames auto-@ prefix
  ["seuTelegram", "seuInsta"].forEach(id => {
    const inp = $(id);
    if (!inp) return;
    inp.addEventListener('input', function() {
      if (this.value && !this.value.startsWith('@')) this.value = '@' + this.value;
    });
    inp.addEventListener('blur', function() {
      if (this.value === '@') this.value = '';
    });
  });

  document.addEventListener("keydown", e => { if (e.key === "Escape" && _sid) closeStudentEditDrawer(); });
})();
</script>
