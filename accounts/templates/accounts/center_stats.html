{% extends "base.html" %}
{% block content %}
<style>
    :root {
        --bg-glass: rgba(255, 255, 255, 0.05);
        --border-glass: rgba(255, 255, 255, 0.1);
        --accent: #f59e0b;
        --accent-glow: rgba(245, 158, 11, 0.4);
    }

    .glass-panel {
        background: var(--bg-glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--border-glass);
        border-radius: 16px;
    }

    .kpi-card {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 16px;
        transition: transform 0.2s;
    }

    .kpi-card:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
    }

    .kpi-value {
        font-size: 1.5rem;
        font-weight: 700;
        color: #fff;
    }

    .kpi-label {
        font-size: 0.85rem;
        color: #9ca3af;
    }

    .kpi-trend {
        font-size: 0.75rem;
    }

    .text-accent {
        color: var(--accent);
    }

    .table-glass {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 4px;
    }

    .table-glass th {
        padding: 12px;
        text-align: left;
        color: #9ca3af;
        font-weight: 500;
        font-size: 0.85rem;
    }

    .table-glass td {
        background: rgba(255, 255, 255, 0.02);
        padding: 12px;
        color: #e5e7eb;
        font-size: 0.9rem;
    }

    .table-glass tr td:first-child {
        border-top-left-radius: 8px;
        border-bottom-left-radius: 8px;
    }

    .table-glass tr td:last-child {
        border-top-right-radius: 8px;
        border-bottom-right-radius: 8px;
    }

    /* Loading Spinner */
    .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-left-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 50px auto;
    }

    @keyframes spin {
        100% {
            transform: rotate(360deg);
        }
    }
</style>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">{{ center.name }} Statistika</h2>
            <div class="text-muted small">SuperAdmin Dashboard</div>
        </div>
        <div>
            <a href="{% url 'accounts:center_picker' %}" class="btn btn-outline-light btn-sm">
                ← Markazlar
            </a>
        </div>
    </div>

    <!-- KPI GRID -->
    <div id="loading-kpi" class="spinner"></div>
    <div id="kpi-grid" class="row g-3 mb-4 d-none">
        <!-- Rendered via JS -->
    </div>

    <!-- CHARTS -->
    <div class="row g-4 mb-4">
        <div class="col-lg-6">
            <div class="glass-panel p-3 h-100">
                <h5 class="mb-3">Aylanma (Revenue)</h5>
                <canvas id="chartRevenue"></canvas>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="glass-panel p-3 h-100">
                <h5 class="mb-3">Yangi O‘quvchilar</h5>
                <canvas id="chartStudents"></canvas>
            </div>
        </div>
    </div>

    <!-- STUDENTS TABLE -->
    <div class="glass-panel p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">O‘quvchilar</h5>

            <div class="d-flex gap-2">
                <input type="text" id="filter-search"
                    class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="Qidirish...">
                <select id="filter-status" class="form-select form-select-sm bg-dark text-light border-secondary"
                    style="width: auto;">
                    <option value="">Barchasi</option>
                    <option value="active">Active</option>
                    <option value="blocked">Blocked</option>
                </select>
                <button class="btn btn-sm btn-warning" onclick="loadStudents()">Filter</button>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table-glass">
                <thead>
                    <tr>
                        <th>F.I.SH</th>
                        <th>Telefon</th>
                        <th>Guruhlar</th>
                        <th>Status</th>
                        <th>Oxirgi to'lov</th>
                        <th>Profile</th>
                    </tr>
                </thead>
                <tbody id="students-body">
                    <!-- Students JS -->
                </tbody>
            </table>
            <div id="loading-students" class="text-center py-3 d-none">
                <div class="spinner" style="width: 24px; height: 24px; margin: 0 auto;"></div>
            </div>
        </div>
    </div>
</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const CENTER_ID = Number("{{ center.id }}");
    const API_STATS = "{% url 'accounts:api_center_stats' center.id %}";
    const API_STUDENTS = "{% url 'accounts:api_center_students' center.id %}";

    let chartRevInst = null;
    let chartStuInst = null;

    async function loadStats() {
        document.getElementById('loading-kpi').classList.remove('d-none');
        document.getElementById('kpi-grid').classList.add('d-none');

        try {
            const res = await fetch(API_STATS);
            if (!res.ok) throw new Error("Stats load failed");
            const data = await res.json();
            renderKPI(data.kpi);
            renderCharts(data.charts);
        } catch (e) {
            console.error(e);
            alert("Statistikani yuklashda xatolik!");
        } finally {
            document.getElementById('loading-kpi').classList.add('d-none');
            document.getElementById('kpi-grid').classList.remove('d-none');
        }
    }

    function renderKPI(kpi) {
        const items = [
            { label: "Jami O‘quvchilar", val: kpi.total_students, sub: "Student" },
            { label: "Aktiv O‘quvchilar", val: kpi.active_students, sub: "Active", color: "text-success" },
            { label: "Yangi (30 kun)", val: "+" + kpi.new_students_30d, sub: "New Trend", color: "text-accent" },
            { label: "Guruhlar", val: kpi.total_groups, sub: "Groups" },
            { label: "O‘qituvchilar", val: kpi.total_teachers, sub: "Teachers" },
            { label: "Oylik Tushum (Revenue)", val: formatMoney(kpi.monthly_revenue), sub: "This Month", color: "text-accent" },
            { label: "Jami Tushum", val: formatMoney(kpi.total_revenue), sub: "Lifetime" },
            { label: "O‘rtacha chek", val: formatMoney(kpi.avg_payment), sub: "Avg Payment" },
            // { label: "Qarzdorlik", val: formatMoney(kpi.total_debt), sub: "Debt", color: "text-danger" },
            { label: "Davomat %", val: kpi.attendance_rate + "%", sub: "Last 30 days" },
        ];

        let html = "";
        items.forEach(i => {
            html += `
        <div class="col-6 col-md-3 col-xl-2.4"> <!-- Custom grid -->
            <div class="kpi-card h-100">
                <div class="kpi-label mb-1">${i.label}</div>
                <div class="kpi-value ${i.color || ''}">${i.val}</div>
                <div class="kpi-trend text-muted">${i.sub}</div>
            </div>
        </div>
        `;
        });
        document.getElementById('kpi-grid').innerHTML = html;
    }

    function renderCharts(charts) {
        // Revenue
        const ctxRev = document.getElementById('chartRevenue').getContext('2d');
        if (chartRevInst) chartRevInst.destroy();
        chartRevInst = new Chart(ctxRev, {
            type: 'line',
            data: {
                labels: charts.revenue.map(x => x.label),
                datasets: [{
                    label: "Revenue",
                    data: charts.revenue.map(x => x.value),
                    borderColor: '#f59e0b',
                    backgroundColor: 'rgba(245, 158, 11, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });

        // Students
        const ctxStu = document.getElementById('chartStudents').getContext('2d');
        if (chartStuInst) chartStuInst.destroy();
        chartStuInst = new Chart(ctxStu, {
            type: 'bar',
            data: {
                labels: charts.students.map(x => x.label),
                datasets: [{
                    label: "New Students",
                    data: charts.students.map(x => x.value),
                    backgroundColor: '#3b82f6',
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
    }

    async function loadStudents() {
        const q = document.getElementById('filter-search').value;
        const s = document.getElementById('filter-status').value;
        const url = `${API_STUDENTS}?search=${encodeURIComponent(q)}&status=${s}`;

        document.getElementById('loading-students').classList.remove('d-none');
        const tbody = document.getElementById('students-body');
        tbody.innerHTML = "";

        try {
            const res = await fetch(url);
            const data = await res.json();

            if (data.students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted">Ma'lumot topilmadi</td></tr>`;
                return;
            }

            let html = "";
            data.students.forEach(u => {
                html += `
            <tr>
                <td>
                    <div class="fw-bold">${u.full_name}</div>
                    <div class="small text-muted" style="font-size:0.75rem">Reg: ${u.joined_at}</div>
                </td>
                <td>${u.phone || '-'}</td>
                <td>${u.groups.join(', ') || '<span class="text-muted">–</span>'}</td>
                <td>
                    <span class="badge ${u.status === 'Active' ? 'bg-success' : 'bg-danger'}">${u.status}</span>
                </td>
                <td>${u.last_payment}</td>
                <td>
                    <a href="/accounts/talaba/${u.id}/" class="btn btn-xs btn-outline-info">View</a>
                </td>
            </tr>
            `;
            });
            tbody.innerHTML = html;

        } catch (e) {
            console.error(e);
            tbody.innerHTML = `<tr><td colspan="6" class="text-danger text-center">Xatolik</td></tr>`;
        } finally {
            document.getElementById('loading-students').classList.add('d-none');
        }
    }

    function formatMoney(amount) {
        return new Intl.NumberFormat('uz-UZ').format(amount);
    }

    // Init
    document.addEventListener("DOMContentLoaded", () => {
        loadStats();
        loadStudents();
    });
</script>
{% endblock %}
