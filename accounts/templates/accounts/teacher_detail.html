{% extends "base.html" %}
{% block content %}
<h3>O‘qituvchi: {{ teacher.ism }} {{ teacher.familya }}</h3>
<p class="text-muted mb-3">{{ teacher.get_role_display }}</p>

<div class="table-responsive">
  <table class="table table-hover align-middle">
    <thead>
      <tr>
        <th>Guruh</th>
        <th>Center</th>
        <th>Talabalar</th>
      </tr>
    </thead>
    <tbody>
      {% for g in groups %}
        <tr class="row-link" data-href="{% url 'education:group_detail' g.id %}">
          <td><a href="{% url 'education:group_detail' g.id %}">{{ g.nom }}</a></td>

          <td>{{ g.center }}</td>
          <td>{{ g.student_count }}</td>
        </tr>
      {% empty %}
        <tr><td colspan="3" class="text-muted">Guruhlar yo‘q.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script>
document.querySelectorAll('.row-link').forEach(tr=>{
  tr.style.cursor='pointer';
  tr.addEventListener('click', e=>{
    if(e.target.closest('a')) return;
    location.href = tr.dataset.href;
  });
});
</script>
{% endblock %}
