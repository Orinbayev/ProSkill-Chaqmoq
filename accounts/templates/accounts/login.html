<!-- templates/accounts/login.html -->
{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h3 class="mb-3">Tizimga kirish</h3>

    {% if form.errors %}
      <div class="alert alert-danger">Login yoki parol noto‘g‘ri.</div>
    {% endif %}

    <form method="post" action="{% url 'accounts:login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="username" class="form-control" required placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Parol</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
      {% endif %}
      <button class="btn btn-primary w-100">Kirish</button>
    </form>
  </div>
</div>
{% endblock %}
