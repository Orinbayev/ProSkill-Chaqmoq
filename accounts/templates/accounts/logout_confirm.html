{% extends 'base.html' %}

{% block extra_css %}
<style>
.logout-page-container {
  min-height: calc(100vh - 120px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: linear-gradient(135deg, #001f3f, #0077b6);
  font-family: 'Poppins', sans-serif;
}

/* Card */
.logout-card {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(18px);
  padding: 35px 40px;
  border-radius: 20px;
  color: #fff;
  text-align: center;
  width: 420px;
  box-shadow: 0 0 25px rgba(0,0,0,0.25);
  animation: fadeIn .5s ease;
}

.logout-card h3 {
  font-weight: 700;
  margin-bottom: 15px;
  font-size: 24px;
}

.logout-card p {
  font-size: 15px;
  opacity: .8;
  margin-bottom: 28px;
}

/* Buttons */
.logout-card .btn-danger {
  background: linear-gradient(135deg, #ff4d4d, #d90429);
  border: none;
  font-weight: 600;
  padding: 12px 20px;
  border-radius: 10px;
}

.logout-card .btn-secondary {
  background: rgba(255,255,255,0.2);
  border: none;
  margin-left: 10px;
  font-weight: 500;
  padding: 12px 16px;
  border-radius: 10px;
  backdrop-filter: blur(10px);
  color: #fff;
}

.btn-secondary:hover {
  background: rgba(255,255,255,0.35);
}

/* Responsive */
@media (max-width: 480px) {
  .logout-card {
    width: 100%;
    padding: 30px 25px;
  }
  .logout-card h3 { font-size: 21px; }
  .logout-card p { font-size: 14px; }
}

/* Animation */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
{% endblock %}

{% block content %}
<div class="logout-page-container">

  <div class="logout-card">
    <h3>Tizimdan chiqmoqchimisiz?</h3>
    <p>ProSkill hisobingizdan chiqishdan oldin tasdiqlang.</p>

    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}

      <button class="btn btn-danger">Ha, chiqaman</button>
      <a href="{% url 'core:home' %}" class="btn btn-secondary">Yo‘q, ortga</a>
    </form>
  </div>

</div>
{% endblock %}
