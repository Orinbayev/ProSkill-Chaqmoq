{% extends 'base.html' %}
{% block content %}
<h3>Chaqmoq berish/ayirish</h3>

<form method="post" id="give-form" class="mt-3" style="max-width:700px">
  {% csrf_token %}

  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Guruh (ixtiyoriy):</label>
      <select name="group" id="group" class="form-select">
        <option value="">———</option>
        {% for g in groups %}
          <option value="{{ g.id }}" {% if selected_gid|default:''|stringformat:"s" == g.id|stringformat:"s" %}selected{% endif %}>
            {{ g.nom }}
          </option>
        {% endfor %}
      </select>
      <div class="form-text">Guruh tanlasang — studentlar ro‘yxati shu guruh bo‘yicha filtrlanadi.</div>
    </div>

    <div class="col-md-6">
      <label class="form-label">Student:</label>
      <div class="input-group">
        <span class="input-group-text">Qidirish</span>
        <input type="text" id="student-search" class="form-control" placeholder="Ism bo‘yicha filtrlash">
      </div>
      <select name="student" id="student" class="form-select mt-2" required>
        <option value="">———</option>
        {% for s in students %}
          <option value="{{ s.id }}">{{ s.ism }} {{ s.familya }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-6">
      <label class="form-label">Qoida:</label>
      <select name="rule" id="rule" class="form-select" required>
        <option value="">———</option>
        {% for r in rules %}
          <option value="{{ r.id }}"
                  data-min="{{ r.min_baho }}"
                  data-max="{{ r.max_baho }}"
                  data-type="{{ r.tur }}">
            {{ r.nom }} {% if r.tur == 'plus' %}(+{{ r.min_baho }}..+{{ r.max_baho }}){% else %}(-{{ r.min_baho }}..-{{ r.max_baho }}){% endif %}
          </option>
        {% endfor %}
      </select>
      <div class="form-text" id="rule-help">Qoida tanla.</div>
    </div>

    <div class="col-md-6">
      <label class="form-label">Ball:</label>
      <input type="number" name="ball" id="ball" class="form-control" placeholder="0" min="1" step="1" required>
      <div class="form-text" id="ball-help">Musbat son kiriting. Minus uchun qoida turidan ishora qo‘shiladi.</div>
    </div>
  </div>

  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-success">Saqlash</button>
    <a class="btn btn-secondary" href="{% url 'chaqmoq:reyting' %}">Reyting</a>
  </div>
</form>

<script>
(function(){
  const groupSel = document.getElementById('group');
  const studentSel = document.getElementById('student');
  const searchInp = document.getElementById('student-search');
  const ruleSel = document.getElementById('rule');
  const ballInp = document.getElementById('ball');
  const ruleHelp = document.getElementById('rule-help');

  function loadStudents() {
    const gid = groupSel.value;
    fetch(`{% url 'chaqmoq:students_json' %}?group=${gid}`)
      .then(r => r.json())
      .then(data => {
        const cur = studentSel.value;
        studentSel.innerHTML = '<option value="">———</option>';
        data.students.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.id; opt.textContent = s.name;
          studentSel.appendChild(opt);
        });
        // saqlangan tanlovni ushlab turish
        if ([...studentSel.options].some(o => o.value === cur)) studentSel.value = cur;
        searchInp.dispatchEvent(new Event('input'));
      });
  }

  function applyRuleBounds() {
    const o = ruleSel.options[ruleSel.selectedIndex];
    if (!o || !o.dataset.min) { ballInp.min = 1; ballInp.max = ''; ruleHelp.textContent='Qoida tanla.'; return; }
    const min = parseInt(o.dataset.min, 10);
    const max = parseInt(o.dataset.max, 10);
    const typ = o.dataset.type; // plus/minus
    ballInp.min = min; ballInp.max = max;
    ballInp.value = min;
    ruleHelp.textContent = (typ === 'plus')
      ? `+${min}..+${max} oralig‘ida ball`
      : `-${min}..-${max} oralig‘ida (musbat son kiritsang ham minus bo‘lib yoziladi)`;
  }

  // filtr
  searchInp.addEventListener('input', function(){
    const q = this.value.toLowerCase();
    [...studentSel.options].forEach((opt, idx) => {
      if (idx === 0) return; // placeholder
      const show = opt.textContent.toLowerCase().includes(q);
      opt.hidden = !show;
    });
  });

  groupSel.addEventListener('change', loadStudents);
  ruleSel.addEventListener('change', applyRuleBounds);

  // initial
  applyRuleBounds();
})();
</script>
{% endblock %}
