{% extends 'base.html' %}
{% load tz %}
{% block content %}

<style>

/**************************************
  GLOBAL PAGE STYLE
**************************************/
body {
  background: linear-gradient(180deg, #0f172a, #1e293b, #0f172a);
  font-family: 'Poppins', sans-serif;
  min-height: 100vh;
  color: #e2e8f0;
}

/**************************************
  TITLE
**************************************/
.page-title {
  text-align: center;
  font-weight: 800;
  font-size: 2rem;
  color: #facc15;
  text-shadow: 0 3px 10px rgba(250,204,21,0.45);
  margin-bottom: 2.5rem;
}


/**************************************
  FORM WRAPPER
**************************************/
.form-wrapper {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 22px;
  padding: 2.5rem;
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  backdrop-filter: blur(10px);
  transition: 0.25s;
}

.form-wrapper:hover {
  box-shadow: 0 16px 45px rgba(59,130,246,0.35);
  border-color: rgba(59,130,246,0.32);
}

/**************************************
  LABELS
**************************************/
.form-label {
  font-weight: 600;
  color: #cbd5e1;
  margin-bottom: 6px;
}

/**************************************
  INPUTS + SELECTS
**************************************/
.form-control,
.form-select {
  background: rgba(255,255,255,0.08);
  color: #f8fafc;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 15px;
  transition: .25s ease;
}

.form-control:focus,
.form-select:focus {
  border-color: #3b82f6;
  background: rgba(255,255,255,0.12);
  box-shadow: 0 0 12px rgba(59,130,246,0.4);
}

/* SELECT ITEM COLOR FIX */
.form-select option {
  background: #0f172a;
  color: #e2e8f0;
}

/**************************************
  BUTTONS
**************************************/
.btn-save {
  background: linear-gradient(90deg, #22c55e, #16a34a);
  border: none;
  padding: 13px 20px;
  color: white;
  font-weight: 700;
  border-radius: 12px;
  width: 100%;
  box-shadow: 0 0 20px rgba(22,163,74,0.45);
  transition: 0.25s;
}

.btn-save:hover {
  transform: scale(1.05);
  background: linear-gradient(90deg, #16a34a, #22c55e);
  box-shadow: 0 0 28px rgba(22,163,74,0.6);
}

.btn-outline {
  border: 1px solid rgba(255,255,255,0.25);
  padding: 12px 20px;
  border-radius: 12px;
  color: #cbd5e1;
  font-weight: 600;
  transition: 0.25s;
}

.btn-outline:hover {
  background: rgba(255,255,255,0.12);
  color: #fff;
  transform: scale(1.05);
}

/**************************************
  RESPONSIVE FIXES
**************************************/
@media (max-width: 768px) {
  .form-wrapper {
    padding: 1.6rem;
  }
  .page-title {
    font-size: 1.6rem;
  }
}
</style>


<div class="container mt-5 mb-5">

  <h3 class="page-title">⚡ Chaqmoq berish yoki ayirish</h3>

  <form method="post" class="form-wrapper">
    {% csrf_token %}

    <!-- ROW 1 -->
    <div class="row mb-4">
      <div class="col-md-6 col-12 mb-3">
        <label class="form-label">📅 Davomat sanasi:</label>
        <input type="date"
               name="davomat_sana"
               id="davomat_sana"
               class="form-control"
               value="{{ request.GET.sana|default:today|date:'Y-m-d' }}">
      </div>

      <div class="col-md-6 col-12 mb-3">
        <label class="form-label">⚖️ Qoida:</label>
        <select name="rule" id="rule" class="form-select">
          <option value="">— Qoidani tanlang —</option>
          {% for r in rules %}
            <option value="{{ r.id }}">{{ r.nom }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <!-- ROW 2 -->
    <div class="row mb-4">

      <div class="col-md-6 col-12 mb-3">
        <label class="form-label">🧑‍🎓 O‘quvchi:</label>
        <select name="student" id="student" class="form-select">
          <option value="">— O‘quvchini tanlang —</option>
          {% for s in students %}
            <option value="{{ s.id }}">{{ s.ism }} {{ s.familya }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-3 col-12 mb-3">
        <label class="form-label">⚡ Ball:</label>
        <input type="number" name="ball" id="ball" class="form-control" placeholder="Masalan: 5">
      </div>

      <div class="col-md-3 col-12 d-flex align-items-end">
        <button type="submit" class="btn-save">💾 Saqlash</button>
      </div>

    </div>

    <!-- REYTING BUTTON -->
    <div class="text-end">
      <a href="{% url 'chaqmoq:reyting' %}" class="btn-outline">
        📊 Reytingni ko‘rish
      </a>
    </div>

  </form>

</div>

{% endblock %}
