{% extends 'base.html' %}
{% load tz %}
{% block content %}
<div class="container mt-4">
  <h3>⚡ Chaqmoq berish yoki ayirish</h3>
  <form method="post" class="mt-3 border p-4 rounded bg-light shadow-sm">
    {% csrf_token %}

    <div class="row mb-3">
      <div class="col-md-4">
        <label for="davomat_sana" class="form-label">Davomat sanasi:</label>
        <input type="date" name="davomat_sana" id="davomat_sana"
               class="form-control"
               value="{{ request.GET.sana|default:today|date:'Y-m-d' }}">
      </div>

      <div class="col-md-4">
        <label for="group" class="form-label">Guruh:</label>
        <select name="group" id="group" class="form-select">
          <option value="">— Guruhni tanlang —</option>
          {% for g in groups %}
            <option value="{{ g.id }}" {% if selected_gid == g.id|stringformat:'s' %}selected{% endif %}>
              {{ g.nom }} ({{ g.center.nom }})
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label for="rule" class="form-label">Qoida:</label>
        <select name="rule" id="rule" class="form-select">
          <option value="">— Qoidani tanlang —</option>
          {% for r in rules %}
            <option value="{{ r.id }}">{{ r.nom }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="student" class="form-label">O‘quvchi:</label>
        <select name="student" id="student" class="form-select">
          <option value="">— O‘quvchini tanlang —</option>
          {% for s in students %}
            <option value="{{ s.id }}">{{ s.ism }} {{ s.familya }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-3">
        <label for="ball" class="form-label">Ball:</label>
        <input type="number" name="ball" id="ball" class="form-control" placeholder="Masalan: 5">
      </div>

      <div class="col-md-3 d-flex align-items-end">
        <button type="submit" class="btn btn-success w-100">💾 Saqlash</button>
      </div>
    </div>

    <div class="text-end">
      <a href="{% url 'chaqmoq:reyting' %}" class="btn btn-outline-secondary">📊 Reytingni ko‘rish</a>
    </div>
  </form>
</div>
{% endblock %}
