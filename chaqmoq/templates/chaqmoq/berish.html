{% extends 'base.html' %}
{% load tz %}
{% block content %}

<style>
body {
  background: linear-gradient(180deg, #0f172a, #1e293b, #0f172a);
  font-family: 'Poppins', sans-serif;
  min-height: 100vh;
  color: #e2e8f0;
}

/* ⚡ Sarlavha */
h3 {
  text-align: center;
  color: #facc15;
  font-weight: 800;
  margin-bottom: 2rem;
  text-shadow: 0 2px 6px rgba(250,204,21,0.5);
}

/* 🧭 Forma konteyner */
form {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  padding: 2.5rem;
  backdrop-filter: blur(8px);
  transition: all 0.3s;
}
form:hover {
  box-shadow: 0 15px 40px rgba(59,130,246,0.3);
  border-color: rgba(59,130,246,0.3);
}

/* 🔹 Label */
label {
  font-weight: 600;
  color: #cbd5e1;
  margin-bottom: 6px;
}

/* 📦 Input va Selectlar */
input.form-control,
select.form-select {
  background: rgba(255,255,255,0.07);
  color: #f8fafc;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 10px 12px;
  transition: all 0.3s ease;
}

/* Fokus effekti */
input.form-control:focus,
select.form-select:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 10px rgba(59,130,246,0.4);
  background: rgba(255,255,255,0.1);
  outline: none;
}

/* 🔽 Select oynasi orqa fonini qoraytirish */
select {
  background-color: rgba(15,23,42,0.9) !important;
  color: #e2e8f0 !important;
}
select option {
  background-color: #0f172a;
  color: #f8fafc;
}
select option:hover,
select option:checked {
  background: linear-gradient(90deg, #3b82f6, #60a5fa);
  color: #fff;
}

/* 💾 Saqlash tugmasi */
.btn-success {
  background: linear-gradient(90deg, #22c55e, #16a34a);
  color: #fff;
  font-weight: 600;
  border: none;
  border-radius: 10px;
  padding: 12px 20px;
  box-shadow: 0 0 20px rgba(22,163,74,0.4);
  transition: 0.3s ease;
}
.btn-success:hover {
  background: linear-gradient(90deg, #16a34a, #22c55e);
  transform: scale(1.05);
  box-shadow: 0 0 25px rgba(22,163,74,0.6);
}

/* 📊 Reyting tugmasi */
.btn-outline-secondary {
  border: 1px solid rgba(255,255,255,0.25);
  color: #cbd5e1;
  border-radius: 10px;
  padding: 12px 20px;
  transition: 0.3s ease;
}
.btn-outline-secondary:hover {
  background: rgba(255,255,255,0.1);
  color: #fff;
  transform: scale(1.05);
}

/* ⚙️ Responsivlik */
@media (max-width: 768px) {
  form {
    padding: 1.5rem;
  }
}
</style>

<div class="container mt-5">
  <h3>⚡ Chaqmoq berish yoki ayirish</h3>

  <form method="post" class="shadow-lg">
    {% csrf_token %}

    <div class="row mb-6">
      <div class="col-md-6">
        <label for="davomat_sana" class="form-label">📅 Davomat sanasi:</label>
        <input type="date" name="davomat_sana" id="davomat_sana"
               class="form-control"
               value="{{ request.GET.sana|default:today|date:'Y-m-d' }}">
      </div>

      

      <div class="col-md-6">
        <label for="rule" class="form-label">⚖️ Qoida:</label>
        <select name="rule" id="rule" class="form-select">
          <option value="">— Qoidani tanlang —</option>
          {% for r in rules %}
            <option value="{{ r.id }}">{{ r.nom }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-md-6">
        <label for="student" class="form-label">🧑‍🎓 O‘quvchi:</label>
        <select name="student" id="student" class="form-select">
          <option value="">— O‘quvchini tanlang —</option>
          {% for s in students %}
            <option value="{{ s.id }}">{{ s.ism }} {{ s.familya }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-3">
        <label for="ball" class="form-label">⚡ Ball:</label>
        <input type="number" name="ball" id="ball" class="form-control" placeholder="Masalan: 5">
      </div>

      <div class="col-md-3 d-flex align-items-end">
        <button type="submit" class="btn btn-success w-100">💾 Saqlash</button>
      </div>
    </div>

    <div class="text-end">
      <a href="{% url 'chaqmoq:reyting' %}" class="btn btn-outline-secondary">📊 Reytingni ko‘rish</a>
    </div>
  </form>
</div>

{% endblock %}
