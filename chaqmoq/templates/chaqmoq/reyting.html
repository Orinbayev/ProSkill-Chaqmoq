{% extends 'base.html' %}
{% block content %}
<h3>Reyting (Chaqmoq bo‘yicha)</h3>
<table class="table table-striped">
  <thead><tr><th>#</th><th>Ism</th><th>Familiya</th><th>Jami Chaqmoq</th></tr></thead>
  <tbody>
    {% for r in rows %}
      <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ r.student__ism }}</td>
        <td>{{ r.student__familya }}</td>
        <td>{{ r.jami|default:0 }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="4">Maʼlumot yo‘q.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
