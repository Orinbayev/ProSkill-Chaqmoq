<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Defensive check for fetch to prevent "Cannot set property fetch of #<Window> which has only a getter"
      if (typeof window.fetch === 'function') {
        const originalFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            get: () => originalFetch,
            set: () => {
              console.warn('Attempt to overwrite window.fetch prevented.');
            },
            configurable: true
          });
        } catch (e) {
          console.warn('Could not redefine window.fetch, but it is already a getter.');
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
