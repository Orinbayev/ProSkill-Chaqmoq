<!DOCTYPE html>
<html>

<head>
    <style>
        /* CSS from stats_users.html */
        .menu-wrapper {
            position: relative;
            display: inline-block;
            z-index: 10;
        }

        .menu-btn {
            width: 32px;
            height: 32px;
            border: 1px solid red;
            /* Outline for visibility */
            cursor: pointer;
        }

        .menu-dropdown {
            display: none;
            position: fixed;
            background: #1e293b;
            border: 1px solid white;
            padding: 6px;
            min-width: 160px;
            z-index: 9999;
            color: white;
        }

        .menu-dropdown.open {
            display: block;
        }
    </style>
</head>

<body>
    <div style="margin-top: 100px; margin-left:100px;">
        <table>
            <tr>
                <td style="text-align: right;">
                    <div class="menu-wrapper">
                        <button class="menu-btn" type="button">...</button>
                        <div class="menu-dropdown">
                            <a href="#">Item 1</a>
                            <a href="#">Item 2</a>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </div>

    <script>
        function closeAllMenus() { document.querySelectorAll('.menu-dropdown').forEach(m => m.classList.remove('open')); }
        window.addEventListener('scroll', closeAllMenus, { passive: true });
        window.addEventListener('resize', closeAllMenus, { passive: true });

        document.addEventListener('click', function (e) {
            const btn = e.target.closest('.menu-btn');
            if (btn) {
                console.log('Button clicked');
                const menu = btn.nextElementSibling;
                const isOpen = menu.classList.contains('open');
                closeAllMenus();
                if (!isOpen) {
                    menu.classList.add('open');
                    const rect = btn.getBoundingClientRect();

                    let top = rect.bottom + 8;
                    let left = rect.right - 160;

                    menu.style.top = top + 'px';
                    menu.style.left = left + 'px';
                    console.log('Opened menu at', top, left);
                }
            } else if (!e.target.closest('.menu-dropdown')) {
                closeAllMenus();
            }
        });
    </script>
</body>

</html>
