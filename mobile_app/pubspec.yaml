name: chaqmoq_mobile
description: "ChaqmoqApp mobile CRM"
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.5
  google_fonts: ^6.2.1
  intl: ^0.20.2
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0
  flutter_local_notifications: ^21.0.0
  flutter_timezone: ^5.0.2
  image_picker: ^1.2.1
  timezone: ^0.11.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/login_logo.png
    - assets/images/login_illustration.png
    - assets/images/parent_avatar.png
    - assets/images/parent_child_avatar.png
    - assets/images/progress_teacher_avatar.png
    - assets/images/profile_child_sardor.png
    - assets/images/profile_child_madina.png
    - assets/images/profile_child_ali.png
