{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h3 class="fw-bold mb-3">👩‍🏫 O‘qituvchilar ro‘yxati</h3>
  <div class="list-group shadow-sm">
    {% for t in teachers %}
      <a href="{% url 'education:teacher_groups' t.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
        <span><strong>{{ t.get_full_name }}</strong></span>
        <span class="badge bg-primary">Ko‘rish →</span>
      </a>
    {% empty %}
      <div class="alert alert-warning">O‘qituvchilar topilmadi.</div>
    {% endfor %}
  </div>
</div>
{% endblock %}
