{% extends 'base.html' %}
{% block content %}

<style>

body {
  background: linear-gradient(180deg, #0f172a, #1e293b, #0f172a);
  font-family: 'Poppins', sans-serif;
  min-height: 100vh;
  color: #e2e8f0;
}

/* 📦 Asosiy konteyner */
.container {
  max-width: 900px;
  margin-top: 3rem;
}

/* 🟡 Sarlavha */
h3 {
  font-weight: 800;
  color: #facc15;
  text-align: center;
  margin-bottom: 2.5rem;
  text-shadow: 0 2px 6px rgba(250,204,21,0.5);
  font-size: 1.8rem;
}

/* 👩‍🏫 O‘qituvchi kartasi */
.teacher-card {
  background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  border-radius: 14px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.4);
  transition: all 0.3s ease;
  text-decoration: none;
  color: #f8fafc;
  padding: 1.2rem 1.6rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
  border: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  cursor: pointer;
}
.teacher-card:hover {
  transform: translateX(6px);
  box-shadow: 0 10px 25px rgba(59,130,246,0.3);
  border-color: rgba(59,130,246,0.4);
  background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(59,130,246,0.05));
}

/* 👩‍🏫 O‘qituvchi ismi */
.teacher-name {
  font-weight: 600;
  font-size: 1.1rem;
  display: flex;
  align-items: center;
  gap: 10px;
}
.teacher-name::before {
  content: "👩‍🏫";
  font-size: 1.3rem;
}

/* 🔹 Ko‘rish belgisi */
.view-badge {
  background: linear-gradient(90deg, #3b82f6, #60a5fa);
  color: #fff;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 10px;
  font-size: 0.9rem;
  transition: .3s;
  box-shadow: 0 0 12px rgba(59,130,246,0.3);
}
.teacher-card:hover .view-badge {
  background: linear-gradient(90deg, #60a5fa, #3b82f6);
  transform: translateX(4px);
  box-shadow: 0 0 18px rgba(59,130,246,0.5);
}

/* ⚠️ Bo‘sh holat */
.alert-warning {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(250,204,21,0.3);
  color: #facc15;
  border-radius: 12px;
  font-weight: 500;
  text-align: center;
  padding: 1.2rem;
  margin-top: 2rem;
  box-shadow: inset 0 0 20px rgba(250,204,21,0.2);
}

/* ===============================
📱 MOBILE OPTIMIZATION
==================================*/
@media (max-width: 576px) {

  .container {
    padding-left: 12px !important;
    padding-right: 12px !important;
  }

  h3 {
    font-size: 1.4rem;
    margin-bottom: 1.8rem;
  }

  .teacher-card {
    padding: 1rem 1.2rem;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }

  .teacher-name {
    font-size: 1rem;
  }

  .teacher-name::before {
    font-size: 1.2rem;
  }

  .view-badge {
    align-self: flex-end;
    font-size: 0.8rem;
    padding: 5px 10px;
  }
}

</style>

<div class="container">
  <h3>👩‍🏫 O‘qituvchilar ro‘yxati</h3>

  {% if teachers %}
    {% for t in teachers %}
      <a href="{% url 'education:teacher_groups' t.id %}" class="teacher-card">
        <span class="teacher-name">{{ t.get_full_name }}</span>
        <span class="view-badge">Ko‘rish →</span>
      </a>
    {% endfor %}
  {% else %}
    <div class="alert alert-warning">
      O‘qituvchilar topilmadi.
    </div>
  {% endif %}
</div>

{% endblock %}
