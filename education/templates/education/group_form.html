{% extends "base.html" %}
{% block content %}

<style>
body {
  background: linear-gradient(180deg, #0f172a, #1e293b, #0f172a);
  font-family: 'Poppins', sans-serif;
  min-height: 100vh;
  color: #e2e8f0;
}

.btn-cancel {
    text-decoration: none !important;
}

.btn-cancel:hover {
    text-decoration: none !important;
}

/* 🧭 Forma konteyner */
.form-wrapper {
  max-width: 800px;
  margin: 4rem auto;
  background: rgba(255,255,255,0.05);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 8px 25px rgba(0,0,0,0.5);
  padding: 2.5rem 3rem;
  backdrop-filter: blur(10px);
  transition: 0.3s;
}
.form-wrapper:hover {
  box-shadow: 0 12px 35px rgba(59,130,246,0.3);
  border-color: rgba(59,130,246,0.3);
}

/* 📘 Sarlavha */
.form-wrapper h3 {
  font-weight: 800;
  color: #facc15;
  text-align: center;
  margin-bottom: 2rem;
  text-shadow: 0 2px 6px rgba(250,204,21,0.5);
}

/* 🧾 Input va select maydonlari */
.form-wrapper input,
.form-wrapper select,
.form-wrapper textarea {
  border-radius: 10px;
  border: 1.5px solid rgba(255,255,255,0.1);
  padding: 10px 14px;
  width: 100%;
  font-size: 1rem;
  background-color: rgba(255,255,255,0.06);
  color: #f8fafc;
  transition: all 0.3s;
}

/* 🔹 Fokus animatsiyasi */
.form-wrapper input:focus,
.form-wrapper select:focus,
.form-wrapper textarea:focus {
  border-color: #3b82f6;
  background-color: rgba(59,130,246,0.08);
  box-shadow: 0 0 8px rgba(59,130,246,0.4);
  outline: none;
}

/* ✨ Select (O‘qituvchi tanlash) */
.form-wrapper select {
  cursor: pointer;
  appearance: none;
  position: relative;
  padding-right: 2.5rem;
}
.form-wrapper select:hover {
  transform: scale(1.02);
  border-color: #60a5fa;
}

/* 📏 Izoh maydoni */
.form-wrapper textarea {
  resize: vertical;
  min-height: 90px;
  max-height: 160px;
}

/* 🏷 Label */
.form-label {
  font-weight: 600;
  color: #e5e7eb;
  margin-bottom: 0.4rem;
}

/* ⚠️ Xatolik matni */
.text-danger.small {
  font-size: 0.85rem;
  color: #f87171;
}

/* 💾 Saqlash tugmasi */
.btn-save {
  background: linear-gradient(90deg, #22c55e, #16a34a);
  color: #fff;
  font-weight: 600;
  border: none;
  border-radius: 12px;
  padding: 12px 30px;
  transition: all 0.3s ease;
  box-shadow: 0 0 20px rgba(22,163,74,0.4);
}
.btn-save:hover {
  background: linear-gradient(90deg, #16a34a, #22c55e);
  transform: scale(1.06);
  box-shadow: 0 0 25px rgba(22,163,74,0.6);
}

/* ↩️ Bekor qilish tugmasi */
.btn-cancel {
  border-radius: 12px;
  padding: 12px 30px;
  font-weight: 600;
  border: 1.5px solid rgba(255,255,255,0.2);
  background-color: rgba(255,255,255,0.05);
  color: #cbd5e1;
  transition: 0.3s;
}
.btn-cancel:hover {
  background-color: rgba(255,255,255,0.1);
  transform: scale(1.05);
  color: #fff;
}

/* 🧩 Tugma joylashuvi */
.form-actions {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin-top: 1.8rem;
}

/* 🔽 Select oynasi */
select {
  background-color: rgba(15, 23, 42, 0.9) !important;
  color: #e2e8f0 !important;
}
select option {
  background-color: #0f172a;
  color: #f8fafc;
}
select option:hover,
select option:focus,
select option:checked {
  background: linear-gradient(90deg, #3b82f6, #60a5fa);
  color: #fff;
}

/* =====================================================================
   📱📱📱 RESPONSIVE – PHONE + TABLET UCHUN
   ===================================================================== */

/* 📱 Tablet (max 992px) */
@media (max-width: 992px) {
  .form-wrapper {
    margin: 2rem auto;
    padding: 2rem;
  }

  .form-actions {
    flex-direction: column;
  }

  .btn-save,
  .btn-cancel {
    width: 100%;
    text-align: center;
  }
}

/* 📱 Phone (max 768px) */
@media (max-width: 768px) {
  .form-wrapper {
    margin: 1.5rem auto;
    padding: 1.8rem;
  }

  .row.g-3 {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .col-md-4,
  .col-12 {
    width: 100%;
  }

  .btn-save,
  .btn-cancel {
    width: 100%;
  }
}

/* 📱 Kichik telefonlar (max 480px) */
@media (max-width: 480px) {
  .form-wrapper {
    padding: 1.4rem;
  }

  .form-wrapper h3 {
    font-size: 1.3rem;
  }

  input,
  select,
  textarea {
    font-size: 0.9rem !important;
  }

  .btn-save,
  .btn-cancel {
    font-size: 0.9rem;
    padding: 10px;
  }
}
</style>

<div class="container">
  <div class="form-wrapper">
    <h3>📘 Yangi guruh yaratish</h3>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}

      <div class="form-actions">
        <button type="submit" class="btn btn-save">💾 Saqlash</button>
        {% if category %}
          <a href="{% url 'education:category_detail' category.id %}" class="btn btn-cancel">
            Bekor qilish
          </a>
        {% else %}
          <a href="{% url 'education:groups_home' %}" class="btn btn-cancel">
            Bekor qilish
          </a>
        {% endif %}
      </div>
    </form>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.form-wrapper label').forEach(function (label) {
    const txt = label.textContent.trim();

    // 1) Yo'nalish maydonini yashirish
    if (txt.startsWith("Yo'nalish") || txt.startsWith("Yo‘nalish")) {
      const wrap = label.closest('p, .mb-3, div');
      if (wrap) wrap.style.display = 'none';
    }

    // 2) "Bir oyda darslar soni" maydonini yashirish
    if (txt.startsWith("Bir oyda darslar soni")) {
      const wrap = label.closest('p, .mb-3, div');
      if (wrap) wrap.style.display = 'none';
    }

    // 3) O'qituvchi foizi endi o'zgartiriladigan bo'lsin – bu yerda hech narsa qilmaymiz
    // (oldingi readOnly qo‘yilgan kodni olib tashladik)
  });
});
</script>


{% endblock %}
