{% extends 'base.html' %}
{% block content %}

<style>
/* --- Background --- */
body {
  background: radial-gradient(circle at top left, rgba(250,204,21,0.12), transparent),
              radial-gradient(circle at bottom right, rgba(56,189,248,0.18), transparent),
              #0f172a;
  min-height: 100vh;
  font-family: 'Poppins', sans-serif;
  color: #e2e8f0;
}

/* --- Card Wrapper --- */
.group-card {
  max-width: 650px;
  margin: 3rem auto;
  padding: 2rem 2.5rem;
  background: rgba(255,255,255,0.05);
  border-radius: 18px;
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 10px 30px rgba(0,0,0,0.55);
  animation: fadeIn 0.35s ease;
}

/* --- Title --- */
.group-title {
  text-align: center;
  font-size: 1.8rem;
  font-weight: 800;
  color: #facc15;
  text-shadow: 0 2px 10px rgba(250,204,21,0.5);
  margin-bottom: 1.3rem;
}

/* --- Form Inputs --- */
.group-card input,
.group-card select,
.group-card textarea {
  width: 100%;
  padding: 12px 15px;
  margin-bottom: 1rem;
  border-radius: 12px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  color: #e2e8f0;
  transition: 0.25s;
}

.group-card input:focus,
.group-card select:focus,
.group-card textarea:focus {
  border-color: #60a5fa;
  box-shadow: 0 0 12px rgba(96,165,250,0.4);
  background: rgba(255,255,255,0.15);
  outline: none;
}

/* --- Save Button --- */
.btn-save {
  width: 100%;
  padding: 11px;
  border: none;
  border-radius: 10px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(90deg,#22c55e,#16a34a);
  box-shadow: 0 0 20px rgba(34,197,94,0.3);
  transition: 0.3s;
}
.btn-save:hover {
  transform: scale(1.04);
  background: linear-gradient(90deg,#16a34a,#22c55e);
}

/* --- Back Button --- */
.btn-back {
  width: 100%;
  padding: 11px;
  margin-top: 0.8rem;
  border-radius: 10px;
  color: #cbd5e1;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.18);
}
.btn-back:hover {
  background: rgba(255,255,255,0.25);
}

/* --- Fade-in animation --- */
@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);}
  to   {opacity:1; transform:translateY(0);}
}
</style>

<div class="group-card">
  <h3 class="group-title">📘 Yangi guruh yaratish</h3>

  <form method="post">
    {% csrf_token %}
    <div class="styled-form">
      {{ form.as_p }}
    </div>

    <button class="btn-save">💾 Saqlash</button>
    <a class="btn-back d-block text-center" href="{% url 'education:guruhlar' %}">⬅️ Bekor qilish</a>
  </form>
</div>

{% endblock %}
