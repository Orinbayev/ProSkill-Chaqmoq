{% extends 'base.html' %}
{% block content %}
<h3>Mening guruhlarim</h3>
<table class="table table-striped">
  <thead><tr><th>Guruh</th><th>Center</th><th>Talabalar</th><th></th></tr></thead>
  <tbody>
    {% for g in groups %}
      <tr>
        <td>{{ g.nom }}</td>
        <td>{{ g.center.nom }}</td>
        <td>{{ g.enrollments.count }}</td>
        <td class="text-nowrap">
          <a class="btn btn-sm btn-outline-primary" href="{% url 'education:group_detail' g.pk %}">Ko‘rish</a>
          <a class="btn btn-sm btn-success" href="{% url 'education:group_rollcall' g.pk %}">Davomat / Chaqmoq</a>
        </td>
      </tr>
    {% empty %}
      <tr><td colspan="4">Guruh yo‘q.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
