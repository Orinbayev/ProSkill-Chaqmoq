{% extends 'base.html' %}
{% block content %}

<style>
body {
  background: linear-gradient(180deg, #0f172a, #1e293b, #0f172a);
  color: #e2e8f0;
  font-family: "Poppins", sans-serif;
}

/* Title */
.page-title {
  font-weight: 800;
  color: #facc15;
  text-shadow: 0 2px 6px rgba(250, 204, 21, 0.5);
  margin-bottom: 1.5rem;
}

/* Table container */
.table-wrapper {
  background: rgba(255,255,255,0.06);
  padding: 1.2rem;
  border-radius: 18px;
  backdrop-filter: blur(6px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.35);
}

/* Table */
.table-custom thead {
  background: rgba(255,255,255,0.10);
}
.table-custom tbody tr:hover {
  background: rgba(255,255,255,0.12);
  transition: 0.25s ease;
}

/* Buttons */
.btn-view {
  border: 1px solid #3b82f6;
  color: #3b82f6;
  border-radius: 8px;
  font-weight: 600;
}
.btn-view:hover {
  background: #3b82f6;
  color: #fff;
}

.btn-roll {
  border: 1px solid #22c55e;
  color: #22c55e;
  border-radius: 8px;
  font-weight: 600;
}
.btn-roll:hover {
  background: #22c55e;
  color: #fff;
}

/* Empty message */
.empty-text {
  color: #94a3b8;
}

/* Mobile */
@media (max-width: 768px) {
  .table-wrapper {
    padding: 0.7rem;
  }
  .btn-view, .btn-roll {
    padding: 3px 7px;
    font-size: 0.75rem;
  }
}
</style>

<div class="container py-4">

  <h3 class="page-title">📘 Mening guruhlarim</h3>

  <div class="table-wrapper">
    <table class="table table-custom table-hover align-middle">
      <thead>
        <tr>
          <th>Guruh</th>
          <th>Center</th>
          <th>Talabalar</th>
          <th class="text-center">Amallar</th>
        </tr>
      </thead>

      <tbody>
      {% for g in groups %}
        <tr>
          <td class="fw-semibold text-info">{{ g.nom }}</td>
          <td>{{ g.center.nom }}</td>
          <td>{{ g.enrollments.count }}</td>

          <td class="text-center text-nowrap">
            <a href="{% url 'education:group_detail' g.pk %}"
               class="btn btn-sm btn-view me-1">👁️ Ko‘rish</a>

            <a href="{% url 'education:group_rollcall' g.pk %}"
               class="btn btn-sm btn-roll">📋 Davomat / Chaqmoq</a>
          </td>
        </tr>

      {% empty %}
        <tr>
          <td colspan="4" class="text-center py-4 empty-text">
            Hozircha guruh yo‘q.
          </td>
        </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>

</div>

{% endblock %}
