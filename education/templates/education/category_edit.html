{% extends "base.html" %}
{% block body_class %}category-edit-page{% endblock %}
{% block title %}Bo'limni tahrirlash | ChaqmoqApp{% endblock %}

{% block extra_css %}
<style>
/* ================================================================
   CATEGORY EDIT — clean form page (dark + light)
   ================================================================ */
:root {
  --ce-accent:       #a855f7;
  --ce-accent2:      #7c3aed;
  --ce-accent-glow:  rgba(168, 85, 247, 0.18);
  --ce-bg-card:      rgba(17, 24, 39, 0.65);
  --ce-bg-input:     rgba(7, 11, 22, 0.45);
  --ce-border:       rgba(255, 255, 255, 0.08);
  --ce-border-focus: rgba(168, 85, 247, 0.45);
  --ce-text:         #f3f4f6;
  --ce-muted:        #94a3b8;
  --ce-radius-lg:    24px;
  --ce-radius-md:    16px;
  --ce-radius-sm:    12px;
}

.ce-wrap {
  min-height: calc(100vh - 80px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  font-family: 'Outfit', 'Inter', system-ui, sans-serif;
  color: var(--ce-text);
}

.ce-card {
  position: relative;
  width: 100%;
  max-width: 640px;
  background: var(--ce-bg-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--ce-border);
  border-radius: var(--ce-radius-lg);
  padding: 40px;
  box-shadow: 0 32px 80px rgba(0, 0, 0, 0.55);
  overflow: hidden;
}

.ce-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% -20%, rgba(168,85,247,0.07) 0%, transparent 55%);
  pointer-events: none;
  z-index: 0;
}

.ce-body { position: relative; z-index: 1; }

/* Header */
.ce-header {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 32px;
}
.ce-icon {
  width: 56px;
  height: 56px;
  border-radius: var(--ce-radius-md);
  background: linear-gradient(135deg, rgba(168,85,247,0.18), rgba(168,85,247,0.05));
  border: 1px solid rgba(168,85,247,0.28);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.ce-icon i { font-size: 22px; color: var(--ce-accent); }
.ce-header-text h1 {
  font-size: 26px;
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.3px;
  color: var(--ce-text);
}
.ce-header-text h1 span { color: var(--ce-accent); }
.ce-header-text p {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--ce-muted);
}

/* Fields */
.ce-fields { display: grid; gap: 20px; }

.ce-field label {
  display: block;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1.1px;
  color: var(--ce-muted);
  margin-bottom: 8px;
  padding-left: 2px;
}

.ce-field input[type="text"],
.ce-field textarea {
  width: 100%;
  background: var(--ce-bg-input);
  border: 1px solid var(--ce-border);
  border-radius: var(--ce-radius-md);
  padding: 13px 16px;
  color: var(--ce-text);
  font-size: 14px;
  font-weight: 500;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  font-family: inherit;
  box-sizing: border-box;
}
.ce-field textarea {
  min-height: 110px;
  resize: vertical;
}
.ce-field input[type="text"]:focus,
.ce-field textarea:focus {
  border-color: var(--ce-border-focus);
  box-shadow: 0 0 0 4px var(--ce-accent-glow);
}
.ce-field input::placeholder,
.ce-field textarea::placeholder {
  color: rgba(148,163,184,0.6);
}

/* Autofill */
.ce-field input:-webkit-autofill {
  -webkit-text-fill-color: #f3f4f6 !important;
  -webkit-box-shadow: 0 0 0 1000px rgba(7,11,22,0.45) inset !important;
}

/* Actions */
.ce-actions {
  margin-top: 28px;
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 14px;
}
@media (max-width: 480px) {
  .ce-actions { grid-template-columns: 1fr; }
  .ce-card    { padding: 28px 20px; }
}

.ce-btn-save {
  background: linear-gradient(135deg, var(--ce-accent), var(--ce-accent2));
  color: #fff;
  border: none;
  border-radius: var(--ce-radius-md);
  padding: 14px 20px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: all 0.25s ease;
  box-shadow: 0 8px 24px rgba(168,85,247,0.22);
  font-family: inherit;
}
.ce-btn-save:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(168,85,247,0.32);
  filter: brightness(1.06);
}
.ce-btn-save:active { transform: translateY(0); }

.ce-btn-cancel {
  background: rgba(255,255,255,0.04);
  color: var(--ce-text);
  border: 1px solid var(--ce-border);
  border-radius: var(--ce-radius-md);
  padding: 14px 20px;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s ease;
  font-family: inherit;
}
.ce-btn-cancel:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.15);
  color: var(--ce-text);
  text-decoration: none;
}

/* ================================================================
   LIGHT MODE
   ================================================================ */
html[data-role-theme="light"] body.category-edit-page {
  background: #f1f5f9 !important;
}

html[data-role-theme="light"] body.category-edit-page .ce-card {
  background: #ffffff !important;
  border-color: #e2e8f0 !important;
  box-shadow: 0 4px 24px rgba(15,23,42,0.09) !important;
  backdrop-filter: none !important;
}

html[data-role-theme="light"] body.category-edit-page .ce-card::before {
  display: none;
}

html[data-role-theme="light"] body.category-edit-page .ce-icon {
  background: #f3e8ff !important;
  border-color: #d8b4fe !important;
}

html[data-role-theme="light"] body.category-edit-page .ce-header-text h1 {
  color: #0f172a !important;
}

html[data-role-theme="light"] body.category-edit-page .ce-header-text p {
  color: #64748b !important;
}

html[data-role-theme="light"] body.category-edit-page .ce-field label {
  color: #475569 !important;
}

html[data-role-theme="light"] body.category-edit-page .ce-field input[type="text"],
html[data-role-theme="light"] body.category-edit-page .ce-field textarea {
  background: #f8fafc !important;
  border-color: #cbd5e1 !important;
  color: #1e293b !important;
}

html[data-role-theme="light"] body.category-edit-page .ce-field input[type="text"]:focus,
html[data-role-theme="light"] body.category-edit-page .ce-field textarea:focus {
  border-color: #a855f7 !important;
  box-shadow: 0 0 0 3px rgba(168,85,247,0.12) !important;
}

html[data-role-theme="light"] body.category-edit-page .ce-field input::placeholder,
html[data-role-theme="light"] body.category-edit-page .ce-field textarea::placeholder {
  color: #94a3b8 !important;
}

html[data-role-theme="light"] body.category-edit-page .ce-field input:-webkit-autofill {
  -webkit-text-fill-color: #1e293b !important;
  -webkit-box-shadow: 0 0 0 1000px #f8fafc inset !important;
}

html[data-role-theme="light"] body.category-edit-page .ce-btn-cancel {
  background: #f1f5f9 !important;
  border-color: #e2e8f0 !important;
  color: #334155 !important;
}

html[data-role-theme="light"] body.category-edit-page .ce-btn-cancel:hover {
  background: #e2e8f0 !important;
  color: #0f172a !important;
}
</style>
{% endblock %}

{% block content %}
<div class="ce-wrap">
  <div class="ce-card">
    <div class="ce-body">

      <div class="ce-header">
        <div class="ce-icon">
          <i class="fa-solid fa-pen-to-square"></i>
        </div>
        <div class="ce-header-text">
          <h1>Bo'limni <span>tahrirlash</span></h1>
          <p>Nom va tavsifni yangilang</p>
        </div>
      </div>

      <form method="POST" id="editForm">
        {% csrf_token %}

        <div class="ce-fields">
          <div class="ce-field">
            <label for="id_name">Bo'lim nomi</label>
            <input
              type="text"
              name="name"
              id="id_name"
              value="{{ cat.name }}"
              required
              autocomplete="off"
              placeholder="Masalan: Matematika"
            >
          </div>

          <div class="ce-field">
            <label for="id_description">Tavsif</label>
            <textarea
              name="description"
              id="id_description"
              rows="4"
              placeholder="Bo'lim haqida qisqacha ma'lumot..."
            >{{ cat.description }}</textarea>
          </div>
        </div>

        <div class="ce-actions">
          <button type="submit" class="ce-btn-save">
            <i class="fa-solid fa-floppy-disk"></i>
            O'zgarishlarni saqlash
          </button>
          <a href="{% url 'education:groups_home' %}" class="ce-btn-cancel">
            <i class="fa-solid fa-arrow-left"></i>
            Orqaga
          </a>
        </div>
      </form>

    </div>
  </div>
</div>
{% endblock %}
