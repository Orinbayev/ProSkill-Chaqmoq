{% extends "base.html" %}
{% block content %}

<style>
/* === GLOBAL DARK BACKGROUND === */
body {
  background: radial-gradient(circle at top left, rgba(250,204,21,0.15), transparent),
              radial-gradient(circle at bottom right, rgba(56,189,248,0.15), transparent),
              #0f172a;
  min-height: 100vh;
  font-family: 'Poppins', sans-serif;
  color: #e2e8f0;
}

/* === FORM WRAPPER === */
.form-container {
  max-width: 650px;
  margin: 3rem auto;
  padding: 2rem 2.5rem;
  border-radius: 18px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 10px 35px rgba(0,0,0,0.5);
  animation: fadeIn 0.4s ease-in-out;
}

/* === TITLE === */
.form-container h3 {
  text-align: center;
  color: #facc15;
  font-size: 1.8rem;
  font-weight: 800;
  margin-bottom: 1.5rem;
  text-shadow: 0 2px 10px rgba(250,204,21,0.5);
}

/* === LABEL === */
label {
  font-weight: 600;
  color: #cbd5e1;
  margin-bottom: 6px;
}

/* === INPUTS === */
input,
textarea {
  width: 100%;
  padding: 12px 15px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06);
  color: #e2e8f0;
  font-size: 1rem;
  transition: 0.25s;
}
input::placeholder,
textarea::placeholder {
  color: #94a3b8;
}
input:focus,
textarea:focus {
  border-color: #60a5fa;
  background: rgba(255,255,255,0.12);
  box-shadow: 0 0 12px rgba(96,165,250,0.4);
  outline: none;
}

/* === PREVIEW IMAGE === */
.preview {
  text-align: center;
  margin-bottom: 10px;
}
.preview p {
  color: #e2e8f0;
  font-weight: 600;
}
.preview img {
  max-width: 160px;
  border-radius: 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.4);
}

/* === SAVE BUTTON === */
.btn-save {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(90deg, #22c55e, #16a34a);
  box-shadow: 0 0 20px rgba(34,197,94,0.35);
  transition: 0.3s;
}
.btn-save:hover {
  transform: scale(1.04);
  background: linear-gradient(90deg, #16a34a, #22c55e);
}

/* === BACK BUTTON === */
.btn-back {
  width: 100%;
  margin-top: 0.8rem;
  padding: 12px;
  border-radius: 10px;
  font-weight: 600;
  background: rgba(255,255,255,0.1);
  color: #cbd5e1;
  border: 1px solid rgba(255,255,255,0.15);
  transition: 0.3s;
}
.btn-back:hover {
  background: rgba(255,255,255,0.2);
  border-color: rgba(255,255,255,0.35);
}

/* === ANIMATION === */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>


<div class="form-container">
  <h3>✏️ Bo‘limni tahrirlash</h3>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- NAME -->
    <div class="mb-3">
      <label for="id_name">Bo‘lim nomi</label>
      <input type="text" name="name" id="id_name"
             value="{{ cat.name }}" required>
    </div>

    <!-- DESCRIPTION -->
    <div class="mb-3">
      <label for="id_description">Tavsif</label>
      <textarea name="description" id="id_description" rows="3">{{ cat.description }}</textarea>
    </div>

    <!-- IMAGE -->
    <div class="mb-3">
      <label for="id_image">Bo‘lim rasmi (ixtiyoriy)</label><br>

      {% if cat.image %}
      <div class="preview mb-2">
        <p>🖼️ Joriy rasm:</p>
        <img id="previewImg" src="{{ cat.image.url }}" alt="{{ cat.name }}">
      </div>
      {% else %}
      <div class="preview mb-2" style="display:none;">
        <img id="previewImg" src="#" alt="Preview">
      </div>
      {% endif %}

      <input type="file" name="image" id="id_image" accept="image/*">
    </div>

    <!-- BUTTONS -->
    <button type="submit" class="btn btn-save">💾 Saqlash</button>
    <a href="{% url 'education:groups_home' %}" class="btn btn-back">⬅️ Orqaga</a>
  </form>
</div>


<!-- IMAGE PREVIEW SCRIPT -->
<script>
document.getElementById("id_image").addEventListener("change", function(event) {
  const file = event.target.files[0];
  const previewImg = document.getElementById("previewImg");
  const previewBox = previewImg.parentElement;

  if (file) {
    previewBox.style.display = "block";
    previewImg.src = URL.createObjectURL(file);
  }
});
</script>

{% endblock %}
