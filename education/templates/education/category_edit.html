{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
  <h3 class="text-primary mb-3">✏️ Bo‘limni tahrirlash</h3>
  <form method="post" class="card p-4 shadow-sm">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label fw-semibold">Bo‘lim nomi</label>
      <input type="text" name="name" class="form-control" value="{{ cat.name }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Tavsif</label>
      <textarea name="description" class="form-control" rows="3">{{ cat.description }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">💾 Saqlash</button>
    <a href="{% url 'education:groups_home' %}" class="btn btn-secondary ms-2">Bekor qilish</a>
  </form>
</div>
{% endblock %}
