{% extends "base.html" %}
{% block content %}

<style>
  :root{
    --bg0:#020617;
    --bg1:#070b16;
    --bg2:#0b1226;

    --glass: rgba(17,24,39,.62);
    --glass2: rgba(2,6,23,.55);
    --stroke: rgba(255,255,255,.10);
    --stroke2: rgba(255,255,255,.14);

    --text:#e5e7eb;
    --muted:#94a3b8;

    --amber:#fbbf24;
    --amber2:#f59e0b;

    --neon:#38bdf8;
    --neon2:#0ea5e9;

    --violet:#a855f7;
    --violet2:#7c3aed;

    --green:#22c55e;
    --green2:#16a34a;

    --shadow: 0 26px 90px rgba(0,0,0,.55);
    --shadow2: 0 18px 44px rgba(0,0,0,.42);

    --r14:14px;
    --r18:18px;
    --r22:22px;
    --r28:28px;

    --pad: clamp(14px, 2.7vw, 22px);
    --gap: clamp(10px, 2.2vw, 14px);

    --ringA: 0 0 0 3px rgba(251,191,36,.18);
    --ringN: 0 0 0 3px rgba(56,189,248,.18);
    --ringV: 0 0 0 3px rgba(168,85,247,.18);
    --ringG: 0 0 0 3px rgba(34,197,94,.18);
  }

  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    background:
      radial-gradient(980px 640px at 12% -10%, rgba(56,189,248,.16), transparent 55%),
      radial-gradient(980px 640px at 88% 0%, rgba(251,191,36,.14), transparent 55%),
      radial-gradient(980px 680px at 55% 120%, rgba(168,85,247,.14), transparent 60%),
      linear-gradient(180deg, var(--bg0), var(--bg2));
    color: var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }

  :focus-visible{ outline:none; }

  /* page */
  .page-wrap{
    width: min(1100px, 100%);
    margin: 0 auto;
    padding: 16px 12px 28px;
  }

  /* card */
  .glass-card{
    width: min(760px, 100%);
    margin: 0 auto;
    border-radius: var(--r28);
    background: linear-gradient(180deg, var(--glass), var(--glass2));
    border: 1px solid var(--stroke);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    position: relative;
    overflow:hidden;
    padding: calc(var(--pad) + 6px);
  }

  .glass-card::before{
    content:"";
    position:absolute;
    inset:-2px;
    background:
      radial-gradient(720px 280px at 20% 0%, rgba(56,189,248,.18), transparent 65%),
      radial-gradient(720px 280px at 70% 10%, rgba(251,191,36,.14), transparent 65%),
      radial-gradient(720px 280px at 55% 120%, rgba(168,85,247,.16), transparent 65%);
    filter: blur(18px);
    opacity:.95;
    pointer-events:none;
  }
  .glass-card > *{ position:relative; z-index:2; }

  /* header */
  .head{
    display:flex;
    align-items:flex-start;
    gap: 14px;
    margin-bottom: 16px;
  }

  .head-icon{
    width:56px;
    height:56px;
    border-radius: 18px;
    display:grid;
    place-items:center;
    background: rgba(168,85,247,.12);
    border: 1px solid rgba(168,85,247,.25);
    box-shadow: 0 16px 36px rgba(168,85,247,.10);
    flex: 0 0 auto;
  }

  .head-icon .pen{
    width:34px; height:34px;
    border-radius: 14px;
    display:grid;
    place-items:center;
    background: rgba(2,6,23,.45);
    border: 1px solid rgba(255,255,255,.08);
    color: #e9d5ff;
    font-weight: 950;
    font-size: 18px;
    line-height: 1;
  }

  .title{
    margin:0;
    font-size: clamp(24px, 4.2vw, 34px);
    font-weight: 950;
    letter-spacing: .2px;
    line-height: 1.06;
  }
  .title .accent{
    color: rgba(192,132,252,.98);
    text-shadow: 0 0 26px rgba(168,85,247,.14);
  }

  .subtitle{
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.5;
    font-weight: 700;
  }

  /* grid */
  .form-grid{
    display:grid;
    grid-template-columns: 1fr;
    gap: var(--gap);
    margin-top: 10px;
  }

  /* labels */
  .label{
    display:flex;
    align-items:center;
    gap:10px;
    color: rgba(229,231,235,.95);
    font-weight: 900;
    letter-spacing: .10em;
    text-transform: uppercase;
    font-size: 12px;
    margin: 2px 2px 8px;
  }
  .label .mark{
    width: 8px; height: 8px;
    border-radius: 999px;
    background: rgba(168,85,247,.85);
    box-shadow: 0 0 0 4px rgba(168,85,247,.14);
  }

  /* inputs */
  input[type="text"],
  input[type="file"],
  textarea{
    width:100%;
    border-radius: var(--r18);
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(2,6,23,.35) !important;
    padding: 13px 14px;
    color: #e5e7eb !important;
    outline:none;
    transition: .18s ease;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
    font-weight: 750;
    font-size: 14px;
    color-scheme: dark;
  }

  textarea{ min-height: 112px; resize: vertical; }

  input::placeholder,
  textarea::placeholder{
    color: rgba(148,163,184,.88) !important;
    font-weight: 750;
  }

  input[type="text"]:focus,
  textarea:focus{
    border-color: rgba(168,85,247,.55) !important;
    box-shadow: var(--ringV), inset 0 0 0 1px rgba(255,255,255,.03) !important;
  }

  /* file input */
  input[type="file"]{ padding: 11px 12px; }
  input[type="file"]::file-selector-button{
    background: rgba(168,85,247,.18);
    border: 1px solid rgba(168,85,247,.28);
    color: #f5f3ff;
    border-radius: 14px;
    padding: 9px 12px;
    margin-right: 12px;
    font-weight: 900;
    cursor: pointer;
    transition: transform .18s ease, filter .18s ease;
  }
  input[type="file"]::file-selector-button:hover{
    filter: brightness(1.08);
    transform: translateY(-1px);
  }

  /* Chrome autofill */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus,
  textarea:-webkit-autofill{
    -webkit-text-fill-color: #e5e7eb !important;
    -webkit-box-shadow: 0 0 0 1000px rgba(2,6,23,.35) inset !important;
    transition: background-color 9999s ease-in-out 0s !important;
    caret-color: #c084fc !important;
  }

  /* preview */
  .preview{
    display:none;
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(15,23,42,.28);
    border-radius: var(--r22);
    padding: 14px;
    margin-top: 12px;
  }
  .preview.show{ display:block; }

  .preview-title{
    margin: 0 0 10px;
    color: rgba(229,231,235,.95);
    font-weight: 950;
    display:flex;
    gap:10px;
    align-items:center;
    font-size: 13px;
  }
  .preview-title .spark{ color: #c084fc; }

  .preview img{
    width: 100%;
    max-width: 280px;
    border-radius: var(--r18);
    border: 1px solid rgba(168,85,247,.25);
    box-shadow: 0 18px 44px rgba(168,85,247,.12);
    display:block;
  }

  /* buttons */
  .btns{
    margin-top: 16px;
    display:grid;
    gap: 12px;
  }

  .btn-main{
    width:100%;
    min-height: 52px;
    border-radius: var(--r18);
    padding: 14px 16px;
    font-weight: 950;
    letter-spacing: .2px;
    cursor:pointer;
    transition: transform .18s ease, filter .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-decoration:none;
    user-select:none;
  }

  .btn-save{
    background: linear-gradient(90deg, var(--green), var(--green2));
    color: #062314;
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 18px 40px rgba(34,197,94,.18);
  }
  .btn-save:hover{ transform: translateY(-1px); filter: brightness(1.04); }
  .btn-save:active{ transform: translateY(0) scale(.99); }
  .btn-save:focus-visible{ box-shadow: var(--ringG), 0 18px 40px rgba(34,197,94,.18); }

  .btn-back{
    background: rgba(148,163,184,.10);
    color: rgba(229,231,235,.95);
    border: 1px solid rgba(255,255,255,.10);
  }
  .btn-back:hover{ background: rgba(148,163,184,.16); transform: translateY(-1px); }
  .btn-back:active{ transform: translateY(0) scale(.99); }
  .btn-back:focus-visible{ box-shadow: var(--ringN); border-color: rgba(56,189,248,.35); }

  /* responsive layout */
  @media (min-width: 820px){
    .form-grid{
      grid-template-columns: 1.1fr .9fr;
      align-items:start;
      gap: 16px;
    }
    .form-grid .full{ grid-column: 1 / -1; }
    .btns{
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
  }

  @media (max-width: 520px){
    .glass-card{ padding: 20px 16px 18px; border-radius: 22px; }
    .head-icon{ width:52px; height:52px; border-radius: 16px; }
    .btn-main{ padding: 14px 14px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>

<main class="page-wrap">
  <section class="glass-card" aria-label="Forma: bo‘limni tahrirlash">

    <header class="head">
      <div class="head-icon" aria-hidden="true">
        <div class="pen">✎</div>
      </div>

      <div style="min-width:0;">
        <h1 class="title"><span class="accent">Bo‘limni</span> tahrirlash</h1>
        <p class="subtitle">Bo‘lim ma’lumotlarini yangilang (nom, tavsif va rasm)</p>
      </div>
    </header>

    <form method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="form-grid">
        <div>
          <label class="label" for="id_name"><span class="mark" aria-hidden="true"></span> Bo‘lim nomi</label>
          <input type="text" name="name" id="id_name" value="{{ cat.name }}" required autocomplete="off">
        </div>

        <div>
          <label class="label" for="id_image"><span class="mark" aria-hidden="true"></span> Bo‘lim rasmi (ixtiyoriy)</label>
          <input type="file" name="image" id="id_image" accept="image/*">

          <div class="preview {% if cat.image %}show{% endif %}" id="imagePreview">
            <p class="preview-title"><span class="spark">✦</span> Joriy / Tanlangan rasm</p>
            {% if cat.image %}
              <img id="previewImg" src="{{ cat.image.url }}" alt="{{ cat.name }}">
            {% else %}
              <img id="previewImg" src="#" alt="Preview">
            {% endif %}
          </div>
        </div>

        <div class="full">
          <label class="label" for="id_description"><span class="mark" aria-hidden="true"></span> Tavsif</label>
          <textarea name="description" id="id_description" rows="3" autocomplete="off">{{ cat.description }}</textarea>
        </div>
      </div>

      <div class="btns">
        <button type="submit" class="btn-main btn-save">💾 Saqlash</button>

        <a href="{% url 'education:groups_home' %}" class="btn-main btn-back">← Orqaga</a>
      </div>
    </form>

  </section>
</main>

<script>
  const input = document.getElementById("id_image");
  const box = document.getElementById("imagePreview");
  const img = document.getElementById("previewImg");

  if (input) {
    input.addEventListener("change", function (event) {
      const file = event.target.files[0];
      if (file) {
        box.classList.add("show");
        img.src = URL.createObjectURL(file);
      }
    });
  }
</script>

{% endblock %}
