<style>

    gap: 12px;

    line-height: 1.1;

    background: rgba(30, 41, 59, 0.65);

    color: #fff;

    font-weight: 800;

  }

    background: rgba(245, 158, 11, 0.16);

    border-color: rgba(245, 158, 11, 0.35);
  }
