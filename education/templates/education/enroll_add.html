{% extends 'base.html' %}
{% block content %}

<style>
/* --- Global Background --- */
body {
  background: radial-gradient(circle at top left, rgba(250,204,21,0.12), transparent),
              radial-gradient(circle at bottom right, rgba(59,130,246,0.18), transparent),
              #0f172a;
  min-height: 100vh;
  font-family: 'Poppins', sans-serif;
  color: #e2e8f0;
}

/* --- Main Card --- */
.enroll-card {
  max-width: 650px;
  margin: 3rem auto;
  padding: 2rem 2.5rem;
  background: rgba(255,255,255,0.05);
  border-radius: 18px;
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  animation: fadeIn 0.35s ease;
}

/* --- Title --- */
.enroll-title {
  text-align: center;
  color: #facc15;
  font-size: 1.8rem;
  font-weight: 800;
  margin-bottom: 1.3rem;
  text-shadow: 0 2px 10px rgba(250,204,21,0.5);
}

/* --- Form Elements Style --- */
.enroll-card input,
.enroll-card select,
.enroll-card textarea {
  width: 100%;
  padding: 12px 15px;
  border-radius: 12px;
  margin-bottom: 1rem;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  color: #e2e8f0;
  transition: 0.25s;
}

.enroll-card input:focus,
.enroll-card select:focus,
.enroll-card textarea:focus {
  border-color: #60a5fa;
  background: rgba(255,255,255,0.15);
  box-shadow: 0 0 12px rgba(96,165,250,0.4);
  outline: none;
}

/* --- Save Button --- */
.btn-save {
  width: 100%;
  padding: 11px;
  border: none;
  border-radius: 10px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(90deg,#22c55e,#16a34a);
  box-shadow: 0 0 20px rgba(34,197,94,0.35);
  transition: 0.25s;
}
.btn-save:hover {
  transform: scale(1.04);
  background: linear-gradient(90deg,#16a34a,#22c55e);
}

/* --- Back Button --- */
.btn-back {
  width: 100%;
  margin-top: 0.8rem;
  padding: 11px;
  font-weight: 600;
  border-radius: 10px;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.18);
  color: #cbd5e1;
}
.btn-back:hover {
  background: rgba(255,255,255,0.25);
}

/* --- Fade-in Animation --- */
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(12px);}
  to {opacity: 1; transform: translateY(0);}
}
</style>

<div class="enroll-card">
  <h3 class="enroll-title">🧑‍🎓 Talabani guruhga qo‘shish</h3>

  <form method="post">{% csrf_token %}
    <div class="styled-form">
      {{ form.as_p }}
    </div>

    <button class="btn-save">💾 Saqlash</button>
    <a class="btn-back d-block text-center mt-2" href="{% url 'education:guruhlar' %}">⬅️ Bekor qilish</a>
  </form>
</div>

{% endblock %}
