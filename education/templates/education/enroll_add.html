{% extends 'base.html' %}
{% block content %}

<style>
  :root{
    --bg0:#020617;
    --bg1:#070b16;
    --bg2:#0b1226;

    --glass: rgba(17,24,39,.62);
    --glass2: rgba(2,6,23,.55);
    --stroke: rgba(255,255,255,.10);

    --text:#e5e7eb;
    --muted:#94a3b8;

    --amber:#fbbf24;
    --amber2:#f59e0b;

    --neon:#38bdf8;
    --neon2:#0ea5e9;

    --green:#22c55e;
    --green2:#16a34a;

    --shadow: 0 26px 90px rgba(0,0,0,.55);

    --r14:14px;
    --r18:18px;
    --r22:22px;
    --r28:28px;

    --pad: clamp(14px, 2.7vw, 22px);
    --gap: clamp(10px, 2.2vw, 14px);

    --ringA: 0 0 0 3px rgba(251,191,36,.18);
    --ringN: 0 0 0 3px rgba(56,189,248,.18);
    --ringG: 0 0 0 3px rgba(34,197,94,.18);
  }

  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    background:
      radial-gradient(980px 640px at 12% -10%, rgba(56,189,248,.16), transparent 55%),
      radial-gradient(980px 640px at 88% 0%, rgba(251,191,36,.14), transparent 55%),
      radial-gradient(980px 680px at 55% 120%, rgba(34,197,94,.12), transparent 60%),
      linear-gradient(180deg, var(--bg0), var(--bg2));
    color: var(--text);
    min-height:100vh;
    overflow-x:hidden;
    font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }

  :focus-visible{ outline:none; }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  /* page */
  .page-wrap{
    width: min(1100px, 100%);
    margin: 0 auto;
    padding: 16px 12px 28px;
  }

  /* card */
  .enroll-card{
    width: min(740px, 100%);
    margin: 0 auto;
    padding: calc(var(--pad) + 6px);
    border-radius: var(--r28);
    background: linear-gradient(180deg, var(--glass), var(--glass2));
    border: 1px solid var(--stroke);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    position: relative;
    overflow:hidden;
    animation: fadeIn .35s ease;
  }

  .enroll-card::before{
    content:"";
    position:absolute;
    inset:-2px;
    background:
      radial-gradient(720px 280px at 20% 0%, rgba(56,189,248,.18), transparent 65%),
      radial-gradient(720px 280px at 70% 10%, rgba(251,191,36,.14), transparent 65%),
      radial-gradient(720px 280px at 55% 120%, rgba(34,197,94,.14), transparent 65%);
    filter: blur(18px);
    opacity:.95;
    pointer-events:none;
  }
  .enroll-card > *{ position:relative; z-index:2; }

  /* title */
  .enroll-title{
    text-align:center;
    margin: 0 0 14px;
    font-size: clamp(20px, 4.2vw, 32px);
    font-weight: 950;
    letter-spacing: .2px;
    line-height: 1.08;
    color: #fde68a;
    text-shadow: 0 10px 34px rgba(251,191,36,.12);
  }

  /* form spacing: keep form.as_p but make it premium */
  .styled-form p{
    margin: 0 0 12px;
  }

  /* labels */
  .styled-form label{
    display:flex;
    align-items:center;
    gap:10px;
    color: rgba(229,231,235,.95);
    font-weight: 900;
    letter-spacing: .10em;
    text-transform: uppercase;
    font-size: 12px;
    margin: 2px 2px 8px;
  }
  .styled-form label::before{
    content:"";
    width: 8px; height: 8px;
    border-radius: 999px;
    background: rgba(251,191,36,.92);
    box-shadow: 0 0 0 4px rgba(251,191,36,.14);
    flex: 0 0 auto;
  }

  /* inputs/select/textarea */
  .enroll-card input,
  .enroll-card select,
  .enroll-card textarea{
    width:100%;
    max-width:100%;
    border-radius: var(--r18);
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(2,6,23,.35) !important;
    padding: 13px 14px;
    color: #e5e7eb !important;
    outline:none;
    transition: .18s ease;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
    font-weight: 750;
    font-size: 14px;
    color-scheme: dark;
  }

  .enroll-card textarea{ min-height: 112px; resize: vertical; }

  .enroll-card input::placeholder,
  .enroll-card textarea::placeholder{
    color: rgba(148,163,184,.88) !important;
    font-weight: 750;
  }

  .enroll-card input:focus,
  .enroll-card select:focus,
  .enroll-card textarea:focus{
    border-color: rgba(56,189,248,.55) !important;
    box-shadow: var(--ringN), inset 0 0 0 1px rgba(255,255,255,.03) !important;
  }

  /* select arrow */
  .enroll-card select{
    appearance:none;
    -webkit-appearance:none;
    background-image:
      linear-gradient(45deg, transparent 50%, rgba(251,191,36,.9) 50%),
      linear-gradient(135deg, rgba(251,191,36,.9) 50%, transparent 50%),
      linear-gradient(to right, rgba(255,255,255,.10), rgba(255,255,255,.10));
    background-position:
      calc(100% - 18px) calc(50% - 3px),
      calc(100% - 12px) calc(50% - 3px),
      calc(100% - 42px) 50%;
    background-size: 6px 6px, 6px 6px, 1px 22px;
    background-repeat: no-repeat;
    padding-right: 48px;
  }

  /* Chrome autofill */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus,
  textarea:-webkit-autofill{
    -webkit-text-fill-color: #e5e7eb !important;
    -webkit-box-shadow: 0 0 0 1000px rgba(2,6,23,.35) inset !important;
    transition: background-color 9999s ease-in-out 0s !important;
    caret-color: rgba(251,191,36,.95) !important;
  }

  /* errors/helptext (Django) */
  .styled-form .errorlist{
    list-style:none;
    padding: 0;
    margin: 6px 2px 10px;
    color: #fdba74;
    font-weight: 850;
    font-size: 13px;
  }
  .styled-form .helptext,
  .styled-form small{
    display:block;
    margin-top: 6px;
    color: rgba(148,163,184,.92);
    font-weight: 700;
  }

  /* buttons */
  .btn-save{
    width:100%;
    min-height: 52px;
    border: none;
    border-radius: var(--r18);
    padding: 14px 16px;
    font-weight: 950;
    letter-spacing: .2px;
    color: #062314;
    background: linear-gradient(90deg, var(--green), var(--green2));
    box-shadow: 0 18px 44px rgba(34,197,94,.18);
    cursor:pointer;
    transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-top: 6px;
  }
  .btn-save:hover{ transform: translateY(-1px); filter: brightness(1.04); }
  .btn-save:active{ transform: translateY(0) scale(.99); }
  .btn-save:focus-visible{ box-shadow: var(--ringG), 0 18px 44px rgba(34,197,94,.18); }

  .btn-back{
    width:100%;
    min-height: 52px;
    margin-top: 12px;
    padding: 14px 16px;
    font-weight: 900;
    border-radius: var(--r18);
    background: rgba(148,163,184,.10);
    border: 1px solid rgba(255,255,255,.10);
    color: rgba(229,231,235,.95);
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    cursor:pointer;
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .btn-back:hover{ background: rgba(148,163,184,.16); transform: translateY(-1px); }
  .btn-back:active{ transform: translateY(0) scale(.99); }
  .btn-back:focus-visible{ box-shadow: var(--ringA); border-color: rgba(251,191,36,.35); }

  /* desktop/tablet layout */
  @media (min-width: 900px){
    .styled-form{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 16px;
    }
    .styled-form p{
      margin: 0;
    }
    .styled-form p:has(textarea),
    .styled-form p:has(select[multiple]),
    .styled-form p:last-child{
      grid-column: 1 / -1;
    }
    .btn-save,
    .btn-back{
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }
  }

  @media (max-width: 520px){
    .enroll-card{ padding: 20px 16px 18px; border-radius: 22px; }
  }

  @keyframes fadeIn{
    from {opacity:0; transform: translateY(12px);}
    to {opacity:1; transform: translateY(0);}
  }
</style>

<main class="page-wrap">
  <section class="enroll-card" aria-label="Talabani guruhga qo'shish">
    <h3 class="enroll-title">🧑‍🎓 Talabani guruhga qo'shish</h3>

    <form method="post">{% csrf_token %}
      <div class="styled-form">
        {{ form.as_p }}
      </div>

      <button class="btn-save">💾 Saqlash</button>
      <a class="btn-back d-block text-center mt-2" href="{% url 'education:guruhlar' %}">⬅️ Bekor qilish</a>
    </form>
  </section>
</main>

{% endblock %}
