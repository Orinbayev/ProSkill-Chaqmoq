{% extends "base.html" %}
{% block content %}
<style>
  .box{
    max-width: 820px;
    margin: 0 auto;
    padding: 16px;
    color:#e5e7eb;
  }
  .card{
    background: rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.10);
    border-radius:16px;
    padding:14px;
  }
  .row{ display:flex; gap:12px; flex-wrap:wrap; }
  .col{ flex:1; min-width: 240px; }
  label{ display:block; font-weight:900; margin:10px 0 6px; color:#9ca3af; }
  input, select{
    width:100%;
    height:44px;
    border-radius:10px;
    border:1px solid #1f2937;
    background:#111827;
    color:#e5e7eb;
    padding:0 12px;
    outline:none;
    font-weight:800;
  }
  input:focus, select:focus{ border-color:#38bdf8; box-shadow:0 0 0 3px rgba(56,189,248,0.18); }
  .btn{
    height:44px;
    border:0;
    border-radius:10px;
    padding:0 14px;
    font-weight:1000;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    white-space:nowrap;
  }
  .btn.green{ background:#10b981; color:#07110b; }
  .btn.gray{ background:rgba(255,255,255,0.06); color:#e5e7eb; border:1px solid #1f2937; }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
</style>

<div class="box">
  <div class="card">
    <h3 style="margin:0 0 10px; font-weight:1000;">✏️ O‘quvchini tahrirlash</h3>
    <div style="color:#9ca3af; font-weight:800; margin-bottom:10px;">
      {{ enr.student.ism }} {{ enr.student.familya }} • Guruh: {{ enr.group.nom }}
    </div>

    <form method="post">
      {% csrf_token %}

<input type="hidden" name="next" value="{{ next }}">
<input type="hidden" name="month" value="{{ month }}">

      <div class="row">
        <div class="col">
          <label>Ism</label>
          <input name="ism" value="{{ enr.student.ism }}">
        </div>
        <div class="col">
          <label>Familya</label>
          <input name="familya" value="{{ enr.student.familya }}">
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label>Email</label>
          <input name="email" value="{{ enr.student.email }}">
        </div>
        <div class="col">
          <label>Guruh</label>
          <select name="group_id">
            {% for g in groups %}
              <option value="{{ g.id }}" {% if g.id == enr.group.id %}selected{% endif %}>{{ g.nom }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label>Kurs narxi (so‘m)</label>
          <input name="kurs_narhi" type="number" min="0" value="{{ enr.kurs_narhi|default_if_none:'' }}">
        </div>
        <div class="col">
          <label>O‘qituvchi foizi (%)</label>
          <input name="oqituvchi_foiz" type="number" min="0" max="100" value="{{ enr.oqituvchi_foiz|default_if_none:'' }}">
        </div>
      </div>

      <div class="actions">
        <button class="btn green" type="submit">✅ Saqlash</button>
        <a class="btn gray" href="{{ next }}">↩️ Orqaga</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
