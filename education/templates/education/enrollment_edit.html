{% extends "base.html" %}
{% block content %}

<style>
  :root{
    --bg0:#020617;
    --bg1:#070b16;
    --bg2:#0b1226;

    --glass: rgba(17,24,39,.62);
    --glass2: rgba(2,6,23,.55);
    --stroke: rgba(255,255,255,.10);

    --text:#e5e7eb;
    --muted:#94a3b8;

    --amber:#fbbf24;
    --amber2:#f59e0b;

    --neon:#38bdf8;
    --neon2:#0ea5e9;

    --green:#22c55e;
    --green2:#16a34a;

    --shadow: 0 26px 90px rgba(0,0,0,.55);

    --r14:14px;
    --r18:18px;
    --r22:22px;
    --r28:28px;

    --pad: clamp(14px, 2.7vw, 22px);
    --gap: clamp(10px, 2.2vw, 14px);

    --ringA: 0 0 0 3px rgba(251,191,36,.18);
    --ringN: 0 0 0 3px rgba(56,189,248,.18);
    --ringG: 0 0 0 3px rgba(34,197,94,.18);
  }

  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    background:
      radial-gradient(980px 640px at 12% -10%, rgba(56,189,248,.16), transparent 55%),
      radial-gradient(980px 640px at 88% 0%, rgba(251,191,36,.14), transparent 55%),
      radial-gradient(980px 680px at 55% 120%, rgba(34,197,94,.12), transparent 60%),
      linear-gradient(180deg, var(--bg0), var(--bg2));
    color: var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }

  :focus-visible{ outline:none; }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  /* page */
  .box{
    width: min(1100px, 100%);
    margin: 0 auto;
    padding: 16px 12px 28px;
    color:#e5e7eb;
  }

  /* glass card */
  .card{
    width: min(820px, 100%);
    margin: 0 auto;
    background: linear-gradient(180deg, var(--glass), var(--glass2));
    border: 1px solid var(--stroke);
    border-radius: var(--r28);
    padding: calc(var(--pad) + 6px);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    position: relative;
    overflow:hidden;
    animation: fadeIn .35s ease;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:-2px;
    background:
      radial-gradient(720px 280px at 20% 0%, rgba(56,189,248,.18), transparent 65%),
      radial-gradient(720px 280px at 70% 10%, rgba(251,191,36,.14), transparent 65%),
      radial-gradient(720px 280px at 55% 120%, rgba(34,197,94,.14), transparent 65%);
    filter: blur(18px);
    opacity:.95;
    pointer-events:none;
  }
  .card > *{ position:relative; z-index:2; }

  /* header */
  .head{
    display:flex;
    align-items:flex-start;
    gap: 14px;
    margin-bottom: 14px;
    flex-wrap:wrap;
  }
  .head-icon{
    width:56px;
    height:56px;
    border-radius: 18px;
    display:grid;
    place-items:center;
    background: rgba(251,191,36,.10);
    border: 1px solid rgba(251,191,36,.22);
    box-shadow: 0 16px 36px rgba(251,191,36,.10);
    flex: 0 0 auto;
  }
  .head-icon .pen{
    width:34px; height:34px;
    border-radius: 14px;
    display:grid;
    place-items:center;
    background: rgba(2,6,23,.45);
    border: 1px solid rgba(255,255,255,.08);
    color: #fde68a;
    font-weight: 950;
    font-size: 18px;
    line-height: 1;
  }

  h3{
    margin:0;
    font-weight: 1000;
    font-size: clamp(18px, 3.8vw, 28px);
    letter-spacing: .2px;
    line-height: 1.06;
    color:#fde68a;
    text-shadow: 0 10px 34px rgba(251,191,36,.12);
  }

  .meta{
    color: rgba(148,163,184,.95);
    font-weight: 900;
    margin-top: 8px;
    line-height: 1.5;
    font-size: 13px;
  }

  /* layout */
  .row{
    display:grid;
    grid-template-columns: 1fr;
    gap: var(--gap);
    margin-top: 12px;
  }
  .col{ min-width: 0; }

  @media (min-width: 820px){
    .row{
      grid-template-columns: 1fr 1fr;
      gap: 14px 16px;
    }
  }

  /* labels */
  label{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight: 900;
    letter-spacing: .10em;
    text-transform: uppercase;
    font-size: 12px;
    margin: 10px 2px 8px;
    color: rgba(229,231,235,.92);
  }
  label::before{
    content:"";
    width: 8px; height: 8px;
    border-radius: 999px;
    background: rgba(56,189,248,.92);
    box-shadow: 0 0 0 4px rgba(56,189,248,.14);
    flex: 0 0 auto;
  }

  /* inputs */
  input, select{
    width:100%;
    height: 48px;
    border-radius: var(--r18);
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(2,6,23,.35) !important;
    color: #e5e7eb !important;
    padding: 0 14px;
    outline:none;
    font-weight: 850;
    transition: .18s ease;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
    color-scheme: dark;
  }

  input::placeholder{ color: rgba(148,163,184,.88); font-weight: 750; }

  input:focus, select:focus{
    border-color: rgba(56,189,248,.55) !important;
    box-shadow: var(--ringN), inset 0 0 0 1px rgba(255,255,255,.03) !important;
  }

  /* select arrow */
  select{
    appearance:none;
    -webkit-appearance:none;
    background-image:
      linear-gradient(45deg, transparent 50%, rgba(251,191,36,.9) 50%),
      linear-gradient(135deg, rgba(251,191,36,.9) 50%, transparent 50%),
      linear-gradient(to right, rgba(255,255,255,.10), rgba(255,255,255,.10));
    background-position:
      calc(100% - 18px) calc(50% - 3px),
      calc(100% - 12px) calc(50% - 3px),
      calc(100% - 42px) 50%;
    background-size: 6px 6px, 6px 6px, 1px 22px;
    background-repeat: no-repeat;
    padding-right: 48px;
  }

  /* buttons */
  .btn{
    min-height: 52px;
    border:0;
    border-radius: var(--r18);
    padding: 0 16px;
    font-weight: 1000;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    white-space:nowrap;
    transition: transform .18s ease, filter .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
    width: 100%;
    user-select:none;
  }

  .btn.green{
    background: linear-gradient(90deg, var(--green), var(--green2));
    color: #062314;
    box-shadow: 0 18px 44px rgba(34,197,94,.18);
  }
  .btn.green:hover{ transform: translateY(-1px); filter: brightness(1.04); }
  .btn.green:active{ transform: translateY(0) scale(.99); }
  .btn.green:focus-visible{ box-shadow: var(--ringG), 0 18px 44px rgba(34,197,94,.18); }

  .btn.gray{
    background: rgba(148,163,184,.10);
    color: rgba(229,231,235,.95);
    border: 1px solid rgba(255,255,255,.10);
  }
  .btn.gray:hover{ background: rgba(148,163,184,.16); transform: translateY(-1px); }
  .btn.gray:active{ transform: translateY(0) scale(.99); }
  .btn.gray:focus-visible{ box-shadow: var(--ringA); border-color: rgba(251,191,36,.35); }

  .actions{
    display:grid;
    gap: 12px;
    margin-top: 16px;
  }

  @media (min-width: 720px){
    .actions{
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items:stretch;
    }
  }

  @media (max-width: 520px){
    .card{ padding: 20px 16px 18px; border-radius: 22px; }
    .head-icon{ width:52px; height:52px; border-radius: 16px; }
    input, select{ height: 50px; border-radius: 16px; }
    .btn{ border-radius: 16px; }
  }

  @keyframes fadeIn{
    from {opacity:0; transform: translateY(12px);}
    to {opacity:1; transform: translateY(0);}
  }
</style>

<div class="box">
  <div class="card">
    <div class="head">
      <div class="head-icon" aria-hidden="true"><div class="pen">✏️</div></div>
      <div style="min-width:0;">
        <h3 style="margin:0 0 10px; font-weight:1000;">✏️ O‘quvchini tahrirlash</h3>
        <div class="meta">
          {{ enr.student.ism }} {{ enr.student.familya }} • Guruh: {{ enr.group.nom }}
        </div>
      </div>
    </div>

    <form method="post">
      {% csrf_token %}

      <input type="hidden" name="next" value="{{ next }}">
      <input type="hidden" name="month" value="{{ month }}">

      <div class="row">
        <div class="col">
          <label>Ism</label>
          <input name="ism" value="{{ enr.student.ism }}">
        </div>
        <div class="col">
          <label>Familya</label>
          <input name="familya" value="{{ enr.student.familya }}">
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label>Email</label>
          <input name="email" value="{{ enr.student.email }}">
        </div>
        <div class="col">
          <label>Guruh</label>
          <select name="group_id">
            {% for g in groups %}
              <option value="{{ g.id }}" {% if g.id == enr.group.id %}selected{% endif %}>{{ g.nom }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label>Kurs narxi (so‘m)</label>
          <input name="kurs_narhi" type="number" min="0" value="{{ enr.kurs_narhi|default_if_none:'' }}">
        </div>
        <div class="col">
          <label>O‘qituvchi foizi (%)</label>
          <input name="oqituvchi_foiz" type="number" min="0" max="100" value="{{ enr.oqituvchi_foiz|default_if_none:'' }}">
        </div>
      </div>

      <div class="actions">
        <button class="btn green" type="submit">✅ Saqlash</button>
        <a class="btn gray" href="{{ next }}">↩️ Orqaga</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
