{% extends "base.html" %}
{% block content %}

<style>
  :root{
    --bg:#070b14;
    --bg2:#0b1220;

    --text:#e5e7eb;
    --muted:#9aa4b2;

    --line: rgba(255,255,255,.08);

    --gold:#facc15;
    --goldSoft: rgba(250,204,21,.14);

    --blueGlow: rgba(59,130,246,.20);
    --greenGlow: rgba(34,197,94,.20);
  }

  body{
    background:
      radial-gradient(900px 420px at 50% -120px, rgba(250,204,21,.12), transparent 60%),
      radial-gradient(800px 500px at 25% 40%, rgba(56,189,248,.10), transparent 70%),
      radial-gradient(800px 500px at 75% 55%, rgba(34,197,94,.10), transparent 70%),
      linear-gradient(180deg, var(--bg), var(--bg2), var(--bg));
    min-height: 100vh;
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Poppins", sans-serif;
  }

  /* =======================
     PAGE LAYOUT (compact)
     ======================= */
  .pay-page{
    width: 100%;
    padding: 54px 18px 60px;
  }

  /* container should NOT be too wide (to look like your screenshot) */
  .pay-container{
    max-width: 980px;     /* <<< MUHIM: bu kattaroq bo‘lsa cho‘zilib ketadi */
    margin: 0 auto;
  }

  /* =======================
     PILL TITLE
     ======================= */
  .pay-pill{
    width: fit-content;
    margin: 0 auto 26px;
    display: inline-flex;
    align-items: center;
    gap: 10px;

    padding: 10px 18px;
    border-radius: 999px;

    color: var(--gold);
    font-weight: 900;
    font-size: 20px;
    letter-spacing: .4px;
    text-transform: uppercase;

    background: rgba(0,0,0,.26);
    border: 1px solid rgba(250,204,21,.22);
    box-shadow: 0 16px 40px rgba(0,0,0,.45);
    backdrop-filter: blur(10px);
  }

  .pay-pill .pill-ico{
    width: 30px;
    height: 30px;
    border-radius: 999px;
    display: grid;
    place-items: center;
    background: var(--goldSoft);
    border: 1px solid rgba(250,204,21,.22);
    box-shadow: 0 10px 24px rgba(250,204,21,.10);
    font-size: 14px;
  }

  /* =======================
     GRID
     ======================= */
  .pay-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 26px;
    align-items: stretch;
    justify-content: center;
  }

  /* =======================
     CARD (look like screenshot)
     ======================= */
  .pay-card{
    position: relative;
    border-radius: 26px;
    overflow: hidden;

    border: 1px solid var(--line);
    box-shadow:
      0 22px 70px rgba(0,0,0,.58),
      inset 0 1px 0 rgba(255,255,255,.06);

    background: rgba(255,255,255,.03);
    backdrop-filter: blur(12px);

    /* <<< MUHIM: karta o‘lchami compact bo‘lsin */
    min-height: 280px;
  }

  /* inner */
  .pay-card .inner{
    height: 100%;
    padding: 28px 26px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
  }

  /* glow gradient layer */
  .pay-card::before{
    content:"";
    position:absolute;
    inset:-2px;
    pointer-events:none;
    opacity:.95;
  }

  .pay-card.teacher::before{
    background:
      radial-gradient(560px 320px at 35% 25%, var(--blueGlow), transparent 62%),
      radial-gradient(560px 320px at 80% 85%, rgba(37,99,235,.14), transparent 62%);
  }

  .pay-card.student::before{
    background:
      radial-gradient(560px 320px at 35% 25%, var(--greenGlow), transparent 62%),
      radial-gradient(560px 320px at 80% 85%, rgba(20,184,166,.12), transparent 62%);
  }

  /* subtle vignette like screenshot */
  .pay-card::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
      radial-gradient(800px 400px at 50% 10%, rgba(255,255,255,.05), transparent 55%),
      linear-gradient(180deg, rgba(0,0,0,.00), rgba(0,0,0,.35));
    opacity:.85;
  }

  /* icon tile */
  .pay-icon{
    width: 62px;
    height: 62px;
    border-radius: 16px;
    display: grid;
    place-items: center;
    font-size: 26px;

    background: rgba(0,0,0,.20);
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 18px 45px rgba(0,0,0,.55);
    backdrop-filter: blur(10px);
    position: relative;
    z-index: 2;
  }

  /* title/sub */
  .pay-title{
    margin: 6px 0 0;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: .2px;
    position: relative;
    z-index: 2;
  }

  .pay-sub{
    margin: 0;
    max-width: 360px;
    color: var(--muted);
    font-weight: 600;
    font-size: 13px;
    line-height: 1.45;
    position: relative;
    z-index: 2;
  }

  /* button like screenshot */
  .pay-btn{
    margin-top: 12px;
    display: inline-flex;
    align-items: center;
    gap: 10px;

    padding: 10px 16px;
    border-radius: 999px;
    text-decoration: none;
    color: var(--text);

    font-weight: 800;
    font-size: 13px;

    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 16px 40px rgba(0,0,0,.45);
    position: relative;
    z-index: 2;

    transition: .18s ease;
  }

  .pay-btn .arr{
    width: 28px;
    height: 28px;
    border-radius: 999px;
    display: grid;
    place-items: center;

    background: rgba(0,0,0,.25);
    border: 1px solid rgba(255,255,255,.10);
    transition: .18s ease;
  }

  .pay-card:hover{
    border-color: rgba(250,204,21,.18);
  }
  .pay-card:hover .pay-btn{
    border-color: rgba(250,204,21,.18);
    background: rgba(250,204,21,.10);
  }
  .pay-card:hover .pay-btn .arr{
    transform: translateX(2px);
    border-color: rgba(250,204,21,.18);
  }

  /* =======================
     RESPONSIVE
     ======================= */
  @media (max-width: 980px){
    .pay-container{ max-width: 820px; }
    .pay-title{ font-size: 26px; }
  }

  @media (max-width: 860px){
    .pay-grid{ grid-template-columns: 1fr; }
    .pay-card{ min-height: 260px; }
  }

  @media (max-width: 520px){
    .pay-page{ padding: 46px 12px 54px; }
    .pay-card .inner{ padding: 24px 18px; }
    .pay-title{ font-size: 24px; }
    .pay-sub{ font-size: 12.5px; }
  }
</style>

<div class="pay-page">
  <div class="pay-container">

   <center> <div class="pay-pill">
      <!-- <div class="pill-ico"></div> -->
      <div>💰 TO‘LOV TOIFASINI TANLANG</div>
    </div></center>

    <div class="pay-grid">

      <div class="pay-card teacher">
        <div class="inner">
          <div class="pay-icon">🧑‍🏫</div>
          <h3 class="pay-title">O‘qituvchilar</h3>
          <p class="pay-sub">Oylik maoshlar va qo‘shimcha bonuslarni hisoblash bo‘limi</p>

          <a class="pay-btn" href="{% url 'education:teacher_salary_list' %}">
            Davom etish <span class="arr">→</span>
          </a>
        </div>
      </div>

      <div class="pay-card student">
        <div class="inner">
          <div class="pay-icon">🎓</div>
          <h3 class="pay-title">O‘quvchilar</h3>
          <p class="pay-sub">Kurslar uchun to‘lovlar va chegirmalarni boshqarish bo‘limi</p>

          <a class="pay-btn" href="{% url 'education:tolov_oquvchilar' %}">
            Davom etish <span class="arr">→</span>
          </a>
        </div>
      </div>

    </div>
  </div>
</div>

{% endblock %}
