{% extends "base.html" %}
{% block content %}

<style>
body {
  background: linear-gradient(180deg, #0f172a, #1e293b, #0f172a);
  min-height: 100vh;
  font-family: 'Poppins', sans-serif;
  color: #e2e8f0;
}

/* 📦 Sahifa markazi */
.page-container {
  text-align: center;
  padding-top: 130px;
}

/* 💰 Sarlavha */
.page-container h2 {
  color: #facc15;
  font-weight: 800;
  font-size: 2.2rem;
  margin-bottom: 60px;
  text-shadow: 0 3px 8px rgba(250,204,21,0.4);
}

/* 🔘 Umumiy tugma dizayni */
.option-btn {
  display: inline-block;
  margin: 25px;
  padding: 28px 70px;
  border-radius: 18px;
  font-size: 1.4rem;
  font-weight: 700;
  color: #fff;
  text-decoration: none;
  transition: 0.35s;
  box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  border: none;
}

/* 🧑‍🏫 O‘qituvchi tugmasi */
.teacher-btn {
  background: linear-gradient(90deg, #3b82f6, #60a5fa);
  box-shadow: 0 4px 15px rgba(59,130,246,0.3);
}
.teacher-btn:hover {
  background: linear-gradient(90deg, #60a5fa, #3b82f6);
  transform: scale(1.06);
  box-shadow: 0 8px 25px rgba(59,130,246,0.4);
}

/* 👨‍🎓 O‘quvchi tugmasi */
.student-btn {
  background: linear-gradient(90deg, #22c55e, #16a34a);
  box-shadow: 0 4px 15px rgba(34,197,94,0.3);
}
.student-btn:hover {
  background: linear-gradient(90deg, #16a34a, #22c55e);
  transform: scale(1.06);
  box-shadow: 0 8px 25px rgba(34,197,94,0.4);
}

/* 💡 Glow animatsiya */
.option-btn:hover::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 18px;
  box-shadow: 0 0 25px rgba(255,255,255,0.15);
}

/* Responsiv holat */
@media (max-width: 768px) {
  .option-btn {
    display: block;
    width: 80%;
    margin: 20px auto;
    padding: 22px 0;
  }
}
</style>

<div class="page-container">
  <h2>💰 To‘lovlar bo‘limi</h2>

  <a href="{% url 'education:teacher_salary_list' %}" class="option-btn teacher-btn">
    🧑‍🏫 O‘qituvchilar
  </a>

  <a href="{% url 'education:tolov_oquvchilar' %}" class="option-btn student-btn">
    👨‍🎓 O‘quvchilar
  </a>
</div>

{% endblock %}
