{% extends "base.html" %}
{% block content %}

<style>
/* ===== GLOBAL BACKGROUND ===== */
body {
  background: linear-gradient(180deg, #0f172a, #1e293b, #0f172a);
  min-height: 100vh;
  font-family: 'Poppins', sans-serif;
  color: #e2e8f0;
}

/* ===== PAGE WRAPPER ===== */
.page-container {
  text-align: center;
  padding-top: 120px;
  padding-bottom: 80px;
}

/* ===== TITLE ===== */
.page-container h2 {
  color: #facc15;
  font-weight: 800;
  font-size: 2.3rem;
  margin-bottom: 55px;
  text-shadow: 0 3px 10px rgba(250,204,21,0.35);
}

/* ===== BUTTON BASE ===== */
.option-btn {
  display: inline-block;
  margin: 22px;
  padding: 26px 70px;
  border-radius: 18px;
  font-size: 1.45rem;
  font-weight: 700;
  color: #fff;
  text-decoration: none;
  transition: 0.28s ease;
  position: relative;
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  border: none;
}

/* ===== TEACHER BUTTON ===== */
.teacher-btn {
  background: linear-gradient(90deg, #3b82f6, #60a5fa);
  box-shadow: 0 4px 15px rgba(59,130,246,0.35);
}
.teacher-btn:hover {
  transform: scale(1.06);
  background: linear-gradient(90deg, #60a5fa, #3b82f6);
  box-shadow: 0 8px 25px rgba(59,130,246,0.5);
}

/* ===== STUDENT BUTTON ===== */
.student-btn {
  background: linear-gradient(90deg, #22c55e, #16a34a);
  box-shadow: 0 4px 15px rgba(34,197,94,0.35);
}
.student-btn:hover {
  transform: scale(1.06);
  background: linear-gradient(90deg, #16a34a, #22c55e);
  box-shadow: 0 8px 25px rgba(34,197,94,0.5);
}

/* ===== GLOW EFFECT ===== */
.option-btn:hover::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 18px;
  box-shadow: 0 0 25px rgba(255,255,255,0.12);
}

/* ===== RESPONSIVE DESIGN ===== */
@media (max-width: 992px) {
  .page-container h2 {
    font-size: 1.9rem;
    margin-bottom: 40px;
  }
}

@media (max-width: 768px) {
  .option-btn {
    width: 85%;
    padding: 22px 0;
    margin: 14px auto;
    font-size: 1.25rem;
  }
}

@media (max-width: 480px) {
  .page-container h2 {
    font-size: 1.6rem;
  }
  .option-btn {
    width: 90%;
    font-size: 1.15rem;
    padding: 20px 0;
  }
}
</style>

<div class="page-container">
  <h2>💰 To‘lovlar bo‘limi</h2>

  <a href="{% url 'education:teacher_salary_list' %}" class="option-btn teacher-btn">
    🧑‍🏫 O‘qituvchilar
  </a>

  <a href="{% url 'education:tolov_oquvchilar' %}" class="option-btn student-btn">
    👨‍🎓 O‘quvchilar
  </a>
</div>

{% endblock %}
