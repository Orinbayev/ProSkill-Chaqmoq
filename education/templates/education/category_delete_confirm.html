{% extends 'base.html' %}
{% block content %}
<div class="container py-5 text-center">
  <div class="card shadow-sm mx-auto p-4" style="max-width: 550px;">
    <h3 class="text-danger mb-3">🗑️ Guruhni o‘chirish</h3>
    <p>«{{ g.nom }}» guruhini o‘chirmoqchisizmi?<br>
      <small class="text-muted">Davomat va chaqmoq yozuvlari saqlanadi, faqat guruhning o‘zi o‘chadi.</small>
    </p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger px-4">Ha, o‘chirish</button>
      <a href="{% url 'education:group_detail' g.id %}" class="btn btn-outline-secondary px-4">Bekor qilish</a>
    </form>
  </div>
</div>
{% endblock %}
