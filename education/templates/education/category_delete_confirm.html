{% extends 'base.html' %}
{% block content %}

<style>
  :root{
    --bg0:#020617;
    --bg1:#070b16;
    --bg2:#0b1226;

    --glass: rgba(17,24,39,.58);
    --glass2: rgba(2,6,23,.44);
    --stroke: rgba(255,255,255,.10);
    --stroke2: rgba(255,255,255,.14);

    --text:#e5e7eb;
    --muted:#94a3b8;

    --amber:#fbbf24;
    --amber2:#facc15;

    --blue:#38bdf8;
    --blue2:#0ea5e9;

    --danger:#ef4444;
    --danger2:#b91c1c;

    --shadow: 0 24px 80px rgba(0,0,0,.55);
    --shadow2: 0 18px 42px rgba(0,0,0,.42);

    --r12: 12px;
    --r16: 16px;
    --r20: 20px;
    --r24: 24px;

    --pad: clamp(14px, 2.8vw, 22px);
    --gap: clamp(10px, 2.2vw, 14px);

    --ring: 0 0 0 3px rgba(56,189,248,.22);
    --ringA: 0 0 0 3px rgba(251,191,36,.18);
    --ringD: 0 0 0 3px rgba(239,68,68,.18);
  }

  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    background:
      radial-gradient(950px 620px at 12% -10%, rgba(56,189,248,.18), transparent 55%),
      radial-gradient(900px 620px at 90% 5%, rgba(251,191,36,.12), transparent 55%),
      radial-gradient(900px 640px at 55% 120%, rgba(239,68,68,.10), transparent 60%),
      linear-gradient(180deg, var(--bg0), var(--bg2));
    color: var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }

  :focus-visible{ outline:none; }

  .page-wrap{
    width: min(1080px, 100%);
    margin: 0 auto;
    padding: 16px 12px 28px;
  }

  /* glass card */
  .glass-card{
    width: min(720px, 100%);
    margin: 0 auto;
    border-radius: var(--r24);
    background: linear-gradient(180deg, var(--glass), var(--glass2));
    border: 1px solid var(--stroke);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    position: relative;
    overflow:hidden;
    padding: calc(var(--pad) + 6px);
    text-align:center;
  }

  .glass-card::before{
    content:"";
    position:absolute;
    inset:-2px;
    background:
      radial-gradient(680px 280px at 30% 0%, rgba(56,189,248,.18), transparent 65%),
      radial-gradient(680px 280px at 78% 10%, rgba(251,191,36,.14), transparent 65%),
      radial-gradient(680px 280px at 55% 120%, rgba(239,68,68,.12), transparent 65%);
    filter: blur(18px);
    opacity:.95;
    pointer-events:none;
  }
  .glass-card > *{ position:relative; z-index:2; }

  .icon{
    width:62px;
    height:62px;
    border-radius: 22px;
    display:grid;
    place-items:center;
    margin: 0 auto 12px;
    background: rgba(239,68,68,.10);
    border: 1px solid rgba(239,68,68,.22);
    box-shadow: 0 18px 44px rgba(239,68,68,.10);
    font-size: 28px;
  }

  h3{
    margin: 0 0 10px;
    font-weight: 950;
    font-size: clamp(18px, 3.6vw, 22px);
    color: #fecaca;
    letter-spacing: .2px;
  }

  p{
    margin: 0;
    color: rgba(229,231,235,.95);
    font-weight: 750;
    line-height: 1.55;
  }

  small{
    display:block;
    margin-top: 8px;
    color: var(--muted);
    font-weight: 700;
    line-height: 1.45;
  }

  /* actions */
  .actions{
    margin-top: 16px;
    display:grid;
    gap: 12px;
  }

  .btn{
    width:100%;
    min-height: 52px;
    border-radius: var(--r16);
    padding: 0 16px;
    font-weight: 950;
    letter-spacing: .2px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    user-select:none;
    white-space:nowrap;
    text-decoration:none;
    transition: transform .18s ease, filter .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
  }

  .btn-delete{
    background: linear-gradient(90deg, var(--danger), var(--danger2));
    border: none;
    color: #fff;
    box-shadow: 0 18px 40px rgba(239,68,68,.16);
  }
  .btn-delete:hover{ transform: translateY(-1px); filter: brightness(1.02); }
  .btn-delete:active{ transform: translateY(0px) scale(.99); }
  .btn-delete:focus-visible{ box-shadow: var(--ringD), 0 18px 40px rgba(239,68,68,.16); }

  .btn-cancel{
    background: rgba(56,189,248,.10);
    border: 1px solid rgba(56,189,248,.28);
    color: #cffafe;
    box-shadow: 0 18px 40px rgba(56,189,248,.10);
  }
  .btn-cancel:hover{ transform: translateY(-1px); filter: brightness(1.05); background: rgba(56,189,248,.14); }
  .btn-cancel:active{ transform: translateY(0px) scale(.99); }
  .btn-cancel:focus-visible{ box-shadow: var(--ring), 0 18px 40px rgba(56,189,248,.10); }

  @media (min-width: 720px){
    .actions{
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items:stretch;
    }
  }

  @media (max-width: 520px){
    .glass-card{ padding: 20px 16px 18px; border-radius: 20px; }
    .icon{ width:56px; height:56px; border-radius: 18px; }
  }

  @media (min-width: 1440px){
    .page-wrap{ padding-top: 18px; }
  }
</style>

<main class="page-wrap">
  <section class="glass-card" aria-label="O'chirishni tasdiqlash">

    <div class="icon" aria-hidden="true">🗑️</div>

    <h3>🗑️ Guruhni o'chirish</h3>

    <p>
      «<b>{{ g.nom }}</b>» guruhini o'chirmoqchimisiz?<br>
      <small>Davomat va chaqmoq yozuvlari saqlanadi, faqat guruhning o'zi o'chadi.</small>
    </p>

    <form method="post" class="mt-3">
      {% csrf_token %}

      <div class="actions">
        <button type="submit" class="btn btn-delete">Ha, o'chirish</button>
        <a href="{% url 'education:group_detail' g.id %}" class="btn btn-cancel">Bekor qilish</a>
      </div>
    </form>

  </section>
</main>

{% endblock %}
