{% extends 'base.html' %}
{% block content %}

<style>
  :root {
    --glass: rgba(255,255,255,0.04);
    --border: rgba(148,163,184,0.25);
    --text: #e5e7eb;
    --muted: #9ca3af;
    --danger: #ef4444;
    --danger-dark: #b91c1c;
    --yellow: #facc15;
    --blue: #38bdf8;
  }

  .delete-box {
    max-width: 520px;
    margin: 60px auto;
    background: var(--glass);
    border-radius: 16px;
    padding: 35px 30px;
    border: 1px solid var(--border);
    color: var(--text);
    text-align: center;
    box-shadow: 0 0 25px rgba(56,189,248,0.15);
    backdrop-filter: blur(12px);
  }

  h3 {
    font-weight: 700;
    color: var(--danger);
    margin-bottom: 15px;
  }

  p {
    color: var(--text);
    font-size: 1rem;
  }

  small {
    color: var(--muted);
  }

  .btn-delete {
    background: linear-gradient(90deg, #ef4444, #b91c1c);
    border: none;
    color: #fff;
    padding: 10px 26px;
    border-radius: 10px;
    font-weight: 600;
    transition: 0.25s;
  }
  .btn-delete:hover {
    transform: scale(1.05);
    filter: brightness(.9);
  }

  .btn-cancel {
    border: 1px solid var(--blue);
    color: var(--blue);
    background: none;
    padding: 10px 26px;
    border-radius: 10px;
    font-weight: 600;
    transition: 0.25s;
    margin-left: 10px;
  }
  .btn-cancel:hover {
    background: var(--blue);
    color: #0f172a;
  }

  @media (max-width: 480px) {
    .btn-cancel,
    .btn-delete {
      width: 100%;
      margin: 6px 0;
    }
  }
</style>

<div class="delete-box">
  <h3>🗑️ Guruhni o‘chirish</h3>

  <p>
    «<b>{{ g.nom }}</b>» guruhini o‘chirmoqchimisiz?<br>
    <small>Davomat va chaqmoq yozuvlari saqlanadi, faqat guruhning o‘zi o‘chadi.</small>
  </p>

  <form method="post" class="mt-3">
    {% csrf_token %}
    <button type="submit" class="btn-delete">Ha, o‘chirish</button>
    <a href="{% url 'education:group_detail' g.id %}" class="btn-cancel">Bekor qilish</a>
  </form>
</div>

{% endblock %}
