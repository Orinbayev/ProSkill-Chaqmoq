{% extends 'base.html' %}
{% block content %}
<h3>{{ g.nom }} — Davomat / Chaqmoq</h3>

<form method="post" class="mb-3">
  {% csrf_token %}
  <div class="input-group" style="max-width:280px">
    <span class="input-group-text">Sana</span>
    <input type="date" name="date" class="form-control" value="{{ date }}">
  </div>

  <table class="table table-sm align-middle mt-3">
    <thead>
      <tr>
        <th>#</th>
        <th>Talaba</th>
        <th>Davomat</th>
        <th>Qoida</th>
        <th>Ball</th>
      </tr>
    </thead>
    <tbody>
      {% for s in students %}
      <tr>
        <td>{{ forloop.counter }}</td>
        <td>{{ s.ism }} {{ s.familya }}</td>
        <td class="text-center">
          <input type="checkbox" name="present_{{ s.id }}">
        </td>
        <td style="min-width:280px">
          <select class="form-select rule" name="rule_{{ s.id }}">
            <option value="">—</option>
            {% for r in rules %}
              <option value="{{ r.id }}" data-min="{{ r.min_baho }}" data-max="{{ r.max_baho }}" data-type="{{ r.tur }}">
                {{ r.nom }} {% if r.tur == 'plus' %}(+{{ r.min_baho }}..+{{ r.max_baho }}){% else %}(-{{ r.min_baho }}..-{{ r.max_baho }}){% endif %}
              </option>
            {% endfor %}
          </select>
        </td>
        <td style="width:120px">
          <input type="number" class="form-control ball" name="ball_{{ s.id }}" value="0" min="0" step="1">
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <div class="d-flex gap-2">
    <button class="btn btn-primary">Saqlash</button>
    <a class="btn btn-secondary" href="{% url 'education:guruhlar' %}">Orqaga</a>
  </div>
</form>

<script>
(function(){
  document.querySelectorAll('select.rule').forEach(function(sel){
    sel.addEventListener('change', function(){
      const row = sel.closest('tr');
      const input = row.querySelector('input.ball');
      const o = sel.options[sel.selectedIndex];
      if (!o || !o.dataset.min) { input.value = 0; input.min = 0; input.max=''; return; }
      input.min = parseInt(o.dataset.min,10);
      input.max = parseInt(o.dataset.max,10);
      if (+input.value < +input.min) input.value = input.min;
    });
  });
})();
</script>
{% endblock %}
