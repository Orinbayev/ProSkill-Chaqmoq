{% extends "base.html" %}
{% block body_class %}category-add-page{% endblock %}
{% block content %}

<style>
  :root {
    --bg-dark: #050814;
    --bg-card: rgba(17, 24, 39, 0.65);
    --bg-input: rgba(7, 11, 22, 0.45);

    --accent: #f59e0b;
    /* Amber 500 */
    --accent-glow: rgba(245, 158, 11, 0.25);

    --text: #f3f4f6;
    --text-muted: #94a3b8;

    --border: rgba(255, 255, 255, 0.08);
    --border-focus: rgba(245, 158, 11, 0.4);

    --radius-lg: 24px;
    --radius-md: 16px;

    --font-main: 'Outfit', 'Inter', system-ui, sans-serif;
  }

  /* --- Layout --- */
  .page-container {
    padding: 40px 20px;
    max-width: 900px;
    margin: 0 auto;
    font-family: var(--font-main);
    color: var(--text);
    min-height: calc(100vh - 80px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* --- Glass Card --- */
  .premium-card {
    position: relative;
    width: 100%;
    background: var(--bg-card);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 40px;
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }

  .premium-card::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at center, rgba(245, 158, 11, 0.05) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  .card-content {
    position: relative;
    z-index: 1;
  }

  /* --- Header --- */
  .form-header {
    margin-bottom: 35px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .icon-box {
    width: 60px;
    height: 60px;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.05));
    border: 1px solid rgba(245, 158, 11, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
  }

  .icon-box i {
    font-size: 24px;
    color: var(--accent);
    text-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
  }

  .header-text h1 {
    font-size: 32px;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.5px;
  }

  .header-text h1 span {
    color: var(--accent);
    text-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
  }

  .header-text p {
    color: var(--text-muted);
    margin: 5px 0 0;
    font-size: 14px;
    font-weight: 500;
  }

  /* --- Form Inputs --- */
  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 24px;
  }

  @media (max-width: 768px) {
    .field-row {
      grid-template-columns: 1fr;
    }
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .label {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 4px;
  }

  .label::before {
    content: "";
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--accent);
  }

  .form-control,
  textarea,
  input[type="text"],
  input[type="file"] {
    width: 100% !important;
    background: var(--bg-input) !important;
    border: 1px solid var(--border) !important;
    border-radius: var(--radius-md) !important;
    padding: 14px 18px !important;
    color: var(--text) !important;
    font-size: 15px !important;
    font-weight: 500 !important;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    outline: none !important;
  }

  textarea {
    min-height: 120px;
    resize: none;
  }

  .form-control:focus,
  textarea:focus,
  input[type="text"]:focus {
    border-color: var(--border-focus) !important;
    background: rgba(7, 11, 22, 0.6) !important;
    box-shadow: 0 0 0 4px var(--accent-glow) !important;
  }

  /* File Input Customization */
  input[type="file"] {
    padding: 10px 12px !important;
  }

  input[type="file"]::file-selector-button {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 8px 16px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    margin-right: 15px;
    transition: 0.2s;
  }

  input[type="file"]::file-selector-button:hover {
    filter: brightness(1.1);
    transform: scale(1.02);
  }

  /* --- Actions --- */
  .form-actions {
    margin-top: 35px;
    display: flex;
    gap: 16px;
  }

  @media (max-width: 480px) {
    .form-actions {
      flex-direction: column;
    }
  }

  .btn-submit {
    flex: 2;
    background: linear-gradient(135deg, var(--accent), #ffb800);
    color: #000;
    border: none;
    border-radius: var(--radius-md);
    padding: 16px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: all 0.3s ease;
    box-shadow: 0 10px 30px rgba(245, 158, 11, 0.2);
  }

  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 40px rgba(245, 158, 11, 0.3);
    filter: brightness(1.05);
  }

  .btn-submit:active {
    transform: translateY(0);
  }

  .btn-cancel {
    flex: 1;
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .btn-cancel:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: var(--text-muted);
  }

  /* Image Preview */
  .image-preview-container {
    margin-top: 15px;
    display: none;
    padding: 15px;
    background: rgba(0, 0, 0, 0.3);
    border-radius: var(--radius-md);
    border: 1px dashed var(--border);
  }

  .image-preview-container img {
    max-width: 100%;
    max-height: 200px;
    border-radius: 12px;
    display: block;
    margin: 0 auto;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  .preview-label {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
    font-weight: 800;
    text-align: center;
  }

  /* Utilities */
  .full-width {
    grid-column: 1 / -1;
  }
</style>

<div class="page-container">
  <div class="premium-card">
    <div class="card-content">
      <header class="form-header">
        <div class="icon-box">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <div class="header-text">
          <h1>Yangi <span>bo'lim</span> qo'shish</h1>
          <p>O'quv markazi uchun yangi yo'nalish yoki bo'lim yarating</p>
        </div>
      </header>

      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="field-row">
          <div class="form-group">
            <label class="label">Bo'lim nomi</label>
            {{ form.name }}
          </div>

          <div class="form-group">
            <label class="label">Bo'lim rasmi (ixtiyoriy)</label>
            {{ form.image }}
            <div id="imagePreview" class="image-preview-container">
              <div class="preview-label">Tanlangan rasm</div>
              <img id="previewImg" src="#" alt="Preview">
            </div>
          </div>

          <div class="form-group full-width">
            <label class="label">Bo'lim haqida tavsif</label>
            {{ form.description }}
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-submit">
            <i class="fa-solid fa-floppy-disk"></i>
            Ma'lumotlarni saqlash
          </button>
          <a href="{% url 'education:groups_home' %}" class="btn-cancel">
            <i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i>
            Ortga qaytish
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const fileInput = document.querySelector('input[type="file"]');
    const previewContainer = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');

    if (fileInput) {
      fileInput.addEventListener('change', function () {
        const file = this.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            previewImg.src = e.target.result;
            previewContainer.style.display = 'block';
          }
          reader.readAsDataURL(file);
        } else {
          previewContainer.style.display = 'none';
        }
      });
    }
  });
</script>

{% endblock %}
