{% extends "base.html" %}
{% block content %}

<style>
  :root{
    --bg0:#020617;
    --bg1:#070b16;
    --bg2:#0b1226;

    --glass: rgba(17,24,39,.62);
    --glass2: rgba(2,6,23,.55);
    --stroke: rgba(255,255,255,.10);

    --text:#e5e7eb;
    --muted:#94a3b8;

    --amber:#fbbf24;
    --amber2:#f59e0b;

    --neon:#38bdf8;
    --neon2:#0ea5e9;

    --red:#ef4444;
    --red2:#b91c1c;

    --shadow: 0 26px 90px rgba(0,0,0,.55);

    --r14:14px;
    --r18:18px;
    --r22:22px;
    --r28:28px;

    --pad: clamp(14px, 2.7vw, 22px);
    --gap: clamp(10px, 2.2vw, 14px);

    --ringA: 0 0 0 3px rgba(251,191,36,.18);
    --ringN: 0 0 0 3px rgba(56,189,248,.18);
    --ringR: 0 0 0 3px rgba(239,68,68,.18);
  }

  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    background:
      radial-gradient(980px 640px at 12% -10%, rgba(56,189,248,.16), transparent 55%),
      radial-gradient(980px 640px at 88% 0%, rgba(251,191,36,.14), transparent 55%),
      radial-gradient(980px 680px at 55% 120%, rgba(239,68,68,.12), transparent 60%),
      linear-gradient(180deg, var(--bg0), var(--bg2));
    color: var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }

  :focus-visible{ outline:none; }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  /* page */
  .box{
    width: min(1100px, 100%);
    margin: 0 auto;
    padding: 16px 12px 28px;
    color:#e5e7eb;
  }

  /* glass card */
  .card{
    width: min(760px, 100%);
    margin: 0 auto;
    background: linear-gradient(180deg, var(--glass), var(--glass2));
    border: 1px solid var(--stroke);
    border-radius: var(--r28);
    padding: calc(var(--pad) + 6px);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    position: relative;
    overflow:hidden;
    animation: fadeIn .35s ease;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:-2px;
    background:
      radial-gradient(720px 280px at 20% 0%, rgba(56,189,248,.18), transparent 65%),
      radial-gradient(720px 280px at 70% 10%, rgba(251,191,36,.14), transparent 65%),
      radial-gradient(720px 280px at 55% 120%, rgba(239,68,68,.14), transparent 65%);
    filter: blur(18px);
    opacity:.95;
    pointer-events:none;
  }
  .card > *{ position:relative; z-index:2; }

  /* header */
  .head{
    display:flex;
    align-items:flex-start;
    gap: 14px;
    margin-bottom: 14px;
  }
  .head-icon{
    width:56px;
    height:56px;
    border-radius: 18px;
    display:grid;
    place-items:center;
    background: rgba(239,68,68,.10);
    border: 1px solid rgba(239,68,68,.22);
    box-shadow: 0 16px 36px rgba(239,68,68,.10);
    flex: 0 0 auto;
  }
  .head-icon .bin{
    width:34px; height:34px;
    border-radius: 14px;
    display:grid;
    place-items:center;
    background: rgba(2,6,23,.45);
    border: 1px solid rgba(255,255,255,.08);
    color: #fecaca;
    font-weight: 950;
    font-size: 18px;
    line-height: 1;
  }

  h3{
    margin:0 0 10px;
    font-weight: 1000;
    font-size: clamp(18px, 3.8vw, 26px);
    letter-spacing: .2px;
    line-height: 1.06;
    color:#fecaca;
    text-shadow: 0 10px 34px rgba(239,68,68,.10);
  }

  .msg{
    color: rgba(156,163,175,.98);
    font-weight: 900;
    line-height: 1.55;
    font-size: 14px;
  }

  .msg b{ color:#e5e7eb; }
  .msg .danger{ color: #fca5a5; font-weight: 950; }

  /* buttons */
  .btn{
    min-height: 52px;
    border:0;
    border-radius: var(--r18);
    padding: 0 16px;
    font-weight: 1000;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    white-space:nowrap;
    transition: transform .18s ease, filter .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
    width: 100%;
    user-select:none;
  }

  .btn.red{
    background: linear-gradient(90deg, var(--red), var(--red2));
    color:#fff;
    box-shadow: 0 18px 44px rgba(239,68,68,.18);
  }
  .btn.red:hover{ transform: translateY(-1px); filter: brightness(1.03); }
  .btn.red:active{ transform: translateY(0) scale(.99); }
  .btn.red:focus-visible{ box-shadow: var(--ringR), 0 18px 44px rgba(239,68,68,.18); }

  .btn.gray{
    background: rgba(148,163,184,.10);
    color: rgba(229,231,235,.95);
    border: 1px solid rgba(255,255,255,.10);
  }
  .btn.gray:hover{ background: rgba(148,163,184,.16); transform: translateY(-1px); }
  .btn.gray:active{ transform: translateY(0) scale(.99); }
  .btn.gray:focus-visible{ box-shadow: var(--ringA); border-color: rgba(251,191,36,.35); }

  .actions{
    display:grid;
    gap: 12px;
    margin-top: 14px;
  }

  @media (min-width: 720px){
    .actions{
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items:stretch;
    }
  }

  @media (max-width: 520px){
    .card{ padding: 20px 16px 18px; border-radius: 22px; }
    .head-icon{ width:52px; height:52px; border-radius: 16px; }
  }

  @keyframes fadeIn{
    from {opacity:0; transform: translateY(12px);}
    to {opacity:1; transform: translateY(0);}
  }
</style>

<div class="box">
  <div class="card">
    <div class="head">
      <div class="head-icon" aria-hidden="true"><div class="bin">🗑️</div></div>
      <div style="min-width:0;">
        <h3>🗑️ O'chirishni tasdiqlang</h3>
        <div class="msg">
          Siz rostdan ham <b style="color:#e5e7eb;">{{ enr.student.ism }} {{ enr.student.familya }}</b>
          o'quvchini <b style="color:#e5e7eb;">{{ enr.group.nom }}</b> guruhdan o'chirmoqchimisiz?
          <br>
          <span class="danger">Bu amal qaytarilmaydi.</span>
        </div>
      </div>
    </div>

    <form method="post" style="margin-top:12px;">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="actions">
        <button class="btn red" type="submit">🗑️ Ha, o'chir</button>
        <a class="btn gray" href="{{ next }}">↩️ Bekor qilish</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
