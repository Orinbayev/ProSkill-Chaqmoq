{% extends "base.html" %}
{% block content %}

<style>
body {
  background: linear-gradient(180deg, #0f172a, #1e293b, #0f172a);
  color: #e2e8f0;
  font-family: 'Poppins', sans-serif;
}

/* Header */
.groups-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 25px;
}

.groups-header h3 {
  font-weight: 800;
  color: #facc15;
  text-shadow: 0 2px 6px rgba(250, 204, 21, .5);
}

/* Search */
.group-search {
  max-width: 300px;
}
.group-search input {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: #e2e8f0;
  padding: 8px 14px;
  border-radius: 10px;
  width: 100%;
  transition: .25s ease;
}
.group-search input:focus {
  border-color: #3b82f6;
  box-shadow: 0 0 10px rgba(59,130,246,0.35);
  outline: none;
}

/* Grid */
.groups-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px,1fr));
  gap: 20px;
  margin-top: 10px;
}

/* Card */
.group-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(59,130,246,0.25);
  border-radius: 16px;
  padding: 20px;
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: 0.35s ease;
  position: relative;
  overflow: hidden;
}

/* Neon edge glow on hover */
.group-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 10px 30px rgba(59,130,246,0.35);
  border-color: #3b82f6;
}

/* Small light glow inside */
.group-card::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at center, rgba(59,130,246,0.25), transparent);
  opacity: 0;
  transition: .4s;
}
.group-card:hover::before {
  opacity: 1;
}

/* Title */
.group-title {
  font-size: 20px;
  font-weight: 700;
  color: #60a5fa;
  margin-bottom: 10px;
  text-shadow: 0 2px 6px rgba(96,165,250,0.3);
}

/* Info text */
.group-info {
  font-size: 14px;
  color: #cbd5e1;
  margin-bottom: 6px;
}
.group-info span {
  color: #94a3b8;
}

/* Empty */
.empty-text {
  color: #94a3b8;
  font-size: 1.1rem;
  margin-top: 20px;
}

/* Mobile adjustments */
@media (max-width: 576px) {
  .groups-header {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }
}
</style>

<div class="groups-header">
  <h3>📘 Mening guruhlarim</h3>

  <form method="get" class="group-search">
    <input type="text" name="q" value="{{ request.GET.q }}" placeholder="🔍 Guruh izlash...">
  </form>
</div>

<div class="groups-grid">

  {% for g in rows %}
  <div class="group-card" onclick="location.href='{% url 'education:group_detail' g.id %}'">

    <div class="group-title">{{ g.nom }}</div>

    <div class="group-info"><span>🏫 Center:</span> {{ g.center }}</div>
    <div class="group-info"><span>👨‍🏫 O‘qituvchi:</span> {{ g.oqituvchi|default:"—" }}</div>
    <div class="group-info"><span>👥 Talabalar:</span> {{ g.student_count }}</div>

  </div>
  {% empty %}
    <p class="empty-text">Hozircha guruhlar yo‘q.</p>
  {% endfor %}

</div>

{% endblock %}
