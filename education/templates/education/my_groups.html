{% extends "base.html" %}
{% block content %}
<h3>Mening guruhlarim</h3>

<div class="table-responsive">
  <table class="table table-hover align-middle">
    <thead>
      <tr>
        <th>Guruh</th>
        <th>Center</th>
        <th>O‘qituvchi</th>
        <th>Talabalar</th>
      </tr>
    </thead>
    <tbody>
      {% for g in rows %}
        <tr class="row-link" data-href="{% url 'education:group_detail' g.id %}">
          <td><a href="{% url 'education:group_detail' g.id %}">{{ g.nom }}</a></td>
          <td>{{ g.center }}</td>
          <td>{{ g.oqituvchi }}</td>
          <td>{{ g.student_count }}</td>
        </tr>
      {% empty %}
        <tr><td colspan="4" class="text-muted">Hali guruhlari yo‘q.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script>
document.querySelectorAll('.row-link').forEach(tr=>{
  tr.style.cursor = 'pointer';
  tr.addEventListener('click', e=>{
    if (e.target.closest('a')) return;
    location.href = tr.dataset.href;
  });
});
</script>
{% endblock %}
