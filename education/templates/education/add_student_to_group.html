{% extends 'base.html' %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

<style>
  :root{
    /* ===== 1-rasmga yaqin palette ===== */
    --bg1:#020617;         /* deep navy */
    --bg2:#0b1226;         /* gradient second */
    --panel: rgba(17,24,39,.60);
    --panel2: rgba(2,6,23,.55);
    --line: rgba(255,255,255,.09);

    --text:#e5e7eb;
    --muted:#94a3b8;

    --blue:#38bdf8;
    --green:#22c55e;
    --green2:#16a34a;
    --slate:#334155;

    --shadow: 0 20px 70px rgba(0,0,0,.45);
    --radius: 26px;
  }

  body{
    background:
      radial-gradient(900px 600px at 10% 0%, rgba(56,189,248,.16), transparent 55%),
      radial-gradient(900px 600px at 90% 10%, rgba(34,197,94,.14), transparent 55%),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    color: var(--text);
  }

  /* ===== outer card ===== */
  .add-wrap{
    max-width: 860px;
    margin: 26px auto;
    padding: 0 12px 24px;
  }

  .add-card{
    background: linear-gradient(180deg, var(--panel), var(--panel2));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 34px 34px 28px;
    position: relative;
    overflow: hidden;
  }

  /* subtle border glow */
  .add-card::before{
    content:"";
    position:absolute;
    inset:-2px;
    background:
      radial-gradient(650px 250px at 30% 0%, rgba(56,189,248,.20), transparent 65%),
      radial-gradient(650px 250px at 75% 10%, rgba(34,197,94,.18), transparent 65%);
    pointer-events:none;
    opacity:.9;
    filter: blur(18px);
  }
  .add-card > *{ position: relative; z-index: 2; }

  /* ===== header ===== */
  .header{
    display:flex;
    align-items:flex-start;
    gap:16px;
    margin-bottom: 18px;
  }

  .header-icon{
    width:54px;
    height:54px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(56,189,248,.12);
    border:1px solid rgba(56,189,248,.22);
    box-shadow: 0 10px 26px rgba(56,189,248,.10);
    flex: 0 0 auto;
  }

  .header-icon svg{ width:28px; height:28px; opacity:.95; }

  .title{
    margin:0;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: .2px;
    line-height: 1.05;
  }
  .title .accent{ color: var(--blue); }

  .subtitle{
    margin:10px 0 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.45;
  }

  /* ===== section label row ===== */
  .section-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top: 18px;
    margin-bottom: 10px;
  }

  .section-label{
    display:flex;
    align-items:center;
    gap:10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .12em;
    font-weight: 800;
    font-size: 12px;
  }

  .count-badge{
    font-size: 12px;
    font-weight: 800;
    color: rgba(229,231,235,.95);
    background: rgba(56,189,248,.12);
    border: 1px solid rgba(56,189,248,.22);
    padding: 4px 10px;
    border-radius: 999px;
  }

  /* ===== input panel ===== */
  .input-panel{
    border-radius: 18px;
    border: 1px solid var(--line);
    background: rgba(15,23,42,.35);
    padding: 14px;
  }

  .hint{
    margin: 10px 2px 0;
    color: var(--muted);
    font-size: 13px;
    display:flex;
    gap:8px;
    align-items:center;
  }
  .hint .dot{
    width:6px; height:6px; border-radius:999px;
    background: rgba(56,189,248,.75);
    box-shadow: 0 0 0 4px rgba(56,189,248,.12);
    display:inline-block;
  }

  /* ===== TomSelect: 1-rasmga yaqin ===== */
  .ts-wrapper{ width:100%; }

  .ts-control{
    background: rgba(2,6,23,.35) !important;
    border: 1px solid rgba(255,255,255,.10) !important;
    border-radius: 16px !important;
    color: var(--text) !important;
    padding: 12px 12px !important;
    min-height: 56px !important;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
  }

  .ts-control input{
    color: #fff !important;
    font-size: 15px !important;
  }
  .ts-control input::placeholder{
    color: rgba(148,163,184,.9) !important;
    opacity: .9 !important;
  }

  /* selected chips */
  .ts-wrapper.multi .ts-control > div{
    background: rgba(56,189,248,.16) !important;
    border: 1px solid rgba(56,189,248,.30) !important;
    color: #eaf6ff !important;
    border-radius: 14px !important;
    padding: 8px 10px !important;
    margin: 4px 6px 4px 0 !important;
    font-weight: 800 !important;
    box-shadow: 0 10px 24px rgba(56,189,248,.10);
  }

  /* remove x */
  .ts-wrapper.multi .ts-control > div .remove{
    border-left: 0 !important;
    margin-left: 8px !important;
    color: rgba(229,231,235,.85) !important;
    font-weight: 900 !important;
    padding-left: 10px !important;
  }

  .ts-dropdown{
    background: rgba(2,6,23,.96) !important;
    border: 1px solid rgba(255,255,255,.10) !important;
    border-radius: 16px !important;
    overflow: hidden;
  }
  .ts-dropdown .option{
    color: #e5e7eb !important;
    padding: 12px 12px !important;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .ts-dropdown .option:last-child{ border-bottom: none; }
  .ts-dropdown .option.active,
  .ts-dropdown .option:hover{
    background: rgba(56,189,248,.10) !important;
  }

  /* ===== buttons row ===== */
  .btn-row{
    display:flex;
    gap:14px;
    margin-top: 22px;
    justify-content: space-between;
    flex-wrap: wrap;
  }

  .btn-main{
    flex: 1 1 380px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding: 14px 18px;
    border-radius: 16px;
    font-weight: 900;
    border: 1px solid rgba(255,255,255,.10);
    transition: .18s ease;
    text-decoration:none;
    user-select:none;
  }

  .btn-success{
    background: linear-gradient(90deg, var(--green), var(--green2));
    color: #062314;
    box-shadow: 0 18px 40px rgba(34,197,94,.18);
    border: none;
  }
  .btn-success:hover{
    transform: translateY(-1px);
    filter: brightness(1.04);
  }

  .btn-cancel{
    flex: 0 1 220px;
    background: rgba(148,163,184,.10);
    color: rgba(229,231,235,.95);
    border: 1px solid rgba(255,255,255,.10);
  }
  .btn-cancel:hover{
    background: rgba(148,163,184,.16);
    transform: translateY(-1px);
  }

  /* responsive */
  @media (max-width: 520px){
    .add-card{ padding: 22px 18px 18px; }
    .title{ font-size: 28px; }
    .btn-cancel{ flex: 1 1 220px; }
  }
</style>

<div class="add-wrap">
  <div class="add-card">

    <div class="header">
      <div class="header-icon" aria-hidden="true">
        <!-- user-plus icon -->
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M15 8a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z" stroke="rgba(56,189,248,.95)" stroke-width="2"/>
          <path d="M3 20c0-3.2 3.6-5 8-5" stroke="rgba(56,189,248,.95)" stroke-width="2" stroke-linecap="round"/>
          <path d="M18 8v6" stroke="rgba(56,189,248,.95)" stroke-width="2" stroke-linecap="round"/>
          <path d="M15 11h6" stroke="rgba(56,189,248,.95)" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>

      <div>
        <h1 class="title">Guruhga o‘quvchi <span class="accent">qo‘shish</span></h1>
        <p class="subtitle">
          Guruh tarkibini shakllantirish uchun o‘quvchilarni qidirib toping.
        </p>
      </div>
    </div>

    <form method="post">
      {% csrf_token %}

      <div class="section-row">
        <div class="section-label">
          <span style="display:inline-flex;align-items:center;gap:8px;">
            <span style="color:rgba(56,189,248,.95)">✦</span>
            TANLANGAN O‘QUVCHILAR
          </span>
        </div>
        <span class="count-badge" id="selectedCount">0 ta</span>
      </div>

      <div class="input-panel">
        <select id="students-select" name="student_ids" multiple required>
          {% for s in students %}
            <option value="{{ s.id }}">{{ s.ism }} {{ s.familya }} — {{ s.telefon1 }}</option>
          {% endfor %}
        </select>

        <div class="hint">
          <span class="dot"></span>
          <span>Tizimdan mavjud o‘quvchini tanlash uchun ism kiriting</span>
        </div>
      </div>

      <div class="btn-row">
        <button type="submit" class="btn-main btn-success">
          <span style="font-size:18px;line-height:0;">＋</span>
          O‘quvchini biriktirish
        </button>

        <a href="{% url 'education:group_detail' g.id %}" class="btn-main btn-cancel">
          ← Bekor qilish
        </a>
      </div>

    </form>

  </div>
</div>

<script>
  const ts = new TomSelect("#students-select", {
    plugins: ['remove_button'],
    persist: false,
    maxItems: null,
    sortField: { field: "text", direction: "asc" },
    placeholder: "Yana qo‘shish...",
  });

  const countEl = document.getElementById("selectedCount");
  function updateCount(){
    const n = ts.items.length;
    countEl.textContent = `${n} ta`;
  }
  ts.on("change", updateCount);
  updateCount();
</script>

{% endblock %}
