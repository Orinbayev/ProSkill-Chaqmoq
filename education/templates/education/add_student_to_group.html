{% extends 'base.html' %}
{% block content %}

<style>
  :root{
    --bg0:#020617;
    --bg1:#0b1226;

    --panel: rgba(17,24,39,.62);
    --panel2: rgba(2,6,23,.55);
    --glass: rgba(255,255,255,.05);
    --border: rgba(255,255,255,.10);
    --line: rgba(255,255,255,.08);

    --text:#e5e7eb;
    --muted:#94a3b8;

    --amber:#f59e0b;
    --amber2:#fbbf24;
    --blue:#38bdf8;
    --green:#22c55e;
    --green2:#16a34a;

    --shadow: 0 20px 70px rgba(0,0,0,.50);
    --radius: 22px;
  }

  /* Page background (premium dark) */
  body{
    background:
      radial-gradient(900px 600px at 10% 0%, rgba(56,189,248,.18), transparent 55%),
      radial-gradient(900px 600px at 90% 10%, rgba(245,158,11,.14), transparent 55%),
      radial-gradient(900px 600px at 55% 95%, rgba(34,197,94,.12), transparent 55%),
      linear-gradient(180deg, var(--bg0), var(--bg1));
    color: var(--text);
  }

  /* Prevent horizontal scroll everywhere */
  html, body{ overflow-x: hidden; }
  *, *::before, *::after{ box-sizing: border-box; }
  img, svg{ max-width: 100%; height: auto; }

  /* Layout shell */
  .page-shell{
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px 12px 28px;
  }

  /* Keep existing class name: .wrapper */
  .wrapper{
    max-width: 560px;
    margin: 18px auto;
    padding: 26px 18px;
    border-radius: var(--radius);
    background: linear-gradient(180deg, var(--panel), var(--panel2));
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    position: relative;
    overflow: hidden;
  }

  /* Subtle glow ring */
  .wrapper::before{
    content:"";
    position:absolute;
    inset:-2px;
    background:
      radial-gradient(650px 240px at 25% 0%, rgba(56,189,248,.22), transparent 65%),
      radial-gradient(650px 240px at 75% 10%, rgba(245,158,11,.18), transparent 65%),
      radial-gradient(650px 240px at 50% 100%, rgba(34,197,94,.14), transparent 65%);
    filter: blur(18px);
    opacity:.85;
    pointer-events:none;
  }
  .wrapper > *{ position: relative; z-index: 1; }

  /* Title (keep existing h2 element) */
  h2{
    margin: 0 0 16px;
    text-align: left;
    font-weight: 950;
    letter-spacing: .2px;
    line-height: 1.12;
    color: #fff;
    font-size: clamp(20px, 3.8vw, 28px);
  }
  h2::after{
    content:"";
    display:block;
    margin-top: 12px;
    height: 1px;
    background: linear-gradient(90deg, rgba(56,189,248,.35), rgba(245,158,11,.30), rgba(34,197,94,.25), transparent);
  }

  /* Form spacing */
  form{
    margin-top: 14px;
  }

  label{
    color: rgba(226,232,240,.92);
    font-weight: 800;
    margin: 0 0 8px;
    display:block;
    font-size: 13px;
    letter-spacing: .2px;
  }

  /* Select control (keep existing <select> element) */
  select{
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;

    padding: 14px 44px 14px 14px;
    border-radius: 16px;
    background:
      linear-gradient(180deg, rgba(2,6,23,.55), rgba(2,6,23,.35));
    color: var(--text);

    border: 1px solid rgba(255,255,255,.12);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
    font-size: 15px;
    line-height: 1.2;

    margin-bottom: 16px;
    outline: none;
    transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
  }

  /* Custom dropdown arrow */
  .select-wrap{
    position: relative;
  }
  .select-wrap::after{
    content:"";
    position:absolute;
    right: 14px;
    top: 50%;
    width: 10px;
    height: 10px;
    transform: translateY(-50%) rotate(45deg);
    border-right: 2px solid rgba(226,232,240,.72);
    border-bottom: 2px solid rgba(226,232,240,.72);
    pointer-events:none;
    opacity: .9;
  }

  select:hover{
    border-color: rgba(56,189,248,.28);
  }

  select:focus{
    border-color: rgba(56,189,248,.70);
    box-shadow:
      0 0 0 4px rgba(56,189,248,.14),
      0 14px 40px rgba(56,189,248,.10);
    transform: translateY(-1px);
  }

  select:disabled{
    opacity: .65;
    cursor: not-allowed;
  }

  /* Button (keep existing .btn-primary class) */
  .btn-primary{
    width: 100%;
    border: none;
    border-radius: 16px;
    padding: 14px 16px;
    font-weight: 950;
    letter-spacing: .2px;
    color: #062314;
    background: linear-gradient(90deg, var(--green), var(--green2));
    box-shadow: 0 18px 44px rgba(34,197,94,.18);
    cursor: pointer;
    transition: transform .18s ease, filter .18s ease, box-shadow .18s ease;
    min-height: 48px; /* touch friendly */
  }

  .btn-primary:hover{
    transform: translateY(-1px);
    filter: brightness(1.05);
    box-shadow: 0 22px 52px rgba(34,197,94,.22);
  }

  .btn-primary:focus-visible{
    outline: none;
    box-shadow:
      0 0 0 4px rgba(245,158,11,.18),
      0 0 0 1px rgba(245,158,11,.40) inset,
      0 22px 52px rgba(34,197,94,.22);
  }

  /* Back link (keep existing .back-link class) */
  .back-link{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;

    width: 100%;
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 16px;

    color: rgba(226,232,240,.95);
    text-decoration: none;
    font-weight: 900;

    background: rgba(148,163,184,.10);
    border: 1px solid rgba(255,255,255,.10);
    transition: transform .18s ease, background .18s ease, border-color .18s ease, color .18s ease;
    min-height: 48px; /* touch friendly */
  }

  .back-link:hover{
    background: rgba(148,163,184,.16);
    border-color: rgba(56,189,248,.22);
    transform: translateY(-1px);
    color: #fff;
  }

  .back-link:focus-visible{
    outline: none;
    box-shadow: 0 0 0 4px rgba(56,189,248,.14);
  }

  /* Tablet / desktop spacing */
  @media (min-width: 768px){
    .page-shell{ padding: 22px 18px 34px; }
    .wrapper{ padding: 30px 30px 26px; }
  }

  /* Large desktop (1440px+) */
  @media (min-width: 1440px){
    .wrapper{ max-width: 620px; }
  }

  /* Small phones */
  @media (max-width: 420px){
    .wrapper{ padding: 22px 16px 18px; border-radius: 20px; }
    select{ border-radius: 14px; padding: 13px 44px 13px 13px; }
    .btn-primary, .back-link{ border-radius: 14px; }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; scroll-behavior: auto !important; }
  }
</style>

<div class="page-shell">
  <main class="wrapper" role="main">

    <h2>👤 {{ group.nom }} guruhiga o‘quvchi qo‘shish</h2>

    <form method="post">
      {% csrf_token %}

      <label for="student">O‘quvchini tanlang:</label>
      <div class="select-wrap">
        <select name="student_id" id="student" required>
          {% for student in students %}
            <option value="{{ student.id }}">{{ student.get_full_name }}</option>
          {% endfor %}
        </select>
      </div>

      <button type="submit" class="btn-primary">➕ Qo‘shish</button>
    </form>

    <a href="{% url 'education:group_detail' group.id %}" class="back-link">⬅️ Ortga qaytish</a>

  </main>
</div>

{% endblock %}
