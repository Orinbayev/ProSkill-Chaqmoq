{% extends 'base.html' %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

<style>
  :root{
    --panel:#111827;
    --glass:rgba(255,255,255,0.04);
    --border:rgba(148,163,184,0.25);
    --text:#e5e7eb;
    --yellow:#facc15;
    --blue:#38bdf8;
    --green:#22c55e;
  }

  body {
    background:#0f172a;
    color:var(--text);
  }

  .wrapper {
    max-width: 650px;
    margin: 35px auto;
    background: var(--glass);
    border:1px solid var(--border);
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 0 25px rgba(56,189,248,0.12);
    backdrop-filter: blur(10px);
  }

  h4 {
    text-align:center;
    color: var(--yellow);
    font-weight:700;
    margin-bottom:25px;
  }

  label {
    color: var(--text);
    font-weight:600;
    margin-bottom:6px;
  }

  /* TOM SELECT DARK MODE */
  .ts-control {
    background:#1e293b !important;
    border:1px solid var(--border) !important;
    border-radius:12px !important;
    color:var(--text) !important;
    padding:10px !important;
  }

  .ts-wrapper.multi .ts-control > div {
    background: var(--blue) !important;
    color:#fff !important;
    border-radius:8px;
    padding:4px 8px;
    margin:2px;
  }

  .ts-dropdown {
    background:#1e293b !important;
    color:#fff !important;
    border:1px solid var(--border);
  }

  .ts-dropdown .option:hover {
    background:#334155 !important;
  }

  .btn-primary {
    background: linear-gradient(90deg, #22c55e, #16a34a);
    border:none;
    padding:10px 25px;
    border-radius:10px;
    font-weight:600;
    transition:0.25s;
  }

  .btn-primary:hover {
    transform:scale(1.05);
    filter:brightness(1.1);
  }

  .btn-secondary {
    background: none;
    border:1px solid var(--blue);
    padding:10px 25px;
    color: var(--blue);
    border-radius:10px;
    font-weight:600;
    transition:0.25s;
  }

  .btn-secondary:hover {
    background: var(--blue);
    color:#0f172a;
  }

  #hisobBox {
    background: rgba(255,255,255,0.05);
    padding:18px;
    border-radius:16px;
    border:1px solid var(--border);
    margin-top:15px;
    display:none;
  }

  #hisobBox li {
    margin-top:6px;
  }
  .ts-control input {
    color: #ffffff !important;      /* yozilgan text */
}

/* Placeholder matnni oq rangga o‘tkazish */
.ts-control input::placeholder {
    color: #ffffff !important;
    opacity: 0.7; /* biroz shaffof oq */
}
</style>

<div class="wrapper">

  <h4>👥 {{ g.name }} — Guruhga o‘quvchi qo‘shish</h4>

  <form method="post">
    {% csrf_token %}

    <!-- Students select -->
    <div class="mb-4">
      <label class="form-label">🧑‍🎓 O‘quvchilarni tanlang:</label>
      <select id="students-select" name="student_ids" multiple required>
        {% for s in students %}
          <option value="{{ s.id }}">{{ s.ism }} {{ s.familya }} — {{ s.telefon1 }}</option>
        {% endfor %}
      </select>
      <small class="text-muted d-block mt-2">🔎 Qidirish uchun ism kiriting</small>
    </div>

    <!-- Calculation box (hidden) -->
    <div class="alert" id="hisobBox">
      <strong>📊 Hisob-kitob:</strong>
      <ul class="mb-0 mt-2">
        <li>💵 Kurs narxi: <span id="kursSumma">0</span> so‘m</li>
        <li>👨‍🏫 O‘qituvchi ulushi: <span id="teacherSumma">0</span> so‘m</li>
        <li>🏫 Markaz ulushi: <span id="centerSumma">0</span> so‘m</li>
      </ul>
    </div>

    <div class="mt-4 text-center">
      <button type="submit" class="btn btn-primary">➕ Qo‘shish</button>
      <a href="{% url 'education:group_detail' g.id %}" class="btn btn-secondary ms-2">⬅️ Ortga</a>
    </div>

  </form>
</div>

<script>
  new TomSelect("#students-select", {
    plugins: ['remove_button'],
    persist:false,
    maxItems:null,
    sortField:{field:"text", direction:"asc"},
    placeholder:"O‘quvchi tanlang yoki qidiring...",
  });

  // Calculate (if needed)
  const kursInput = document.getElementById('kursNarxi');
  const foizInput = document.getElementById('foiz');
  const box = document.getElementById('hisobBox');
  const kursSumma = document.getElementById('kursSumma');
  const teacherSumma = document.getElementById('teacherSumma');
  const centerSumma = document.getElementById('centerSumma');

  function hisobla(){
    const kurs = parseFloat(kursInput?.value || 0);
    const foiz = parseFloat(foizInput?.value || 0);

    if(!kursInput) return;

    kursSumma.textContent = kurs.toLocaleString();
    const teacher = (kurs * foiz / 100).toFixed(0);
    const center = kurs - teacher;

    teacherSumma.textContent = Number(teacher).toLocaleString();
    centerSumma.textContent  = Number(center).toLocaleString();

    box.style.display = kurs > 0 ? 'block' : 'none';
  }

  kursInput?.addEventListener("input", hisobla);
  foizInput?.addEventListener("input", hisobla);
</script>

{% endblock %}
