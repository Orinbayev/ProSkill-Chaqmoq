{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h4 class="fw-bold mb-3">{{ g.name }} — Guruhga o‘quvchi qo‘shish</h4>

  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">O‘quvchini tanlang:</label>
      <select name="student_id" class="form-select" required>
        <option value="">— O‘quvchini tanlang —</option>
        {% for s in students %}
          <option value="{{ s.id }}">{{ s.ism }} {{ s.familya }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">💰 Kurs narxi (so‘mda):</label>
        <input type="number" id="kursNarxi" name="kurs_narhi" class="form-control" placeholder="Masalan: 600000" required>
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">👨‍🏫 O‘qituvchi ulushi (%):</label>
        <input type="number" id="foiz" name="oqituvchi_foiz" class="form-control" value="40" min="0" max="100" required>
      </div>
    </div>

    <div class="alert alert-info" id="hisobBox" style="display:none;">
      <strong>Hisob-kitob:</strong>
      <ul class="mb-0">
        <li>Kurs narxi: <span id="kursSumma">0</span> so‘m</li>
        <li>O‘qituvchiga tushadigan summa: <span id="teacherSumma">0</span> so‘m</li>
        <li>Markazga qoladigan summa: <span id="centerSumma">0</span> so‘m</li>
      </ul>
    </div>

    <button type="submit" class="btn btn-primary">Qo‘shish</button>
    <a href="{% url 'education:group_detail' g.id %}" class="btn btn-secondary ms-2">Ortga</a>
  </form>
</div>

<script>
const kursInput = document.getElementById('kursNarxi');
const foizInput = document.getElementById('foiz');
const box = document.getElementById('hisobBox');
const kursSumma = document.getElementById('kursSumma');
const teacherSumma = document.getElementById('teacherSumma');
const centerSumma = document.getElementById('centerSumma');

function hisobla() {
  const kurs = parseFloat(kursInput.value) || 0;
  const foiz = parseFloat(foizInput.value) || 0;
  const teacher = (kurs * foiz / 100).toFixed(0);
  const center = (kurs - teacher).toFixed(0);

  kursSumma.textContent = kurs.toLocaleString();
  teacherSumma.textContent = teacher.toLocaleString();
  centerSumma.textContent = center.toLocaleString();

  box.style.display = kurs > 0 ? 'block' : 'none';
}

kursInput.addEventListener('input', hisobla);
foizInput.addEventListener('input', hisobla);
</script>
{% endblock %}
