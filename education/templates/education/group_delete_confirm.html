{% extends 'base.html' %}
{% block content %}
<div class="container mt-5 text-center">
  <div class="card shadow-sm p-4 mx-auto" style="max-width: 500px;">
    <h4 class="mb-3 text-danger">🗑️ "{{ group.nom }}" guruhini o‘chirishni xohlaysizmi?</h4>
    <form method="post">
      {% csrf_token %}
      <a href="javascript:history.back()" class="btn btn-secondary me-2">Bekor qilish</a>
      <button type="submit" class="btn btn-danger">Ha, o‘chirish</button>
    </form>
  </div>
</div>
{% endblock %}
