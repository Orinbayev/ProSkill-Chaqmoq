{% extends 'base.html' %}
{% block content %}

<style>
/* --- Background --- */
body {
  background: radial-gradient(circle at top left, rgba(239,68,68,0.18), transparent),
              radial-gradient(circle at bottom right, rgba(56,189,248,0.20), transparent),
              #0f172a;
  min-height: 100vh;
  font-family: 'Poppins', sans-serif;
  color: #f8fafc;
}

/* --- Card --- */
.delete-card {
  max-width: 520px;
  margin: 4rem auto;
  padding: 2.2rem;
  background: rgba(255,255,255,0.06);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 12px 35px rgba(0,0,0,0.55);
  backdrop-filter: blur(10px);
  text-align: center;
  animation: fadeIn 0.3s ease;
}

/* --- Warning Title --- */
.delete-title {
  font-size: 1.4rem;
  font-weight: 800;
  color: #f87171;
  text-shadow: 0 0 10px rgba(248,113,113,0.4);
}

/* --- Buttons --- */
.btn-cancel {
  width: 48%;
  padding: 10px;
  border-radius: 10px;
  font-weight: 600;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(255,255,255,0.1);
  color: #e2e8f0;
  transition: 0.25s;
}
.btn-cancel:hover {
  background: rgba(255,255,255,0.22);
}

.btn-delete {
  width: 48%;
  padding: 10px;
  border-radius: 10px;
  font-weight: 700;
  color: white;
  background: linear-gradient(90deg,#ef4444,#dc2626);
  box-shadow: 0 0 15px rgba(239,68,68,0.4);
  border: none;
  transition: 0.25s;
}
.btn-delete:hover {
  transform: scale(1.05);
  background: linear-gradient(90deg,#dc2626,#ef4444);
}

/* --- Fade In Animation --- */
@keyframes fadeIn {
  from { opacity:0; transform: translateY(12px); }
  to   { opacity:1; transform: translateY(0); }
}
</style>


<div class="delete-card">
  <h4 class="delete-title">🗑️ "{{ group.nom }}" guruhini o‘chirmoqchimisiz?</h4>

  <form method="post" class="mt-4">
    {% csrf_token %}
    <div class="d-flex justify-content-between">
      <a href="javascript:history.back()" class="btn-cancel">Bekor qilish</a>
      <button type="submit" class="btn-delete">Ha, o‘chirish</button>
    </div>
  </form>
</div>

{% endblock %}
