{% extends "base.html" %}
{% block content %}

<style>
  :root{
    --bg0:#020617;
    --bg1:#070b16;
    --bg2:#0b1226;

    --glass: rgba(17,24,39,.62);
    --glass2: rgba(2,6,23,.55);
    --stroke: rgba(255,255,255,.10);

    --text:#e5e7eb;
    --muted:#94a3b8;

    --amber:#fbbf24;
    --amber2:#f59e0b;

    --neon:#38bdf8;
    --neon2:#0ea5e9;

    --red:#ef4444;
    --red2:#b91c1c;

    --shadow: 0 26px 90px rgba(0,0,0,.55);

    --r14:14px;
    --r18:18px;
    --r22:22px;
    --r28:28px;

    --pad: clamp(14px, 2.7vw, 22px);
    --gap: clamp(10px, 2.2vw, 14px);

    --ringA: 0 0 0 3px rgba(251,191,36,.18);
    --ringN: 0 0 0 3px rgba(56,189,248,.18);
    --ringR: 0 0 0 3px rgba(239,68,68,.18);
  }

  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    background:
      radial-gradient(980px 640px at 12% -10%, rgba(56,189,248,.16), transparent 55%),
      radial-gradient(980px 640px at 88% 0%, rgba(251,191,36,.14), transparent 55%),
      radial-gradient(980px 680px at 55% 120%, rgba(239,68,68,.12), transparent 60%),
      linear-gradient(180deg, var(--bg0), var(--bg2));
    color: var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }

  :focus-visible{ outline:none; }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  /* keep your existing wrappers but upgrade them */
  .container{
    width: min(1100px, 100%);
    margin: 0 auto;
    padding-left: 12px !important;
    padding-right: 12px !important;
  }
  .py-4{ padding-top: 16px !important; padding-bottom: 28px !important; }

  .card{
    width: min(760px, 100%);
    margin: 0 auto;
    background: linear-gradient(180deg, var(--glass), var(--glass2)) !important;
    border: 1px solid var(--stroke) !important;
    border-radius: var(--r28) !important;
    padding: calc(var(--pad) + 6px) !important;
    box-shadow: var(--shadow) !important;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    position: relative;
    overflow:hidden;
    animation: fadeIn .35s ease;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:-2px;
    background:
      radial-gradient(720px 280px at 20% 0%, rgba(56,189,248,.18), transparent 65%),
      radial-gradient(720px 280px at 70% 10%, rgba(251,191,36,.14), transparent 65%),
      radial-gradient(720px 280px at 55% 120%, rgba(239,68,68,.14), transparent 65%);
    filter: blur(18px);
    opacity:.95;
    pointer-events:none;
  }
  .card > *{ position:relative; z-index:2; }

  h4{
    margin:0 0 10px;
    font-weight: 1000;
    font-size: clamp(18px, 3.8vw, 28px);
    letter-spacing: .2px;
    line-height: 1.06;
    color:#fde68a !important;
    text-shadow: 0 10px 34px rgba(251,191,36,.12);
  }

  p{
    margin: 0 0 14px;
    color: rgba(148,163,184,.98);
    font-weight: 850;
    line-height: 1.55;
    font-size: 14px;
  }

  /* buttons (bootstrap classes preserved) */
  form{
    display:grid;
    gap: 12px;
    margin-top: 10px;
  }

  .btn{
    min-height: 52px;
    border-radius: var(--r18) !important;
    padding: 0 16px !important;
    font-weight: 1000 !important;
    display:inline-flex !important;
    align-items:center !important;
    justify-content:center !important;
    gap:10px !important;
    white-space:nowrap !important;
    transition: transform .18s ease, filter .18s ease, box-shadow .18s ease, background .18s ease, border-color .18s ease;
    width: 100%;
    text-decoration:none !important;
    user-select:none;
  }

  .btn-danger{
    background: linear-gradient(90deg, var(--red), var(--red2)) !important;
    border: 0 !important;
    color:#fff !important;
    box-shadow: 0 18px 44px rgba(239,68,68,.18);
  }
  .btn-danger:hover{ transform: translateY(-1px); filter: brightness(1.03); }
  .btn-danger:active{ transform: translateY(0) scale(.99); }
  .btn-danger:focus-visible{ box-shadow: var(--ringR), 0 18px 44px rgba(239,68,68,.18); }

  .btn-secondary{
    background: rgba(148,163,184,.10) !important;
    border: 1px solid rgba(255,255,255,.10) !important;
    color: rgba(229,231,235,.95) !important;
  }
  .btn-secondary:hover{ background: rgba(148,163,184,.16) !important; transform: translateY(-1px); }
  .btn-secondary:active{ transform: translateY(0) scale(.99); }
  .btn-secondary:focus-visible{ box-shadow: var(--ringA); border-color: rgba(251,191,36,.35) !important; }

  @media (min-width: 720px){
    form{
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items:stretch;
    }
  }

  @media (max-width: 520px){
    .card{ padding: 20px 16px 18px !important; border-radius: 22px !important; }
  }

  @keyframes fadeIn{
    from {opacity:0; transform: translateY(12px);}
    to {opacity:1; transform: translateY(0);}
  }
</style>

<div class="container py-4">
  <div class="card p-4" style="background: rgba(255,255,255,0.03); border-radius:12px;">
    <h4 style="color:#facc15;">Guruhni o'chirish</h4>
    <p>Haqiqatan ham «{{ group.nom }}» guruhini o'chirmoqchimisiz?</p>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Ha, o'chirish</button>
      <a href="{% url 'education:all_groups' %}" class="btn btn-secondary">Bekor qilish</a>
    </form>
  </div>
</div>

{% endblock %}
