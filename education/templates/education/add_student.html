{% extends 'base.html' %}

{% block content %}
<h2>{{ group.nom }} guruhiga o‘quvchi qo‘shish</h2>

<form method="post">
  {% csrf_token %}
  <label for="student">O‘quvchini tanlang:</label>
  <select name="student_id" id="student">
    {% for student in students %}
      <option value="{{ student.id }}">{{ student.get_full_name }}</option>
    {% endfor %}
  </select>
  <button type="submit">Qo‘shish</button>
</form>

<a href="{% url 'education:group_detail' group.id %}">⬅️ Ortga</a>
{% endblock %}
