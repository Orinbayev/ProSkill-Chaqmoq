services:
  - type: web
    name: ProSkill-Chaqmoq
    env: python
    plan: free
    region: frankfurt
    
    # ==================== BUILD COMMAND ====================
    # Install deps, collect static, run migrations
    buildCommand: |
      python3 -m pip install -r requirements.txt
      python3 manage.py collectstatic --noinput
      python3 manage.py migrate --noinput
    
    startCommand: ./start.sh
    
    # ==================== ENVIRONMENT VARIABLES ====================
    envVars:
      # Django settings
      - key: MODE
        value: production
      
      - key: BOT_API_PORT
        value: "8080"

      - key: TELEGRAM_BOT_ENABLED
        value: "true"

      - key: WEB_CONCURRENCY
        value: "1"

      # Free tier: 2 thread yetarli emas edi — SuperAdmin markaz yaratish kabi
      # uzunroq POST'lar healthcheck bilan to'qnashib qotib qolar edi.
      - key: GUNICORN_THREADS
        value: "4"

      # Markaz yaratish: parol xeshlash + subscription sync + feature sync
      # free plan CPU'da 120s'dan oshib ketar edi. 180s ga ko'tarildi.
      - key: GUNICORN_TIMEOUT
        value: "180"

      - key: GUNICORN_MAX_REQUESTS
        value: "500"

      - key: GUNICORN_MAX_REQUESTS_JITTER
        value: "50"

      - key: BACKUP_SCHEDULER_ENABLED
        value: "false"

      - key: BOT_BACKUP_SCHEDULER_ENABLED
        value: "false"
      
      - key: BOT_INTERNAL_API_URL
        value: http://localhost:8080
      
      - key: ROOT_DOMAIN
        sync: false  # Set manually in dashboard
      
      - key: SECRET_KEY
        generateValue: true  # Auto-generate secure key

      - key: API_SECRET
        generateValue: true

      - key: CLICK_SECRET_KEY
        sync: false

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: BACKUP_BOT_TOKEN
        sync: false

      - key: TELEGRAM_GROUP_ID
        sync: false

      - key: BACKUP_GROUP_ID
        sync: false
      
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      
      # Database (if using separate Postgres service)
      # If using Render Postgres, DATABASE_URL is auto-provided
      - key: DB_ENGINE
        value: django.db.backends.postgresql

      - key: DATABASE_URL
        sync: false
      
      # Localization
      - key: LANGUAGE_CODE
        value: uz
      
      - key: TIME_ZONE
        value: Asia/Tashkent
      
      # Security (auto-enabled on Render)
      - key: SECURE_SSL_REDIRECT
        value: true
    
    # ==================== HEALTH CHECK ====================
    healthCheckPath: /health/
    
    # ==================== AUTO DEPLOY ====================
    autoDeploy: true
    
    # ==================== CUSTOM DOMAINS ====================
    # Add after initial deploy in Render Dashboard:
    # - chaqmoq.uz
    # - *.chaqmoq.uz

# ==================== DATABASE SERVICE ====================
# Optional: If you want Render-managed Postgres
# databases:
#   - name: proskill-db
#     databaseName: chaqmoq_db
#     user: chaqmoq_user
#     plan: free

  # ==================== CRON JOB – DAILY BACKUP ====================
  # Render Cron Job: har kuni 17:35 Asia/Tashkent = 12:35 UTC
  # Bu ENG ISHONCHLI usul – bot jarayoniga bog'liq emas!
  - type: cron
    name: daily-center-backup
    env: python
    region: frankfurt
    schedule: "35 12 * * *"   # 12:35 UTC = 17:35 Asia/Tashkent
    buildCommand: python3 -m pip install -r requirements.txt
    startCommand: python3 manage.py backup_and_send
    envVars:
      - key: MODE
        value: production
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: TIME_ZONE
        value: Asia/Tashkent
      - key: SECRET_KEY
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: SECRET_KEY
      - key: API_SECRET
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: API_SECRET
      - key: CLICK_SECRET_KEY
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: CLICK_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: DATABASE_URL
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: BACKUP_BOT_TOKEN
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: BACKUP_BOT_TOKEN
      - key: TELEGRAM_GROUP_ID
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: TELEGRAM_GROUP_ID
      - key: BACKUP_GROUP_ID
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: BACKUP_GROUP_ID

  # ==================== CRON JOB - PAYMENT DISCIPLINE RULES ====================
  # Har kuni 02:00 Asia/Tashkent = 21:00 UTC; deadline o'tmagan kunlarda no-op.
  - type: cron
    name: payment-discipline-rules
    env: python
    region: frankfurt
    schedule: "0 21 * * *"   # 21:00 UTC = 02:00 Asia/Tashkent
    buildCommand: python3 -m pip install -r requirements.txt
    startCommand: python3 manage.py process_lightning_rules
    envVars:
      - key: MODE
        value: production
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: TIME_ZONE
        value: Asia/Tashkent
      - key: SECRET_KEY
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: SECRET_KEY
      - key: API_SECRET
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: API_SECRET
      - key: CLICK_SECRET_KEY
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: CLICK_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: DATABASE_URL

  # ==================== CRON JOB - MONTHLY ATTENDANCE RULES ====================
  # Har kuni 21:15 UTC yuradi; Asia/Tashkent bo'yicha 1-sana bo'lmasa command no-op.
  - type: cron
    name: monthly-attendance-rules
    env: python
    region: frankfurt
    schedule: "15 21 * * *"   # 21:15 UTC = 02:15 Asia/Tashkent
    buildCommand: python3 -m pip install -r requirements.txt
    startCommand: python3 manage.py apply_monthly_rules
    envVars:
      - key: MODE
        value: production
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: TIME_ZONE
        value: Asia/Tashkent
      - key: SECRET_KEY
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: SECRET_KEY
      - key: API_SECRET
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: API_SECRET
      - key: CLICK_SECRET_KEY
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: CLICK_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: DATABASE_URL
