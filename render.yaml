services:
  - type: web
    name: ProSkill-Chaqmoq
    env: python
    # Standard = 2GB / 1 CPU ($25). Dashboard'da upgrade qilingan — bu yerda ham
    # 'standard' turishi shart, aks holda blueprint sync 'starter'ga qaytaradi.
    plan: standard
    region: frankfurt
    
    # ==================== BUILD COMMAND ====================
    # RENDER_BUILD_PHASE=1 allows settings.py to gracefully skip production
    # secret checks (DATABASE_URL etc.) that are absent during build.
    # Migrations run at startup (start.sh) when DATABASE_URL is available.
    buildCommand: >-
      RENDER_BUILD_PHASE=1 pip install -r requirements.txt &&
      RENDER_BUILD_PHASE=1 python manage.py collectstatic --noinput &&
      (python manage.py migrate --noinput || echo migrate_skipped)
    
    startCommand: ./start.sh
    
    # ==================== ENVIRONMENT VARIABLES ====================
    envVars:
      # Django settings
      - key: MODE
        value: production
      
      - key: BOT_API_PORT
        value: "8080"

      - key: TELEGRAM_BOT_ENABLED
        value: "true"

      # $25 Standard (2GB / 1 CPU): bot + 2 gunicorn worker bemalol sig'adi.
      # 2 worker = biri recycle/band bo'lganda ikkinchisi javob beradi ->
      # recycle-502, saturation-502 va cold-start starvation yo'qoladi.
      # (Metrics'da memory bemalol bo'lsa, keyin 3'ni ham sinash mumkin.)
      - key: WEB_CONCURRENCY
        value: "2"

      # Free tier: 2 thread yetarli emas edi — SuperAdmin markaz yaratish kabi
      # uzunroq POST'lar healthcheck bilan to'qnashib qotib qolar edi.
      - key: GUNICORN_THREADS
        value: "4"

      # Og'ir hisobot sahifalari (qarzdorlar / finance month-preview) ko'p
      # o'quvchili markazda sekin bo'lishi mumkin. 60s o'rniga 120s: worker
      # timeout -> 502 o'rniga sekin-lekin-natija qaytaradi. Markaz yaratish
      # (parol xeshlash + subscription/feature sync) ham bemalol sig'adi.
      - key: GUNICORN_TIMEOUT
        value: "120"

      # Worker recycle kamroq bo'lsin — har 500 requestda restart 502 berardi.
      - key: GUNICORN_MAX_REQUESTS
        value: "2000"

      - key: GUNICORN_MAX_REQUESTS_JITTER
        value: "100"

      # Bot Gunicorn port bind + health o'tgach ishga tushsin (cold-start 502).
      - key: BOT_START_DELAY
        value: "12"

      - key: BACKUP_SCHEDULER_ENABLED
        value: "false"

      # Kunlik DB backup'ni DOIM ishlab turgan bot jarayonidan yuboramiz
      # (18:00 Asia/Tashkent, BACKUP_SEND_TIME + BACKUP_TIMEZONE bo'yicha).
      # Bu Render cron servisiga bog'liq emas -> ishonchliroq. Agar alohida
      # 'daily-center-backup' cron ham faol bo'lsa -> ikki marta yuboradi,
      # o'shanda cron'ni o'chiring (bittasi yetarli).
      - key: BOT_BACKUP_SCHEDULER_ENABLED
        value: "true"
      
      - key: BOT_INTERNAL_API_URL
        value: http://localhost:8080
      
      - key: ROOT_DOMAIN
        sync: false  # Set manually in dashboard
      
      - key: SECRET_KEY
        generateValue: true  # Auto-generate secure key

      - key: API_SECRET
        generateValue: true

      - key: CLICK_SECRET_KEY
        sync: false

      # ── Gemini AI ──────────────────────────────────────────────────────────
      # Google AI Studio dan oling: https://aistudio.google.com/app/apikey
      # Render Dashboard → ProSkill-Chaqmoq → Environment → GEMINI_API_KEY
      - key: GEMINI_API_KEY
        sync: false

      # Ixtiyoriy: model nomini o'zgartirish uchun (default: gemini-2.5-flash)
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: BACKUP_BOT_TOKEN
        sync: false

      # ── English Teacher Bot ────────────────────────────────────────────────
      # @BotFather dan alohida bot yarating va tokenini kiriting
      - key: ENGLISH_BOT_TOKEN
        sync: false

      # Anthropic Claude API (english teacher uchun)
      - key: ANTHROPIC_API_KEY
        sync: false

      - key: TELEGRAM_GROUP_ID
        sync: false

      - key: TELEGRAM_BACKUP_CHAT_ID
        sync: false

      - key: BACKUP_GROUP_ID
        sync: false

      - key: BACKUP_TIMEZONE
        value: Asia/Tashkent

      - key: BACKUP_SEND_TIME
        value: "18:00"

      - key: BACKUP_KEEP_DAYS
        value: "7"

      - key: BACKUP_GDRIVE_ENABLED
        value: "false"

      - key: ADMIN_TELEGRAM_IDS
        sync: false
      
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      
      # Database (if using separate Postgres service)
      # If using Render Postgres, DATABASE_URL is auto-provided
      - key: DB_ENGINE
        value: django.db.backends.postgresql

      - key: DATABASE_URL
        sync: false
      
      # Localization
      - key: LANGUAGE_CODE
        value: uz
      
      - key: TIME_ZONE
        value: Asia/Tashkent
      
      # Security (auto-enabled on Render)
      - key: SECURE_SSL_REDIRECT
        value: true
    
    # ==================== HEALTH CHECK ====================
    healthCheckPath: /health/
    
    # ==================== AUTO DEPLOY ====================
    autoDeploy: true
    
    # ==================== CUSTOM DOMAINS ====================
    # Add after initial deploy in Render Dashboard:
    # - chaqmoq.uz
    # - *.chaqmoq.uz

# ==================== DATABASE SERVICE ====================
# Optional: If you want Render-managed Postgres
# databases:
#   - name: proskill-db
#     databaseName: chaqmoq_db
#     user: chaqmoq_user
#     plan: free

  # ==================== CRON JOB – DAILY BACKUP ====================
  # Render Cron Job: har kuni 18:00 Asia/Tashkent = 13:00 UTC
  # Bu ENG ISHONCHLI usul – bot jarayoniga bog'liq emas!
  - type: cron
    name: daily-center-backup
    env: python
    region: frankfurt
    schedule: "0 13 * * *"   # 13:00 UTC = 18:00 Asia/Tashkent
    buildCommand: python3 -m pip install -r requirements.txt
    startCommand: python3 manage.py send_db_backups
    envVars:
      - key: MODE
        value: production
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: TIME_ZONE
        value: Asia/Tashkent
      - key: BACKUP_TIMEZONE
        value: Asia/Tashkent
      - key: BACKUP_SEND_TIME
        value: "18:00"
      - key: BACKUP_KEEP_DAYS
        value: "7"
      - key: BACKUP_GDRIVE_ENABLED
        value: "false"
      - key: SECRET_KEY
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: SECRET_KEY
      - key: API_SECRET
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: API_SECRET
      - key: CLICK_SECRET_KEY
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: CLICK_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: DATABASE_URL
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: BACKUP_BOT_TOKEN
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: BACKUP_BOT_TOKEN
      - key: TELEGRAM_GROUP_ID
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: TELEGRAM_GROUP_ID
      - key: TELEGRAM_BACKUP_CHAT_ID
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: TELEGRAM_BACKUP_CHAT_ID
      - key: BACKUP_GROUP_ID
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: BACKUP_GROUP_ID
      - key: ADMIN_TELEGRAM_IDS
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: ADMIN_TELEGRAM_IDS

  # ==================== CRON JOB - MONTHLY TUITION GENERATION ====================
  # Har oyning 1-kuni 02:00 Asia/Tashkent = 21:00 UTC — TuitionMonth yaratadi.
  - type: cron
    name: monthly-tuition-generation
    env: python
    region: frankfurt
    schedule: "0 21 1 * *"   # 21:00 UTC = 02:00 Asia/Tashkent, faqat 1-kun
    buildCommand: python3 -m pip install -r requirements.txt
    startCommand: python3 manage.py generate_monthly_tuition --all-active
    envVars:
      - key: MODE
        value: production
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: TIME_ZONE
        value: Asia/Tashkent
      - key: SECRET_KEY
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: SECRET_KEY
      - key: API_SECRET
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: API_SECRET
      - key: CLICK_SECRET_KEY
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: CLICK_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: DATABASE_URL

  # ==================== CRON JOB - PAYMENT DISCIPLINE RULES ====================
  # Har kuni 02:00 Asia/Tashkent = 21:00 UTC; deadline o'tmagan kunlarda no-op.
  - type: cron
    name: payment-discipline-rules
    env: python
    region: frankfurt
    schedule: "0 21 * * *"   # 21:00 UTC = 02:00 Asia/Tashkent
    buildCommand: python3 -m pip install -r requirements.txt
    startCommand: python3 manage.py process_lightning_rules
    envVars:
      - key: MODE
        value: production
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: TIME_ZONE
        value: Asia/Tashkent
      - key: SECRET_KEY
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: SECRET_KEY
      - key: API_SECRET
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: API_SECRET
      - key: CLICK_SECRET_KEY
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: CLICK_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: DATABASE_URL

  # ==================== CRON JOB - MONTHLY ATTENDANCE RULES ====================
  # Har kuni 21:15 UTC yuradi; Asia/Tashkent bo'yicha 1-sana bo'lmasa command no-op.
  - type: cron
    name: monthly-attendance-rules
    env: python
    region: frankfurt
    schedule: "15 21 * * *"   # 21:15 UTC = 02:15 Asia/Tashkent
    buildCommand: python3 -m pip install -r requirements.txt
    startCommand: python3 manage.py apply_monthly_rules
    envVars:
      - key: MODE
        value: production
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: TIME_ZONE
        value: Asia/Tashkent
      - key: SECRET_KEY
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: SECRET_KEY
      - key: API_SECRET
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: API_SECRET
      - key: CLICK_SECRET_KEY
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: CLICK_SECRET_KEY
      - key: DATABASE_URL
        fromService:
          name: ProSkill-Chaqmoq
          type: web
          envVarKey: DATABASE_URL
