services:
  - type: web
    name: ProSkill-Chaqmoq
    env: python
    plan: free
    region: frankfurt
    
    # ==================== BUILD COMMAND ====================
    # Install deps, collect static, run migrations
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    
    startCommand: ./start.sh
    
    # ==================== ENVIRONMENT VARIABLES ====================
    envVars:
      # Django settings
      - key: MODE
        value: production
      
      - key: BOT_API_PORT
        value: 8080
      
      - key: BOT_INTERNAL_API_URL
        value: http://localhost:8080
      
      - key: ROOT_DOMAIN
        sync: false  # Set manually in dashboard
      
      - key: SECRET_KEY
        generateValue: true  # Auto-generate secure key
      
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      
      # Database (if using separate Postgres service)
      # If using Render Postgres, DATABASE_URL is auto-provided
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      
      # Localization
      - key: LANGUAGE_CODE
        value: uz
      
      - key: TIME_ZONE
        value: Asia/Tashkent
      
      # Security (auto-enabled on Render)
      - key: SECURE_SSL_REDIRECT
        value: true
    
    # ==================== HEALTH CHECK ====================
    healthCheckPath: /health/
    
    # ==================== AUTO DEPLOY ====================
    autoDeploy: true
    
    # ==================== CUSTOM DOMAINS ====================
    # Add after initial deploy in Render Dashboard:
    # - chaqmoq.uz
    # - *.chaqmoq.uz

# ==================== DATABASE SERVICE ====================
# Optional: If you want Render-managed Postgres
# databases:
#   - name: proskill-db
#     databaseName: chaqmoq_db
#     user: chaqmoq_user
#     plan: free

  # ==================== CRON JOB – DAILY BACKUP ====================
  # Render Cron Job: har kuni 16:00 Asia/Tashkent = 11:00 UTC
  # Bu ENG ISHONCHLI usul – bot jarayoniga bog'liq emas!
  - type: cron
    name: daily-center-backup
    env: python
    region: frankfurt
    schedule: "0 11 * * *"   # 11:00 UTC = 16:00 Asia/Tashkent
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py backup_and_send
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: TIME_ZONE
        value: Asia/Tashkent
      # Quyidagilarni Render Dashboard da qo'shing (sync: false):
      # - key: TELEGRAM_BOT_TOKEN
      #   sync: false
      # - key: TELEGRAM_GROUP_ID
      #   sync: false
      # - key: DATABASE_URL
      #   sync: false
