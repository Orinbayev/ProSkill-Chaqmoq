services:
  - type: web
    name: ProSkill-Chaqmoq
    env: python
    plan: free
    region: frankfurt
    
    # ==================== BUILD COMMAND ====================
    # Install deps, collect static, run migrations
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    
    # ==================== START COMMAND ====================
    # CRITICAL: Must bind to $PORT (Render sets this automatically)
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --timeout 120
    
    # ==================== ENVIRONMENT VARIABLES ====================
    envVars:
      # Django settings
      - key: MODE
        value: production
      
      - key: ROOT_DOMAIN
        sync: false  # Set manually in dashboard
      
      - key: SECRET_KEY
        generateValue: true  # Auto-generate secure key
      
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      
      # Database (if using separate Postgres service)
      # If using Render Postgres, DATABASE_URL is auto-provided
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      
      # Localization
      - key: LANGUAGE_CODE
        value: uz
      
      - key: TIME_ZONE
        value: Asia/Tashkent
      
      # Security (auto-enabled on Render)
      - key: SECURE_SSL_REDIRECT
        value: true
    
    # ==================== HEALTH CHECK ====================
    healthCheckPath: /
    
    # ==================== AUTO DEPLOY ====================
    autoDeploy: true
    
    # ==================== CUSTOM DOMAINS ====================
    # Add after initial deploy in Render Dashboard:
    # - chaqmoq.uz
    # - *.chaqmoq.uz

# ==================== DATABASE SERVICE ====================
# Optional: If you want Render-managed Postgres
# databases:
#   - name: proskill-db
#     databaseName: chaqmoq_db
#     user: chaqmoq_user
#     plan: free
