name: Mobile Release (Android + iOS)

# Push → avtomatik build (va secret bo'lsa store ga yuklash).
#
# Trigger:
#   - main ga mobile_app/ o'zgarishi push qilinganda
#   - yoki Actions → "Mobile Release" → Run workflow
#
# Android (har doim):
#   - signed AAB build + artifact (yuklab olish mumkin)
#   - PLAY_SERVICE_ACCOUNT_JSON secret bo'lsa → Play (internal track) ga yuklaydi
#
# iOS (ixtiyoriy):
#   - Repo → Settings → Variables → ENABLE_IOS_CI = true
#   - va iOS secret'lari to'ldirilgach TestFlight ga yuklaydi
#
# To'liq yo'riqnoma: MOBILE_DEPLOY_SETUP.md

on:
  push:
    branches: [main]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile-release.yml'
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Play track (internal | alpha | beta | production)'
        required: false
        default: 'internal'
      skip_ios:
        description: 'iOS job ni o‘tkazib yuborish'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.32.0'
  # versionCode = BUILD_BASE + run_number (monoton o'sadi)
  # 1.0.2+7 allaqachon ishlatilgan — BASE=7 → run #1 = 8
  BUILD_BASE: '7'

jobs:
  # ────────────────────────────────────────────────────────────────
  #  ANDROID
  # ────────────────────────────────────────────────────────────────
  android:
    name: Android AAB
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.ver.outputs.name }}
      version_code: ${{ steps.ver.outputs.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Restore Android signing secrets
        working-directory: mobile_app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ]; then
            echo "❌ Android secret'lar yo'q."
            echo "Kerak: ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS"
            echo "Qarang: MOBILE_DEPLOY_SETUP.md"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/upload-keystore.jks
          # key.properties — boshida bo'sh joy BO'LMASIN
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=${STORE_PASSWORD}"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
          } > android/key.properties
          ls -la android/upload-keystore.jks android/key.properties

      - name: Compute version
        id: ver
        working-directory: mobile_app
        run: |
          BUILD_NAME=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')
          BUILD_NUMBER=$(( BUILD_BASE + GITHUB_RUN_NUMBER ))
          echo "name=${BUILD_NAME}" >> "$GITHUB_OUTPUT"
          echo "number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "📦 ${BUILD_NAME} (${BUILD_NUMBER})"

      - name: Build release AAB
        working-directory: mobile_app
        run: |
          flutter pub get
          flutter build appbundle --release \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.number }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChaqmoqApp-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.number }}-aab
          path: mobile_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      # Yoqish: Variables → ENABLE_PLAY_UPLOAD = true  +  secret PLAY_SERVICE_ACCOUNT_JSON
      - name: Upload to Google Play (optional)
        if: ${{ vars.ENABLE_PLAY_UPLOAD == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uz.chaqmoq.chaqmoq_mobile
          releaseFiles: mobile_app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.play_track || 'internal' }}
          status: completed

  # ────────────────────────────────────────────────────────────────
  #  iOS → TestFlight
  # ────────────────────────────────────────────────────────────────
  ios:
    name: iOS IPA → TestFlight
    # Yoqish: Settings → Secrets and variables → Actions → Variables
    #   ENABLE_IOS_CI = true
    # + barcha iOS secret'lari (MOBILE_DEPLOY_SETUP.md)
    if: ${{ vars.ENABLE_IOS_CI == 'true' && github.event.inputs.skip_ios != 'true' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: Install Apple certificate + provisioning profile
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12_BASE64:-}" ] || [ -z "${PROFILE_BASE64:-}" ]; then
            echo "❌ iOS secret'lar yetarli emas (IOS_DIST_CERT_P12_BASE64, IOS_PROVISION_PROFILE_BASE64)"
            exit 1
          fi
          CERT_PATH=$RUNNER_TEMP/dist_cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KC_PASS=${KEYCHAIN_PASSWORD:-ci-temp-pass}

          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$CERT_PATH" -P "${CERT_PASSWORD:-}" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          # UUID nom bilan saqlash (Xcode shunday qidiradi)
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")" 2>/dev/null || true)
          if [ -n "${UUID:-}" ]; then
            cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"
          else
            cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          fi

      - name: App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p mobile_app/ios/private_keys
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "mobile_app/ios/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          ls -la "mobile_app/ios/private_keys/"

      - name: Compute version
        id: ver
        working-directory: mobile_app
        run: |
          BUILD_NAME=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1 | tr -d '[:space:]')
          BUILD_NUMBER=$(( BUILD_BASE + GITHUB_RUN_NUMBER ))
          echo "name=${BUILD_NAME}" >> "$GITHUB_OUTPUT"
          echo "number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: ExportOptions.plist
        working-directory: mobile_app
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROVISION_PROFILE_NAME }}
        run: |
          set -euo pipefail
          plutil -create xml1 ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :method string app-store" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :teamID string ${IOS_TEAM_ID}" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:uz.chaqmoq.chaqmoqMobile string ${IOS_PROFILE_NAME}" ios/ExportOptions.plist
          plutil -lint ios/ExportOptions.plist
          cat ios/ExportOptions.plist

      - name: Pod install + IPA build
        working-directory: mobile_app
        run: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..
          flutter build ipa --release \
            --build-name=${{ steps.ver.outputs.name }} \
            --build-number=${{ steps.ver.outputs.number }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChaqmoqApp-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.number }}-ipa
          path: mobile_app/build/ios/ipa/*.ipa
          retention-days: 30

      - name: Upload to TestFlight (Fastlane)
        working-directory: mobile_app/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          gem install fastlane --no-document
          fastlane upload_testflight
