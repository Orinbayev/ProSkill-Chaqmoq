<!doctype html>
{% load static %}
<html lang="uz">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <link rel="icon" type="image/png" href="{% static 'images/rasmm.png' %}">
  <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <title>⚡ Chaqmoq Academy</title>
  
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link href="{% static 'css/app.css' %}" rel="stylesheet">

  <!-- Poppins Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  {% block extra_css %}{% endblock %}

  <style>

    /* ------------------------------
       🌈 GLOBAL THEME
    --------------------------------*/
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg,#0f172a,#1e293b);
      color: #f1f5f9;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
    }

    .layout {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: row;
    }

    /* ------------------------------
       📌 CONTENT SECTION
    --------------------------------*/
    .content {
      flex: 1;
      min-width: 0;
      padding: 2rem 2rem;
      background: linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.05));
      border-left: 1px solid rgba(255,255,255,.08);
      box-shadow: inset 0 0 25px rgba(0,0,0,.3);
      position: relative;
      z-index: 1;
    }

    /* 🔔 Alerts */
    .alert {
      border-radius: 10px;
      font-weight: 500;
      box-shadow: 0 3px 8px rgba(0,0,0,.2);
      animation: fadeIn .6s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ------------------------------
       ✨ SCROLLBAR (Desktop only)
    --------------------------------*/
    @media (min-width: 768px) {
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg,#2563eb,#38bdf8);
        border-radius: 10px;
      }
    }

    /* ------------------------------
       📱 RESPONSIVE FIXES
    --------------------------------*/
    @media (max-width: 992px) {

      .layout {
        flex-direction: column;
      }

      .content {
        padding: 1rem 1rem;
        border-left: none;
        border-top: 1px solid rgba(255,255,255,.08);
      }
    }


    /* =========================
       ⚡ MODAL FIX
    =========================== */
    .modal-backdrop.show {
      background-color: rgba(0,0,0,0.55) !important;
      z-index: 1040 !important;
      pointer-events: none !important;
    }

    .modal {
      z-index: 1050 !important;
      pointer-events: auto !important;
    }

    .modal-dialog { z-index: 1060 !important; }

    .modal-content {
      border-radius: 18px;
      background-color: #fff !important;
      color: #111;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
      z-index: 1070 !important;
      position: relative;
    }

    .btn-close {
      z-index: 2000 !important;
      cursor: pointer !important;
    }

    body.modal-open {
      overflow: hidden !important;
    }

    /* Sidebar qatlamlari */
    .sidebar, .navbar, header, nav {
      z-index: 10 !important;
      position: relative;
    }

  </style>

</head>


<body class="{% block body_class %}{% endblock %}">

  {% block pre_layout %}{% endblock %}

  <div class="layout">

    {% include 'partials/sidebar.html' %}

    <main class="content">
      {% for m in messages %}
        <div class="alert alert-{{ m.tags }}">{{ m }}</div>
      {% endfor %}

      {% block content %}{% endblock %}
    </main>

  </div>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}

</body>
</html>
