<!doctype html>
{% load static %}
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>⚡ Chaqmoq Academy</title>
  <link rel="icon" type="image/png" href="{% static 'images/rasmm.png' %}">


  <!-- Bootstrap & Custom CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  {% block extra_css %}{% endblock %}

  <style>
    
    /* 🌈 GLOBAL THEME */
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg,#0f172a,#1e293b);
      color:#f1f5f9;
      min-height:100vh;
      margin:0;
      display:flex;
      overflow-x:hidden;
    }

    .layout { display:flex; width:100%; min-height:100vh; }
    .content {
      flex:1;
      min-width:0;
      padding:2rem;
      background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.04));
      border-left:1px solid rgba(255,255,255,.08);
      box-shadow:inset 0 0 25px rgba(0,0,0,.3);
      position:relative;
      z-index:1;
    }

    /* 🔔 ALERTS */
    .alert {
      border-radius:10px;
      font-weight:500;
      box-shadow:0 3px 8px rgba(0,0,0,.2);
      margin-bottom:1rem;
      animation:fadeIn .6s ease-in-out;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

    /* ✨ SCROLLBAR */
    ::-webkit-scrollbar{width:8px;}
    ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#2563eb,#38bdf8);border-radius:10px;}

    /* 📱 RESPONSIVE */
    @media(max-width:992px){
      .layout{flex-direction:column;}
      .content{padding:1rem;}
    }

    /* =========================
       ⚡ MODAL FIX
       ========================= */
    .modal-backdrop.show {
      background-color: rgba(0,0,0,0.55) !important;
      z-index: 1040 !important;
      pointer-events: none !important;  /* 👈 Bu muammoni hal qiladi */
    }

    .modal {
      z-index: 1050 !important;
      pointer-events: auto !important; /* Modal ichidagi bosishlar ishlaydi */
    }

    .modal-dialog { z-index: 1060 !important; }
    .modal-content {
      border-radius: 18px;
      background-color: #fff !important;
      color: #111;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
      z-index: 1070 !important;
      position: relative;
    }

    .btn-close {
      z-index: 2000 !important;
      cursor: pointer !important;
    }

    /* Modal ochilganda sahifa ishlayversin */
    body.modal-open {
      overflow: hidden !important;
    }
    body.modal-open .content,
    body.modal-open .sidebar,
    body.modal-open .navbar {
      pointer-events: auto !important;
      filter: none !important;
    }

    /* Sidebar va navbar qatlamlari */
    .sidebar, .navbar, header, nav {
      z-index: 10 !important;
      position: relative;
    }
  </style>
</head>

<body class="{% block body_class %}{% endblock %}">
  {% block pre_layout %}{% endblock %}
  <div class="layout">
    {% include 'partials/sidebar.html' %}
    <main class="content">
      {% for m in messages %}
        <div class="alert alert-{{ m.tags }}">{{ m }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
