{% load static %}
<style>
    :root {
        --primary: #3b82f6;
        --primary-light: #60a5fa;
        --primary-glow: rgba(59, 130, 246, 0.3);
        --amber: #f59e0b;
        --amber-light: #fbbf24;
        --amber-glow: rgba(245, 158, 11, 0.3);
        --card-border: rgba(255, 255, 255, 0.08);
    }

    .premium-header {
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(30, 41, 59, 0.8) 100%);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--card-border);
        border-radius: 28px;
        position: relative;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        overflow: visible;
        z-index: 20;
        padding: 24px 32px;
    }

    .header-bg-glow {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: inherit;
        z-index: -1;
        pointer-events: none;
    }

    .header-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(40px);
        opacity: 0.6;
        animation: floatOrb 10s infinite ease-in-out alternate;
    }

    .orb-1 {
        width: 150px;
        height: 150px;
        background: var(--primary-glow);
        top: -30px;
        left: 15%;
    }

    .orb-2 {
        width: 180px;
        height: 180px;
        background: var(--amber-glow);
        bottom: -40px;
        right: 25%;
        animation-delay: -3s;
    }

    @keyframes floatOrb {
        0% {
            transform: translateY(0) scale(1) translateX(0);
        }

        100% {
            transform: translateY(-20px) scale(1.1) translateX(20px);
        }
    }

    .header-icon-box {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.05), 0 10px 20px rgba(0, 0, 0, 0.2);
        font-size: 28px;
        color: #fff;
    }

    .moliya-tabs {
        display: flex;
        gap: 8px;
        background: rgba(0, 0, 0, 0.2);
        padding: 6px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .moliya-tab {
        padding: 10px 20px;
        border-radius: 14px;
        color: #94a3b8;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.3s ease;
        border: 1px solid transparent;
    }

    .moliya-tab:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.05);
    }

    .moliya-tab.active {
        color: #fff;
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        border-color: rgba(59, 130, 246, 0.5);
        box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    @media (max-width: 768px) {
        .moliya-tabs {
            flex-wrap: wrap;
        }

        .moliya-tab {
            flex: 1 1 calc(50% - 8px);
            text-align: center;
            padding: 8px 12px;
        }
    }

    /* Toolbar Actions */
    .toolbar-actions {
        display: flex;
        gap: 12px;
        align-items: center;
    }

    .icon-action-btn {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        font-size: 18px;
        transition: all 0.2s ease;
        cursor: pointer;
    }

    .icon-action-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        color: var(--amber-light);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
</style>

<div class="premium-header mb-5">
    <div class="header-bg-glow">
        <div class="header-orb orb-1"></div>
        <div class="header-orb orb-2"></div>
    </div>

    <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-center gap-4">
        <div class="d-flex align-items-center gap-4">
            <!-- Back Button -->
            <!-- <a href="javascript:history.back()" class="icon-action-btn" style="text-decoration: none;" title="Orqaga">
                <i class="fa-solid fa-chevron-left"></i>
            </a> -->

            <div class="header-icon-box shadow-sm">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <div>
                <h2 class="m-0 fw-black text-white mb-1" style="font-size: 28px; letter-spacing: -1px;">Moliya</h2>
                <p class="m-0 text-white-50" style="font-size: 15px;">To'lovlar, qarzdorlar va xarajatlar tahlili</p>
            </div>
        </div>

        <div class="moliya-tabs">
            <a href="{% url 'education:tolovlar_home' %}"
                class="moliya-tab {% if request.resolver_match.url_name == 'tolovlar_home' %}active{% endif %}">
                To'lovlar
            </a>
            <a href="{% url 'education:qarzdorlar_home' %}"
                class="moliya-tab {% if request.resolver_match.url_name == 'qarzdorlar_home' %}active{% endif %}">
                Qarzdorlar
            </a>
            <a href="{% url 'store:expenses' %}"
                class="moliya-tab {% if request.resolver_match.url_name == 'expenses' %}active{% endif %}">
                Xarajatlar
            </a>
            <a href="#" class="moliya-tab">
                To'lov usullari
            </a>
        </div>

        <div class="toolbar-actions z-2">
            {% include "components/profile_dropdown.html" %}
        </div>
    </div>
</div>
