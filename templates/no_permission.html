{% extends 'base.html' %}
{% block content %}

<div class="permission-wrapper d-flex justify-content-center align-items-center">
  <div class="permission-card text-center">

    <!-- 🚫 Icon -->
    <div class="permission-icon mx-auto mb-4">
      <span>🚫</span>
    </div>

    <h3 class="fw-bold text-light mb-1">Ruxsat yo‘q</h3>

    <p class="text-secondary permission-text">
      {{ message|default:"Sizda ushbu sahifaga kirish huquqi mavjud emas." }}
    </p>

    <a href="/" class="btn return-btn fw-semibold">
      🏠 Bosh sahifaga qaytish
    </a>

  </div>
</div>

<style>

/* --- WRAPPER (Mobile friendly) --- */
.permission-wrapper {
  min-height: 80vh;
  padding: 20px;
}

/* --- CARD (Responsive) --- */
.permission-card {
  width: 100%;
  max-width: 520px;
  background: rgba(255,255,255,0.03);
  border-radius: 18px;
  padding: 40px 30px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 25px rgba(0,0,0,0.25);
}

/* --- ICON --- */
.permission-icon {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: linear-gradient(135deg,#ef4444,#dc2626);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 25px rgba(239,68,68,0.5);
  animation: pulse 1.8s infinite ease-in-out;
}

.permission-icon span {
  font-size: 42px;
}

/* --- TEXT --- */
.permission-text {
  font-size: 1rem;
  margin-bottom: 24px;
}

/* --- BUTTON --- */
.return-btn {
  border: none;
  border-radius: 12px;
  padding: 12px 28px;
  color: #fff;
  background: linear-gradient(90deg,#2563eb,#38bdf8);
  box-shadow: 0 0 12px rgba(56,189,248,0.4);
  transition: 0.3s;
  display: inline-block;
}

/* Desktop hover only */
@media (hover:hover) {
  .return-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 18px rgba(56,189,248,0.6);
  }
}

/* --- ANIMATION --- */
@keyframes pulse {
  0% { transform: scale(1); box-shadow: 0 0 20px rgba(239,68,68,0.4); }
  50% { transform: scale(1.08); box-shadow: 0 0 30px rgba(239,68,68,0.7); }
  100% { transform: scale(1); box-shadow: 0 0 20px rgba(239,68,68,0.4); }
}

/* --- MOBILE OPTIMIZATION --- */
@media (max-width: 480px) {
  .permission-card {
    padding: 30px 22px;
  }

  .permission-icon {
    width: 75px;
    height: 75px;
  }

  .permission-icon span {
    font-size: 34px;
  }

  .permission-text {
    font-size: 0.9rem;
  }

  .return-btn {
    width: 100%;
    padding: 14px;
  }
}

</style>

{% endblock %}
