{% extends 'base.html' %}
{% block content %}

<style>
    .form-wrapper {
    max-width: 480px;
    margin: 60px auto;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 20px;
    padding: 25px 35px;
    box-shadow: 0 0 25px rgba(59, 130, 246, 0.25);
    color: #fff; /* 🔹 umumiy oq rang */
    backdrop-filter: blur(14px);
    }



    label {
    font-weight: 600;
    color: #ffffff !important; /* 🔥 To‘liq oq rang */
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.25); /* 🔹 Yengil yorqin effekt */
    margin-bottom: 6px;
    display: block;
    font-size: 15px;
    letter-spacing: 0.3px;
    }



  h3 {
    text-align: center;
    color: #fbbf24;
    font-weight: 700;
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }

 

  input, textarea {
    width: 100%;
    border: 1px solid rgba(148, 163, 184, 0.4);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
    color: #fff;
    padding: 10px 12px;
    margin-bottom: 16px;
    font-size: 15px;
    transition: 0.3s;
  }

  /* 🔹 Izoh maydonini kichikroq qilish */
  textarea {
    min-height: 70px;
    max-height: 100px;
    resize: vertical; /* foydalanuvchi xohlasa biroz kattalashtira oladi */
  }

  input:focus, textarea:focus {
    border-color: #fbbf24;
    box-shadow: 0 0 8px rgba(251, 191, 36, 0.4);
    outline: none;
  }

  /* 🔹 Drag & Drop rasm yuklash zonasi */
  .upload-zone {
    border: 2px dashed #fbbf24;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.04);
    padding: 25px;
    text-align: center;
    color: #facc15;
    font-weight: 500;
    cursor: pointer;
    transition: 0.3s;
  }

  .upload-zone:hover {
    background: rgba(251, 191, 36, 0.05);
    box-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
  }

  .upload-zone input[type="file"] {
    display: none;
  }

  .buttons {
    text-align: center;
    margin-top: 15px;
  }

  .save-btn {
    background: linear-gradient(90deg, #22c55e, #16a34a);
    border: none;
    padding: 10px 25px;
    border-radius: 8px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
  }

  .save-btn:hover {
    opacity: 0.85;
  }

  .back-btn {
    background: none;
    border: 1px solid #38bdf8;
    color: #38bdf8;
    border-radius: 8px;
    padding: 9px 22px;
    margin-left: 8px;
    font-weight: 500;
    transition: 0.3s;
  }

  .back-btn:hover {
    background: #38bdf8;
    color: #0f172a;
  }

</style>

<div class="form-wrapper">
  <h3>🛍️ Mahsulot qo‘shish</h3>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    
    <label for="id_nom">Nom:</label>
    {{ form.nom }}

    <label for="id_narx_chaqmoq">Narx chaqmoq:</label>
    {{ form.narx_chaqmoq }}

    <label for="id_izoh">Izoh:</label>
    {{ form.izoh }}

    <!-- 🖼️ Multiple image upload drag zone -->
    <label>Rasmlar:</label>
    <div class="upload-zone" id="drop-area">
      📸 Rasmlarni shu yerga tashlang yoki bosing
      <input type="file" name="rasmlar" id="fileInput" multiple>
    </div>

    <div class="buttons">
      <button type="submit" class="save-btn">💾 Saqlash</button>
      <a href="{% url 'store:products' %}" class="back-btn">⬅️ Orqaga</a>
    </div>
  </form>
</div>

<script>
  const dropArea = document.getElementById("drop-area");
  const fileInput = document.getElementById("fileInput");

  dropArea.addEventListener("click", () => fileInput.click());
  dropArea.addEventListener("dragover", e => {
    e.preventDefault();
    dropArea.style.borderColor = "#22c55e";
  });
  dropArea.addEventListener("dragleave", () => {
    dropArea.style.borderColor = "#fbbf24";
  });
  dropArea.addEventListener("drop", e => {
    e.preventDefault();
    fileInput.files = e.dataTransfer.files;
    dropArea.textContent = `${fileInput.files.length} ta fayl tanlandi`;
    dropArea.style.borderColor = "#22c55e";
  });
</script>

{% endblock %}
