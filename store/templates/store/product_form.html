{% extends 'base.html' %}
{% block content %}

<style>
  :root {
    --bg: #0f172a;
    --glass: rgba(255,255,255,0.06);
    --border: rgba(148,163,184,0.4);
    --accent: #facc15;
    --blue: #38bdf8;
    --green1: #22c55e;
    --green2: #16a34a;
    --muted: #9ca3af;
  }

  .form-wrapper {
    max-width: 520px;
    margin: 58px auto;
    background: var(--glass);
    border-radius: 22px;
    padding: 30px 35px;
    box-shadow: 0 0 25px rgba(56,189,248,0.24);
    color: #fff;
    backdrop-filter: blur(12px);
  }

  h3 {
    text-align: center;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 20px;
    letter-spacing: .5px;
  }

  label {
    font-weight: 600;
    color: #fff;
    margin-bottom: 6px;
    display: block;
    font-size: 15px;
    text-shadow: 0 0 6px rgba(255,255,255,0.25);
  }

  input, textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(255,255,255,0.07);
    padding: 12px 13px;
    color: #fff;
    margin-bottom: 16px;
    font-size: 15px;
    transition: 0.25s;
  }

  input:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(250,204,21,0.4);
    outline: none;
  }

  textarea {
    min-height: 80px;
    resize: vertical;
  }

  /* UPLOAD ZONE */
  .upload-zone {
    border: 2px dashed var(--accent);
    border-radius: 14px;
    background: rgba(255,255,255,0.04);
    padding: 27px;
    text-align: center;
    color: var(--accent);
    font-weight: 600;
    cursor: pointer;
    transition: 0.25s;
  }

  .upload-zone:hover {
    background: rgba(250,204,21,0.05);
    box-shadow: 0 0 12px rgba(250,204,21,0.3);
  }

  .upload-zone input {
    display: none;
  }

  /* PREVIEW */
  .preview-container {
    margin-top: 15px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .preview-container img {
    width: 85px;
    height: 85px;
    border-radius: 12px;
    object-fit: cover;
    border: 2px solid var(--accent);
    box-shadow: 0 0 8px rgba(250,204,21,0.45);
  }

  /* BUTTONS */
  .buttons {
    text-align: center;
    margin-top: 25px;
  }

  .save-btn {
    background: linear-gradient(90deg, var(--green1), var(--green2));
    border: none;
    padding: 11px 26px;
    border-radius: 12px;
    color: #fff;
    font-weight: 700;
    cursor: pointer;
    transition: .25s;
  }

  .save-btn:hover {
    opacity: .88;
  }

  .back-btn {
    background: none;
    border: 2px solid var(--blue);
    color: var(--blue);
    border-radius: 12px;
    padding: 10px 22px;
    margin-left: 10px;
    font-weight: 600;
    transition: .25s;
  }

  .back-btn:hover {
    background: var(--blue);
    color: var(--bg);
  }

  /* MOBILE OPTIMIZATION */
  @media (max-width: 540px) {
    .form-wrapper {
      padding: 25px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .back-btn {
      margin-left: 0;
    }
  }
</style>


<div class="form-wrapper">

  <h3>🛍️ Mahsulot qo‘shish</h3>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <label>Nom:</label>
    {{ form.nom }}

    <label>Narx (chaqmoq):</label>
    {{ form.narx_chaqmoq }}

    <label>Izoh:</label>
    {{ form.izoh }}

    <label>Rasmlar:</label>
    <div class="upload-zone" id="drop-area">
      📸 <b>Rasmlarni shu yerga tashlang yoki bosing</b>
      <input type="file" name="rasmlar" id="fileInput" multiple>
      <p id="file-count" style="margin-top:10px; color:var(--accent);"></p>
    </div>

    <div class="preview-container" id="preview-container"></div>

    <div class="buttons">
      <button type="submit" class="save-btn">💾 Saqlash</button>
      <a href="{% url 'store:products' %}" class="back-btn">⬅️ Orqaga</a>
    </div>

  </form>

</div>

<script>
  const dropArea = document.getElementById("drop-area");
  const inputFile = document.getElementById("fileInput");
  const previewContainer = document.getElementById("preview-container");
  const fileCountText = document.getElementById("file-count");

  dropArea.addEventListener("click", () => inputFile.click());

  dropArea.addEventListener("dragover", e => {
    e.preventDefault();
    dropArea.style.borderColor = "#22c55e";
  });

  dropArea.addEventListener("dragleave", () => {
    dropArea.style.borderColor = "#facc15";
  });

  dropArea.addEventListener("drop", e => {
    e.preventDefault();
    inputFile.files = e.dataTransfer.files;
    showPreview();
  });

  inputFile.addEventListener("change", showPreview);

  function showPreview() {
    previewContainer.innerHTML = "";
    const files = [...inputFile.files];

    if (files.length > 0) {
      fileCountText.textContent = files.length + " ta rasm tanlandi";
      dropArea.style.borderColor = "#22c55e";
    } else {
      fileCountText.textContent = "";
    }

    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.createElement("img");
        img.src = e.target.result;
        previewContainer.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  }
</script>

{% endblock %}
