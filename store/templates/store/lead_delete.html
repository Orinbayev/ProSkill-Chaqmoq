{% extends 'base.html' %}
{% block body_class %}lead-delete-page{% endblock %}
{% block content %}

<main class="ld-shell" aria-labelledby="ld-title">
  <div class="ld-bg" aria-hidden="true"></div>

  <section class="ld-wrap container">
    <div class="delete-wrapper d-flex justify-content-center align-items-center">
      <div class="delete-card text-center" role="dialog" aria-modal="true" aria-describedby="ld-desc">

        <div class="delete-icon mx-auto" aria-hidden="true">
          🗑️
        </div>

        <h4 class="delete-title" id="ld-title">
          "{{ lead.ism }} {{ lead.familya }}" ni o‘chirmoqchimisiz?
        </h4>

        <p class="delete-text" id="ld-desc">
          Bu amalni ortga qaytarib bo‘lmaydi.
        </p>

        <form method="POST" class="mt-4 ld-actions">
          {% csrf_token %}

          <button type="submit" class="btn btn-delete">
            Ha, o‘chir
          </button>

          <a href="{% url 'store:lead_list' %}" class="btn btn-cancel">
            Yo‘q, qaytish
          </a>
        </form>

      </div>
    </div>
  </section>
</main>

<style>
  :root{
    --bg0:#070b14;
    --bg1:#0b1220;
    --bg2:#0f1b33;

    --card: rgba(255,255,255,0.06);
    --card2: rgba(255,255,255,0.10);
    --line: rgba(255,255,255,0.12);

    --text:#e5e7eb;
    --muted:#9ca3af;

    --amber:#f59e0b;
    --amber2:#facc15;

    --danger:#ef4444;
    --danger2:#dc2626;

    --shadow: 0 24px 70px rgba(0,0,0,.55);
    --radius: 20px;

    --ring: 0 0 0 4px rgba(245,158,11,.18), 0 0 18px rgba(245,158,11,.28);
    --ring-danger: 0 0 0 4px rgba(239,68,68,.18), 0 0 18px rgba(239,68,68,.28);
  }

  .ld-shell{
    position: relative;
    min-height: calc(100svh - 1px);
    padding: clamp(14px, 2.5vw, 26px) 0;
    color: var(--text);
  }

  .ld-bg{
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(900px 420px at 18% 10%, rgba(245,158,11,.12), transparent 60%),
      radial-gradient(760px 380px at 85% 18%, rgba(56,189,248,.10), transparent 60%),
      radial-gradient(980px 520px at 55% 92%, rgba(34,197,94,.08), transparent 62%),
      linear-gradient(160deg, var(--bg0), var(--bg1) 45%, var(--bg2));
  }

  .ld-wrap{
    max-width: 980px;
    margin-top: 8px;
  }

  /* WRAPPER (keep existing classes) */
  .delete-wrapper{
    min-height: 70vh;
    padding: 20px;
  }

  /* CARD (keep existing class) */
  .delete-card{
    position: relative;
    width: 100%;
    max-width: 520px;
    border-radius: var(--radius);
    padding: clamp(18px, 2.5vw, 30px) clamp(16px, 2.6vw, 30px) clamp(18px, 2.7vw, 34px);
    color: var(--text);
    background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow: hidden;
  }

  .delete-card::before{
    content:"";
    position:absolute;
    inset:-2px;
    background:
      radial-gradient(420px 220px at 12% 10%, rgba(245,158,11,.10), transparent 58%),
      radial-gradient(420px 220px at 88% 0%, rgba(250,204,21,.10), transparent 55%),
      radial-gradient(560px 260px at 70% 110%, rgba(239,68,68,.10), transparent 60%);
    pointer-events:none;
    opacity: .95;
  }

  .delete-card > *{ position: relative; }

  /* ICON (keep existing class) */
  .delete-icon{
    width: 88px;
    height: 88px;
    border-radius: 999px;
    background: rgba(239,68,68,0.14);
    font-size: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--danger);
    margin-bottom: 18px;
    box-shadow: 0 0 22px rgba(239,68,68,.30);
    border: 1px solid rgba(239,68,68,.22);
  }

  /* TITLE/TEXT (keep existing classes) */
  .delete-title{
    font-size: clamp(1.15rem, 1rem + 0.8vw, 1.45rem);
    font-weight: 800;
    margin: 0 0 8px;
    letter-spacing: .2px;
    text-shadow: 0 10px 30px rgba(0,0,0,.45);
  }

  .delete-text{
    color: rgba(203,213,225,0.95);
    font-size: 0.98rem;
    margin: 0;
  }

  /* ACTIONS */
  .ld-actions{
    display: grid;
    gap: 10px;
    margin-top: 18px;
  }

  @media (min-width: 520px){
    .ld-actions{
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: center;
    }
  }

  /* BUTTONS (keep existing classes + bootstrap compatibility) */
  .btn{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    gap: 10px;
    min-height: 46px;
    border-radius: 14px;
    padding: 12px 16px;
    font-weight: 800;
    letter-spacing: .2px;
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease, background .18s ease, border-color .18s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .btn-delete{
    border: 1px solid rgba(239,68,68,0.35);
    color: #0a0a0a;
    background: linear-gradient(135deg, var(--danger), var(--danger2));
    box-shadow: 0 16px 42px rgba(0,0,0,.42), 0 0 24px rgba(239,68,68,.22);
  }

  .btn-cancel{
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    box-shadow: 0 14px 38px rgba(0,0,0,.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  @media (hover:hover){
    .btn-delete:hover{
      transform: translateY(-2px);
      filter: saturate(1.05);
      box-shadow: 0 18px 60px rgba(0,0,0,.55), 0 0 32px rgba(239,68,68,.32);
    }
    .btn-cancel:hover{
      transform: translateY(-2px);
      background: rgba(255,255,255,0.10);
      border-color: rgba(245,158,11,0.28);
      box-shadow: 0 18px 60px rgba(0,0,0,.50), 0 0 26px rgba(245,158,11,.14);
    }
  }

  .btn:active{
    transform: translateY(0px) scale(.99);
  }

  .btn:focus-visible{
    outline: none;
    box-shadow: var(--ring);
  }

  .btn-delete:focus-visible{
    box-shadow: var(--ring-danger);
  }

  /* MOBILE OPTIMIZATION (keep your rule intent) */
  @media (max-width: 480px){
    .delete-wrapper{ padding: 16px; }
    .delete-card{ padding: 22px; }
    form .btn-delete,
    form .btn-cancel{
      width: 100%;
      margin: 0;
    }
  }

  @media (prefers-reduced-motion: reduce){
    .btn{ transition: none !important; }
  }
</style>

{% endblock %}
