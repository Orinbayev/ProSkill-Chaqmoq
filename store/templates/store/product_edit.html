{% extends 'base.html' %}
{% block content %}

<style>
  .form-wrapper {
    max-width: 480px;
    margin: 60px auto;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 20px;
    padding: 25px 35px;
    box-shadow: 0 0 25px rgba(59, 130, 246, 0.25);
    color: #fff;
    backdrop-filter: blur(14px);
  }
  label {
    font-weight: 600;
    color: #ffffff !important;
    margin-bottom: 6px;
    display: block;
    font-size: 15px;
  }
  h3 {
    text-align: center;
    color: #fbbf24;
    font-weight: 700;
    margin-bottom: 20px;
  }
  input, textarea {
    width: 100%;
    border: 1px solid rgba(148, 163, 184, 0.4);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.07);
    color: #fff;
    padding: 10px 12px;
    margin-bottom: 16px;
  }
  .upload-zone {
    border: 2px dashed #fbbf24;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.04);
    padding: 25px;
    text-align: center;
    color: #facc15;
    font-weight: 500;
    cursor: pointer;
    transition: 0.3s;
  }
  .upload-zone input[type="file"] {
    display: none;
  }
  .preview-container {
    margin-top: 15px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }
  .preview-container img {
    width: 80px;
    height: 80px;
    border-radius: 10px;
    object-fit: cover;
    border: 2px solid #facc15;
  }
  .buttons { text-align: center; margin-top: 20px; }
  .save-btn {
    background: linear-gradient(90deg, #22c55e, #16a34a);
    border: none; padding: 10px 25px;
    border-radius: 8px; color: white;
    font-weight: 600; cursor: pointer;
  }
  .back-btn {
    background: none; border: 1px solid #38bdf8;
    color: #38bdf8; border-radius: 8px;
    padding: 9px 22px; margin-left: 8px;
  }
</style>

<div class="form-wrapper">
  <h3>✏️ Mahsulotni tahrirlash</h3>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    
    <label for="id_nom">Nom:</label>
    {{ form.nom }}

    <label for="id_narx_chaqmoq">Narx chaqmoq:</label>
    {{ form.narx_chaqmoq }}

    <label for="id_izoh">Izoh:</label>
    {{ form.izoh }}

    <label>Yuklangan rasmlar:</label>
    <div class="preview-container">
      {% for r in rasmlar %}
        <img src="{{ r.rasm.url }}" alt="rasm">
      {% empty %}
        <p class="text-muted">Rasm mavjud emas</p>
      {% endfor %}
    </div>

    <hr style="margin:20px 0;border-color:rgba(255,255,255,0.1);">

    <label>Yangi rasm qo‘shish:</label>
    <div class="upload-zone" id="drop-area">
      📸 Rasmlarni shu yerga tashlang yoki bosing
      <input type="file" name="rasmlar" id="fileInput" multiple>
      <p id="file-count" style="margin-top:10px; color:#facc15;"></p>
    </div>

    <div class="preview-container" id="preview-container"></div>

    <div class="buttons">
      <button type="submit" class="save-btn">💾 Saqlash</button>
      <a href="{% url 'store:products' %}" class="back-btn">⬅️ Orqaga</a>
    </div>
  </form>
</div>

<script>
  const dropArea = document.getElementById("drop-area");
  const fileInput = document.getElementById("fileInput");
  const previewContainer = document.getElementById("preview-container");
  const fileCountText = document.getElementById("file-count");

  dropArea.addEventListener("click", () => fileInput.click());
  dropArea.addEventListener("dragover", e => { e.preventDefault(); dropArea.style.borderColor = "#22c55e"; });
  dropArea.addEventListener("dragleave", () => { dropArea.style.borderColor = "#fbbf24"; });
  dropArea.addEventListener("drop", e => {
    e.preventDefault();
    fileInput.files = e.dataTransfer.files;
    showPreview();
  });

  fileInput.addEventListener("change", showPreview);

  function showPreview() {
    previewContainer.innerHTML = "";
    const files = fileInput.files;
    if (files.length > 0) fileCountText.textContent = `${files.length} ta yangi rasm tanlandi`;
    [...files].forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.createElement("img");
        img.src = e.target.result;
        previewContainer.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  }
</script>

{% endblock %}
