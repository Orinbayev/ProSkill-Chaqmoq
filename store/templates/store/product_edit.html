{% extends 'base.html' %}
{% block content %}

<style>
  :root {
    --bg: #0f172a;
    --panel: rgba(255,255,255,0.06);
    --accent: #facc15;
    --blue: #38bdf8;
    --green1: #22c55e;
    --green2: #16a34a;
    --muted: #9ca3af;
  }

  .form-wrapper {
    max-width: 620px;
    margin: 55px auto;
    background: var(--panel);
    border-radius: 22px;
    padding: 30px 35px;
    box-shadow: 0 0 25px rgba(56,189,248,0.2);
    color: #fff;
    backdrop-filter: blur(12px);
  }

  h3 {
    text-align: center;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 25px;
    letter-spacing: .5px;
  }

  label {
    font-weight: 600;
    margin-bottom: 6px;
    display: block;
    font-size: 15px;
  }

  input, textarea, select {
    width: 100%;
    border-radius: 10px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(148,163,184,0.4);
    padding: 10px 12px;
    color: #fff;
    margin-bottom: 16px;
    transition: 0.25s;
  }

  input:focus, textarea:focus {
    border-color: var(--accent);
    outline: none;
  }

  /* ----- UPLOAD ZONE ----- */
  .upload-zone {
    border: 2px dashed var(--accent);
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    padding: 28px;
    text-align: center;
    color: var(--accent);
    font-weight: 500;
    cursor: pointer;
    transition: 0.25s;
  }
  .upload-zone:hover {
    background: rgba(250,204,21,0.05);
    box-shadow: 0 0 12px rgba(250,204,21,0.35);
  }
  .upload-zone input[type="file"] {
    display: none;
  }

  /* ----- PREVIEW ----- */
  .preview-container {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
  }
  .preview-item {
    position: relative;
  }
  .preview-item img {
    width: 95px;
    height: 95px;
    border-radius: 12px;
    object-fit: cover;
    border: 2px solid var(--accent);
    box-shadow: 0 0 8px rgba(250,204,21,0.4);
  }

  .delete-btn {
    position: absolute;
    top: -8px; right: -8px;
    background: #dc2626;
    border: none;
    color: #fff;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  .delete-btn:hover {
    background: #b91c1c;
    transform: scale(1.1);
  }

  /* ----- BUTTONS ----- */
  .buttons {
    text-align: center;
    margin-top: 30px;
  }

  .save-btn {
    background: linear-gradient(90deg, var(--green1), var(--green2));
    border: none;
    padding: 10px 26px;
    border-radius: 10px;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }

  .back-btn {
    background: none;
    border: 2px solid var(--blue);
    color: var(--blue);
    border-radius: 10px;
    padding: 9px 22px;
    margin-left: 10px;
    font-weight: 500;
    transition: 0.25s;
  }
  .back-btn:hover {
    background: var(--blue);
    color: var(--bg);
  }

  /* MOBILE FIXES */
  @media (max-width: 540px) {
    .form-wrapper { padding: 25px; }

    .preview-item img {
      width: 85px;
      height: 85px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .back-btn {
      margin-left: 0;
    }
  }
</style>


<div class="form-wrapper">

  <h3>✏️ Mahsulotni tahrirlash</h3>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <label>Nom:</label>
    {{ form.nom }}

    <label>Narx (chaqmoq):</label>
    {{ form.narx_chaqmoq }}

    <label>Izoh:</label>
    {{ form.izoh }}

    <hr style="border-color:rgba(255,255,255,0.12); margin:22px 0;">

    <!-- EXISTING IMAGES -->
    <label>Yuklangan rasmlar:</label>

    <div class="preview-container">
      {% for r in rasmlar %}
      <div class="preview-item">
        <img src="{{ r.rasm.url }}" alt="rasm">
        <form method="POST" action="{% url 'store:delete_product_image' r.id %}">
          {% csrf_token %}
          <button type="submit" class="delete-btn">✕</button>
        </form>
      </div>
      {% empty %}
      <p class="text-muted">Rasm mavjud emas</p>
      {% endfor %}
    </div>

    <hr style="border-color:rgba(255,255,255,0.12); margin:25px 0;">

    <!-- NEW IMAGE UPLOAD -->
    <label>Yangi rasm qo‘shish:</label>
    <div class="upload-zone" id="drop-area">
      📸 <b>Rasmlarni tashlang yoki bosing</b>
      <input type="file" name="rasmlar" id="fileInput" multiple>
      <p id="file-count" style="margin-top:10px; color:var(--accent);"></p>
    </div>

    <div id="preview-container" class="preview-container"></div>

    <div class="buttons">
      <button type="submit" class="save-btn">💾 Saqlash</button>
      <a href="{% url 'store:products' %}" class="back-btn">⬅️ Orqaga</a>
    </div>

  </form>
</div>


<script>
  const dropArea = document.getElementById("drop-area");
  const fileInput = document.getElementById("fileInput");
  const previewContainer = document.getElementById("preview-container");
  const fileCountText = document.getElementById("file-count");

  dropArea.addEventListener("click", () => fileInput.click());

  dropArea.addEventListener("dragover", e => {
    e.preventDefault();
    dropArea.style.borderColor = "#22c55e";
  });

  dropArea.addEventListener("dragleave", () => {
    dropArea.style.borderColor = "#facc15";
  });

  dropArea.addEventListener("drop", e => {
    e.preventDefault();
    fileInput.files = e.dataTransfer.files;
    showPreview();
  });

  fileInput.addEventListener("change", showPreview);

  function showPreview() {
    previewContainer.innerHTML = "";
    const files = [...fileInput.files];

    if (files.length > 0) {
      fileCountText.textContent = files.length + " ta yangi rasm tanlandi";
    }

    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.createElement("img");
        img.src = e.target.result;
        img.style.width = "95px";
        img.style.height = "95px";
        img.style.objectFit = "cover";
        img.style.borderRadius = "12px";
        previewContainer.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  }
</script>

{% endblock %}
